							<input id="course-search" type="search" placeholder="" autocomplete="off" data-course-search data-ui-placeholder="learning.searchPlaceholder" />

						</div>
						<p class="course-search-status" aria-live="polite" data-ui-text="learning.loadingStatus"></p>
					</div>

					<div class="course-card-grid" data-course-list aria-live="polite"></div>

					<div class="empty-state course-empty-state" data-course-empty hidden>
						<h2 data-ui-text="learning.noResultsTitle"></h2>
						<p data-ui-text="learning.noResultsText"></p>
