          + direction[2] ** 2 * invC2;
        return { direction, invA2, invC2, quadraticA };
      }

      pointOccluded(point, geometry = this.occlusionGeometry()) {
        const { direction, invA2, invC2, quadraticA } = geometry;
        const quadraticB = 2 * ((point[0] * direction[0] + point[1] * direction[1]) * invA2
          + point[2] * direction[2] * invC2);
        const quadraticC = (point[0] ** 2 + point[1] ** 2) * invA2
          + point[2] ** 2 * invC2 - 1;
        const discriminant = quadraticB * quadraticB - 4 * quadraticA * quadraticC;
        if (discriminant < 0) return false;
        const root = Math.sqrt(discriminant);
        const t1 = (-quadraticB - root) / (2 * quadraticA);
        const t2 = (-quadraticB + root) / (2 * quadraticA);
        return t1 > 1e-5 || t2 > 1e-5;
      }

      interpolateWorld(a, b, fraction) {
        return [
          a[0] + fraction * (b[0] - a[0]),
          a[1] + fraction * (b[1] - a[1]),
          a[2] + fraction * (b[2] - a[2])
        ];
      }

      visibilityBoundary(a, b, aOccluded, geometry) {
        let left = a;
        let right = b;
        for (let iteration = 0; iteration < 16; iteration += 1) {
          const middle = this.interpolateWorld(left, right, 0.5);
          if (this.pointOccluded(middle, geometry) === aOccluded) left = middle;
          else right = middle;
        }
        return this.interpolateWorld(left, right, 0.5);
      }

      visibleWorldSegments(a, b, geometry) {
        const middle = this.interpolateWorld(a, b, 0.5);
        const aOccluded = this.pointOccluded(a, geometry);
        const middleOccluded = this.pointOccluded(middle, geometry);
        const bOccluded = this.pointOccluded(b, geometry);
        if (aOccluded === middleOccluded && middleOccluded === bOccluded) {
          return aOccluded ? [] : [[a, b]];
        }
        const visible = [];
        const halves = [
          [a, middle, aOccluded, middleOccluded],
          [middle, b, middleOccluded, bOccluded]
        ];
        for (const [fromWorld, toWorld, fromOccluded, toOccluded] of halves) {
          if (fromOccluded === toOccluded) {
            if (!fromOccluded) visible.push([fromWorld, toWorld]);
            continue;
          }
          const boundary = this.visibilityBoundary(fromWorld, toWorld, fromOccluded, geometry);
          const visibleFrom = fromOccluded ? boundary : fromWorld;
          const visibleTo = toOccluded ? boundary : toWorld;
          visible.push([visibleFrom, visibleTo]);
        }
        return visible;
      }

      drawOcclusionClippedSegment(ctx, layout, a, b, alpha, geometry) {
        for (const [visibleFrom, visibleTo] of this.visibleWorldSegments(a, b, geometry)) {
          this.drawAnimatedSegment(
            ctx, this.project(visibleFrom, layout), this.project(visibleTo, layout), alpha
          );
        }
      }

      drawStars(ctx, width, height) {
        ctx.fillStyle = "#02050b";
        ctx.fillRect(0, 0, width, height);
        for (const star of this.stars) {
          ctx.fillStyle = `rgba(235,241,249,${star.alpha})`;
          ctx.beginPath();
          ctx.arc(star.x * width, star.y * height, star.radius, 0, TWO_PI);
          ctx.fill();
        }
      }

      drawAxes(ctx, layout) {
        const axes = [
          { endpoint: [9, 0, 0], label: "x" },
          { endpoint: [0, 9, 0], label: "y" },
          { endpoint: [0, 0, 9], label: "z" }
        ];
        const origin = this.project([0, 0, 0], layout);
        ctx.lineWidth = 0.8;
        ctx.strokeStyle = "rgba(205,213,222,0.36)";
        ctx.fillStyle = "rgba(221,227,234,0.68)";
        ctx.font = "12px ui-sans-serif, sans-serif";
        for (const axis of axes) {
          const endpoint = this.project(axis.endpoint, layout);
          ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(endpoint.x, endpoint.y); ctx.stroke();
          ctx.fillText(axis.label, endpoint.x + 4, endpoint.y - 3);
        }
      }

      drawSightline(ctx, layout) {
        if (!this.params) return;
        const theta = this.params.inclination * Math.PI / 180;
        const spin = this.params.spin || 0;
        const observerRadius = this.params.distance || DEFAULT_OBSERVER_DISTANCE;
        const observerDirection = normalize([
          Math.sqrt(observerRadius * observerRadius + spin * spin) * Math.sin(theta),
          0,
          observerRadius * Math.cos(theta)
        ]);
        const axes = this.horizonAxes();
        const inverseSurfaceRadiusSquared = (
          (observerDirection[0] ** 2 + observerDirection[1] ** 2)
            / (axes.equatorial * axes.equatorial)
          + observerDirection[2] ** 2 / (axes.polar * axes.polar)
        );
        const horizonIntersectionDistance = 1 / Math.sqrt(inverseSurfaceRadiusSquared);
        const seamOverlap = 1.5 / layout.scale;
        const start = this.project(scale(observerDirection, 45), layout);
        const end = this.project(
          scale(observerDirection, Math.max(0, horizonIntersectionDistance - seamOverlap)),
          layout
        );
        ctx.save();
        ctx.setLineDash([6, 8]);
        ctx.lineWidth = 0.8;
        ctx.strokeStyle = "rgba(190,199,210,0.22)";
        ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.lineTo(end.x, end.y); ctx.stroke();
        ctx.restore();
      }

      horizonHull(layout) {
        const axes = this.horizonAxes();
        const points = [];
        for (let latitude = 0; latitude <= 18; latitude += 1) {
          const theta = Math.PI * latitude / 18;
          for (let longitude = 0; longitude < 48; longitude += 1) {
            const phi = TWO_PI * longitude / 48;
            const point = [
              axes.equatorial * Math.sin(theta) * Math.cos(phi),
              axes.equatorial * Math.sin(theta) * Math.sin(phi),
              axes.polar * Math.cos(theta)
            ];
            const projected = this.project(point, layout);
            points.push([projected.x, projected.y]);
          }
        }
        return convexHull(points);
      }

      drawHorizon(ctx, layout) {
        const hull = this.horizonHull(layout);
        if (hull.length < 3) return;
        const xs = hull.map(point => point[0]);
        const ys = hull.map(point => point[1]);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const minY = Math.min(...ys), maxY = Math.max(...ys);
        const radius = Math.max(maxX - minX, maxY - minY) * 0.65;
        const gradient = ctx.createRadialGradient(
          minX + 0.38 * (maxX - minX),
          minY + 0.34 * (maxY - minY),
          0,
          0.5 * (minX + maxX),
          0.5 * (minY + maxY),
          radius
        );
        gradient.addColorStop(0, "#0d1726");
        gradient.addColorStop(0.48, "#060b14");
        gradient.addColorStop(1, "#000103");
        ctx.beginPath();
        hull.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point[0], point[1]); else ctx.lineTo(point[0], point[1]);
        });
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.lineWidth = 1.45;
        ctx.strokeStyle = "rgba(126,39,35,0.92)";
        ctx.stroke();
      }

      drawPathLayer(ctx, layout, width, color) {
        if (this.path.length < 2) return;
        const geometry = this.occlusionGeometry();
        ctx.lineWidth = width;
        ctx.lineCap = "butt";
        ctx.lineJoin = "round";
        ctx.strokeStyle = color;
        ctx.beginPath();
        let lastProjected = null;
        for (let index = 1; index < this.path.length; index += 1) {
          const previous = this.path[index - 1];
          const current = this.path[index];
          const pieces = this.visibleWorldSegments(
            [previous.x, previous.y, previous.z],
            [current.x, current.y, current.z],
            geometry
          );
          if (!pieces.length) {
            lastProjected = null;
            continue;
          }
          for (const [fromWorld, toWorld] of pieces) {
            const from = this.project(fromWorld, layout);
            const to = this.project(toWorld, layout);
            const continuous = lastProjected
              && Math.hypot(from.x - lastProjected.x, from.y - lastProjected.y) < 0.35;
            if (!continuous) ctx.moveTo(from.x, from.y);
            else ctx.lineTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            lastProjected = to;
          }
        }
        ctx.stroke();
      }

      drawPath(ctx, layout) {
        this.drawPathLayer(ctx, layout, 3.0, "rgba(150,36,24,0.34)");
        this.drawPathLayer(ctx, layout, 1.55, "rgba(255,103,21,0.95)");
        this.drawPathLayer(ctx, layout, 0.55, "rgba(255,218,72,0.96)");
      }

      pointOnRay(ray, progress) {
        const target = ray.affineStart + clamp(progress, 0, 1) * ray.affineSpan;
        let low = 0;
        let high = ray.points.length - 1;
        while (high - low > 1) {
          const middle = Math.floor((low + high) / 2);
          if ((ray.points[middle].affine ?? middle) <= target) low = middle;
          else high = middle;
        }
        const index = Math.min(ray.points.length - 2, low);
        const a = ray.points[index];
        const b = ray.points[index + 1];
        const aAffine = a.affine ?? index;
        const bAffine = b.affine ?? index + 1;
        const fraction = clamp((target - aAffine) / Math.max(1e-12, bAffine - aAffine), 0, 1);
        return [
          a.x + fraction * (b.x - a.x),
          a.y + fraction * (b.y - a.y),
          a.z + fraction * (b.z - a.z)
        ];
      }

      smoothstep(low, high, value) {
        const t = clamp((value - low) / Math.max(1e-12, high - low), 0, 1);
        return t * t * (3 - 2 * t);
      }

      drawAnimatedSegment(ctx, from, to, alpha) {
        ctx.lineCap = "round";
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = `rgba(166,42,23,${0.48 * alpha})`;
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
        ctx.lineWidth = 1.35;
        ctx.strokeStyle = `rgba(255,111,24,${0.96 * alpha})`;
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
        ctx.lineWidth = 0.55;
        ctx.strokeStyle = `rgba(255,218,70,${alpha})`;
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
      }

      drawAnimatedRays(ctx, layout, now) {
        if (this.visibleMode === "whole") return;
        const before = this.animatedRays.length;
        this.animatedRays = this.animatedRays.filter(ray => ray.loop || now <= ray.startTime + ray.duration);
        if (before !== this.animatedRays.length) this.onRaySetChanged?.();
        const rays = this.animatedRays.filter(ray => ray.mode === this.visibleMode);
        for (const ray of rays) {
          const sinceStart = now - ray.startTime;
          if (sinceStart < 0) continue;
          const cycle = ray.duration + ray.gap;
          const elapsed = ray.loop ? sinceStart % cycle : sinceStart;
          if (elapsed < 0 || elapsed > ray.duration) continue;
          const timelineProgress = clamp(elapsed / ray.duration, 0, 1);
          const playbackProgress = this.playbackDirection === "forward" ? 1 - timelineProgress : timelineProgress;
          const timelineStart = ray.timelineStart ?? ray.affineStart;
          const timelineEnd = ray.timelineEnd ?? ray.affineEnd;
          const timelineSpan = Math.max(1e-9, timelineEnd - timelineStart);
          const targetAffine = timelineStart + playbackProgress * timelineSpan;
          const headProgress = (targetAffine - ray.affineStart) / ray.affineSpan;
          if (headProgress < 0 || headProgress > 1) continue;
          const tailAffine = targetAffine + (this.playbackDirection === "forward" ? 1 : -1)
            * this.trailFraction * timelineSpan;
          const tailProgress = this.playbackDirection === "forward"
            ? clamp((tailAffine - ray.affineStart) / ray.affineSpan, headProgress, 1)
            : clamp((tailAffine - ray.affineStart) / ray.affineSpan, 0, headProgress);
          const wholeFade = this.smoothstep(0, 0.07, timelineProgress)
            * (1 - this.smoothstep(0.91, 1, timelineProgress));
          const segments = clamp(Math.round(80 + 24 * Math.log2(Math.max(1, this.zoom))), 80, 192);
          const geometry = this.occlusionGeometry();
          let previousWorld = this.pointOnRay(ray, tailProgress);
          for (let index = 1; index <= segments; index += 1) {
            const fraction = index / segments;
            const progress = tailProgress + fraction * (headProgress - tailProgress);
            const world = this.pointOnRay(ray, progress);
            const tailFade = this.smoothstep(0, 1, fraction);
            this.drawOcclusionClippedSegment(
              ctx, layout, previousWorld, world, wholeFade * tailFade, geometry
            );
            previousWorld = world;
          }
        }
      }

      drawSpecialPoint(ctx, layout) {
        if (!this.hovered || !this.result?.points?.length) return;
        const point = this.result.points[this.result.minIndex];
        if (!point || this.pointOccluded([point.x, point.y, point.z])) return;
        const projected = this.project([point.x, point.y, point.z], layout);
        ctx.fillStyle = "#fff8eb";
        ctx.strokeStyle = "#9d3729";
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(projected.x, projected.y, 4.5, 0, TWO_PI); ctx.fill(); ctx.stroke();
        const label = `rmin = ${this.result.minR.toFixed(8)} M`;
        ctx.font = "12px ui-sans-serif, sans-serif";
        const width = ctx.measureText(label).width + 10;
        const labelX = projected.x + 10;
        const labelY = projected.y - 12;
        ctx.fillStyle = "rgba(2,5,11,0.78)";
        ctx.fillRect(labelX - 4, labelY - 13, width, 19);
        ctx.fillStyle = "#e9a08a";
        ctx.fillText(label, labelX, labelY);
      }

      distanceToProjectedPath(x, y) {
        if (this.path.length < 2) return Number.POSITIVE_INFINITY;
        const layout = this.layout();
        let best = Number.POSITIVE_INFINITY;
        for (let index = 1; index < this.path.length; index += 1) {
          const a = this.project([this.path[index - 1].x, this.path[index - 1].y, this.path[index - 1].z], layout);
          const b = this.project([this.path[index].x, this.path[index].y, this.path[index].z], layout);
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const denominator = dx * dx + dy * dy;
          const fraction = denominator > 0 ? clamp(((x - a.x) * dx + (y - a.y) * dy) / denominator, 0, 1) : 0;
          best = Math.min(best, Math.hypot(x - (a.x + fraction * dx), y - (a.y + fraction * dy)));
        }
        return best;
      }

      draw(animationNow = performance.now()) {
        const { context: ctx, width, height } = setCanvasSize(this.canvas);
        const layout = this.layout();
        ctx.clearRect(0, 0, width, height);
        this.drawStars(ctx, width, height);
        this.drawAxes(ctx, layout);
        this.drawSightline(ctx, layout);
        this.drawHorizon(ctx, layout);
        if (this.visibleMode === "whole") {
          this.drawPath(ctx, layout);
          this.drawSpecialPoint(ctx, layout);
        } else {
          const now = this.animationPaused ? (this.pauseStartedAt ?? animationNow) : animationNow;
          this.drawAnimatedRays(ctx, layout, now);
        }
      }
    }

    const renderer = new KerrRenderer(ui.orbitCanvas);

    function normalizePolarDegrees(value) {
      if (!Number.isFinite(value)) return 0;
      const normalized = value >= -180 && value < 180
        ? value
        : ((value + 180) % 360 + 360) % 360 - 180;
      return Math.abs(normalized) < Number.EPSILON ? 0 : normalized;
    }

    function fixedTextFromInput(rawText, normalizedValue) {
      const value = Object.is(normalizedValue, -0) ? 0 : normalizedValue;
      const text = String(rawText ?? "").trim();
      const match = text.match(/^([+-]?)(\d*)(?:\.(\d*))?$/);
      if (match && (match[2] || match[3]) && Number(text) === value) {
        const sign = value < 0 ? "-" : "";
        const integer = (match[2] || "0").replace(/^0+(?=\d)/, "") || "0";
        const fraction = match[3] || "";
        if (fraction.length <= DISPLAY_DECIMALS) {
          return `${sign}${integer}.${fraction.padEnd(DISPLAY_DECIMALS, "0")}`;
        }
      }
      return value.toFixed(DISPLAY_DECIMALS);
    }

    function decimalTextToScaledInteger(text) {
      const match = String(text).trim().match(/^([+-]?)(\d*)(?:\.(\d*))?$/);
      if (!match || (!match[2] && !match[3])) return null;
      const fraction = match[3] || "";
      if (fraction.length > DISPLAY_DECIMALS) return null;
      const scaleValue = 10n ** BigInt(DISPLAY_DECIMALS);
      const integerPart = BigInt(match[2] || "0") * scaleValue;
      const fractionPart = BigInt((fraction || "0").padEnd(DISPLAY_DECIMALS, "0"));
      const magnitude = integerPart + fractionPart;
      return match[1] === "-" ? -magnitude : magnitude;
    }

    function scaledIntegerToFixedText(value) {
      const scaleValue = 10n ** BigInt(DISPLAY_DECIMALS);
      const sign = value < 0n ? "-" : "";
      const magnitude = value < 0n ? -value : value;
      const integer = magnitude / scaleValue;
      const fraction = String(magnitude % scaleValue).padStart(DISPLAY_DECIMALS, "0");
      return `${sign}${integer}.${fraction}`;
    }

    function rememberDigitCaret(input) {
      if (Number.isInteger(input.selectionStart)) digitCaretPositions.set(input, input.selectionStart);
    }

    function digitStepAtCaret(input) {
      const text = input.value;
      let caret = digitCaretPositions.get(input);
      if (!Number.isInteger(caret)) {
        const decimal = text.indexOf(".");
        caret = decimal >= 0 ? decimal + 3 : text.length;
      }
      caret = clamp(caret, 0, text.length);
      let digitIndex = caret > 0 && /\d/.test(text[caret - 1]) ? caret - 1 : caret;
      while (digitIndex < text.length && !/\d/.test(text[digitIndex])) digitIndex += 1;
      if (digitIndex >= text.length) {
        digitIndex = Math.max(0, caret - 1);
        while (digitIndex > 0 && !/\d/.test(text[digitIndex])) digitIndex -= 1;
      }
      const decimalIndex = text.indexOf(".") >= 0 ? text.indexOf(".") : text.length;
      const exponent = digitIndex < decimalIndex
        ? decimalIndex - digitIndex - 1
        : decimalIndex - digitIndex;
      return Math.pow(10, exponent);
    }

    function formatDigitStep(step) {
      if (step >= 1) return step.toFixed(0);
      const decimals = Math.max(0, Math.round(-Math.log10(step)));
      return step.toFixed(decimals);
    }

    function updateDigitStepDisplay(input) {
      const display = input.closest("[data-trace-mode]")?.querySelector("[data-digit-step-display]");
      if (display) display.textContent = formatDigitStep(digitStepAtCaret(input));
    }

    function exactDigitStep(text, step, direction) {
      const scaledValue = decimalTextToScaledInteger(text);
      if (scaledValue === null) return null;
      const exponent = Math.round(Math.log10(step));
      const scaledExponent = DISPLAY_DECIMALS + exponent;
      if (scaledExponent < 0) return null;
      const scaledStep = 10n ** BigInt(scaledExponent);
      return scaledIntegerToFixedText(scaledValue + BigInt(direction) * scaledStep);
    }

    function coordinateInput(mode, component) {
      return ui.coordinateInputs.find(input => (
        input.dataset.coordinateMode === mode && input.dataset.coordinateComponent === component
      ));
    }

    function coordinateSystemForMode(mode) {
      return ui.coordinateSystemControls.find(control => control.dataset.coordinateMode === mode);
    }

    function readCoordinates(mode) {
      const control = coordinateSystemForMode(mode);
      if (control?.value === "polar") {
        const rho = clamp(finiteNumber(coordinateInput(mode, "rho"), 4), 0, Math.sqrt(2) * SCREEN_EXTENT);
        const phiDegrees = finiteNumber(coordinateInput(mode, "phi"), polarAngles[mode] || 0);
        const phi = phiDegrees * Math.PI / 180;
        return { u: rho * Math.cos(phi), v: rho * Math.sin(phi) };
      }
      return {
        u: finiteNumber(coordinateInput(mode, "alpha"), 4),
        v: finiteNumber(coordinateInput(mode, "beta"), 0)
      };
    }

    function coordinatesFromMode(mode) {
      const current = readCoordinates(mode);
      const control = coordinateSystemForMode(mode);
      if (control?.value === "polar") {
        const rhoInput = coordinateInput(mode, "rho");
        const phiInput = coordinateInput(mode, "phi");
        const rho = clamp(finiteNumber(rhoInput, Math.hypot(current.u, current.v)), 0, Math.sqrt(2) * SCREEN_EXTENT);
        const phiDegrees = finiteNumber(phiInput, polarAngles[mode] || 0);
        const phi = phiDegrees * Math.PI / 180;
        polarAngles[mode] = phiDegrees;
        return { u: clamp(rho * Math.cos(phi), -SCREEN_EXTENT, SCREEN_EXTENT), v: clamp(rho * Math.sin(phi), -SCREEN_EXTENT, SCREEN_EXTENT), textOverride: { rho: fixedTextFromInput(rhoInput.value, rho), phi: fixedTextFromInput(phiInput.value, phiDegrees) } };
      }
      const alphaInput = coordinateInput(mode, "alpha");
      const betaInput = coordinateInput(mode, "beta");
      const u = clamp(finiteNumber(alphaInput, current.u), -SCREEN_EXTENT, SCREEN_EXTENT);
      const v = clamp(finiteNumber(betaInput, current.v), -SCREEN_EXTENT, SCREEN_EXTENT);
      return {
        u,
        v,
        textOverride: {
          alpha: fixedTextFromInput(alphaInput.value, u),
          beta: fixedTextFromInput(betaInput.value, v)
        }
      };
    }

    function syncCoordinateInputs(u, v, textOverride = {}, targetMode = null) {
      const safeU = clamp(u, -SCREEN_EXTENT, SCREEN_EXTENT);
      const safeV = clamp(v, -SCREEN_EXTENT, SCREEN_EXTENT);
      const rho = Math.hypot(safeU, safeV);
      for (const input of ui.coordinateInputs) {
        const mode = input.dataset.coordinateMode;
        if (targetMode && mode !== targetMode) continue;
        if (textOverride.phi !== undefined && Number.isFinite(Number(textOverride.phi))) {
          polarAngles[mode] = Number(textOverride.phi);
        } else if (rho > 1e-15) {
          polarAngles[mode] = normalizePolarDegrees(Math.atan2(safeV, safeU) * 180 / Math.PI);
        }
        const values = { alpha: safeU, beta: safeV, rho, phi: polarAngles[mode] };
        const component = input.dataset.coordinateComponent;
        input.value = textOverride[component] ?? values[component].toFixed(DISPLAY_DECIMALS);
      }
    }

    function commitCoordinateInput(input) {
      const mode = input.dataset.coordinateMode;
      const { u, v, textOverride } = coordinatesFromMode(mode);
      syncCoordinateInputs(u, v, textOverride, mode);
      if (mode === "whole") queueTrace();
      drawScreen();
      updateDigitStepDisplay(input);
    }

    function applyDigitStep(input, direction) {
      rememberDigitCaret(input);
      const caret = digitCaretPositions.get(input) ?? input.value.length;
      const step = digitStepAtCaret(input);
      input.value = exactDigitStep(input.value, step, direction)
        ?? (finiteNumber(input, 0) + direction * step).toFixed(DISPLAY_DECIMALS);
      commitCoordinateInput(input);
      input.focus({ preventScroll: true });
      const restored = clamp(caret, 0, input.value.length);
      input.setSelectionRange(restored, restored);
      digitCaretPositions.set(input, restored);
      updateDigitStepDisplay(input);
    }

    function updateCoordinateSystem(control) {
      const mode = control.dataset.coordinateMode;
      for (const fields of ui.coordinateFields) {
        if (fields.dataset.coordinateMode === mode) {
          fields.hidden = fields.dataset.coordinateFields !== control.value;
        }
      }
      const first = coordinateInput(mode, control.value === "polar" ? "rho" : "alpha");
      if (first) updateDigitStepDisplay(first);
    }

    function updateDiagnostics(result, params) {
      const horizon = 1 + Math.sqrt(1 - params.spin * params.spin);
      const equatorial = Math.sqrt(horizon * horizon + params.spin * params.spin);
      ui.horizonRadius.textContent = horizon.toFixed(10);
      ui.horizonAxes.textContent = `${equatorial.toFixed(8)}M / ${horizon.toFixed(8)}M`;
      const physicalHorizon = horizon * RG_SUN_KM * params.mass;
      ui.horizonRadius.title = `r₊ = ${physicalHorizon.toLocaleString("zh-CN", { maximumFractionDigits: 3 })} km`;
    }

    function updateSingleRayCount() {
      ui.singleRayCount.textContent = `${renderer.animatedRayCount("single")} 条`;
      ui.clearSingleRays.disabled = renderer.animatedRayCount("single") === 0;
    }

    function renderMultiPointList() {
      ui.multiPointCount.textContent = `${multiSelectedPoints.length} 个`;
      const fragment = document.createDocumentFragment();
      multiSelectedPoints.forEach((point, index) => {
        const item = document.createElement("li");
        const number = document.createElement("span");
        number.textContent = `#${index + 1}`;
        const coordinates = document.createElement("span");
        coordinates.className = "point-list-coordinates";
        coordinates.textContent = `α=${point.u.toFixed(8)}  β=${point.v.toFixed(8)}`;
        const remove = document.createElement("button");
        remove.className = "point-delete-button";
        remove.type = "button";
        remove.textContent = "删除";
        remove.setAttribute("aria-label", `删除第 ${index + 1} 根光线`);
        remove.addEventListener("click", () => {
          if (point.animationRayId) renderer.removeAnimatedRay(point.animationRayId);
          multiSelectedPoints.splice(index, 1);
          renderMultiPointList();
          drawScreen();
        });
        item.append(number, coordinates, remove);
        fragment.append(item);
      });
      ui.multiPointList.replaceChildren(fragment);
      ui.startMultiRays.disabled = multiSelectedPoints.length === 0;
      ui.clearMultiPoints.disabled = multiSelectedPoints.length === 0;
    }

    function updateAnimationPauseButton() {
      ui.animationPause.textContent = renderer.animationPaused ? "继续" : "暂停";
      ui.animationPause.setAttribute("aria-pressed", String(renderer.animationPaused));
    }

    function setActiveTraceMode(mode) {
      activeTraceMode = mode;
      ui.playbackControl.hidden = mode === "whole";
      if (mode === "whole") renderer.setResult(currentResult, modelParameters("whole"));
      else renderer.setAnimationMode(mode, modelParameters(mode));
      drawScreen();
      updateSingleRayCount();
      renderMultiPointList();
      updateAnimationPauseButton();
    }

    function traceForParams(params) {
      return integrateKerrRay(params);
    }

    function addSingleAnimatedRay() {
      const params = modelParameters("single");
      ui.calculationState.textContent = "正在积分单根光线…";
      try {
        const result = traceForParams(params);
        updateDiagnostics(result, params);
        renderer.setResult(result, params);
        renderer.addAnimatedRay(result, params, "single", performance.now() + 50);
        renderer.setAnimationMode("single", params);
        ui.calculationState.textContent = `${result.accepted} 个接受步`;
      } catch (error) {
        ui.calculationState.textContent = "积分失败";
        console.error(error);
      }
      updateSingleRayCount();
      drawScreen();
    }

    function addMultiSelectedPoint() {
      const params = modelParameters("multi");
      multiSelectedPoints.push({ u: params.u, v: params.v, animationRayId: null });
      renderMultiPointList();
      drawScreen();
    }

    async function startMultiAnimatedRays() {
      if (!multiSelectedPoints.length) return;
      const base = modelParameters("multi");
      renderer.clearAnimatedRays("multi");
      for (const point of multiSelectedPoints) point.animationRayId = null;
      let latest = null;
      let latestParams = null;
      for (let index = 0; index < multiSelectedPoints.length; index += 1) {
        const point = multiSelectedPoints[index];
        ui.calculationState.textContent = `正在积分 ${index + 1}/${multiSelectedPoints.length}…`;
        const params = { ...base, u: point.u, v: point.v, impact: Math.hypot(point.u, point.v) };
        try {
          const result = traceForParams(params);
          point.animationRayId = renderer.addAnimatedRay(result, params, "multi", Number.POSITIVE_INFINITY);
          latest = result;
          latestParams = params;
        } catch (error) {
          console.error(error);
        }
        if (index % 2 === 1) await new Promise(resolve => requestAnimationFrame(resolve));
      }
      renderer.synchronizeAnimatedGroup("multi", performance.now() + 140);
      renderer.setAnimationMode("multi", base);
      if (latest && latestParams) {
        updateDiagnostics(latest, latestParams);
        ui.calculationState.textContent = `${multiSelectedPoints.length} 根光线已同步`;
      }
      renderMultiPointList();
    }

    function runTrace() {
      traceTimer = null;
      const params = modelParameters("whole");
      ui.mass.value = String(params.mass);
      ui.spin.value = params.spin.toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
      ui.inclination.value = String(params.inclination);
      ui.observerRadius.value = String(params.distance);
      ui.calculationState.textContent = "正在积分…";
      try {
        currentResult = integrateKerrRay(params);
        updateDiagnostics(currentResult, params);
        drawScreen();
        renderer.setResult(currentResult, params);
        if (activeTraceMode !== "whole") renderer.setAnimationMode(activeTraceMode, modelParameters(activeTraceMode));
        ui.calculationState.textContent = `${currentResult.accepted} 个接受步`;
      } catch (error) {
        currentResult = null;
        ui.calculationState.textContent = "积分失败";
        console.error(error);
      }
    }

    function queueTrace(delay = 70) {
      if (traceTimer !== null) clearTimeout(traceTimer);
      traceTimer = setTimeout(runTrace, delay);
    }

    function csvNumber(value) {
      return Number.isFinite(value) ? Number(value).toPrecision(17) : "";
    }

    function downloadGeodesicData() {
      if (!currentResult?.points?.length) runTrace();
      if (!currentResult?.points?.length) return;
      const params = modelParameters("whole");
      const rows = [
        "# CONGL Kerr null geodesic",
        "# coordinates,Cartesian Kerr-Schild",
        "# units,G=c=M=1",
        `# status,${currentResult.status}`,
        `# mass_solar,${csvNumber(params.mass)}`,
        `# spin_a_over_M,${csvNumber(params.spin)}`,
        `# observer_inclination_deg,${csvNumber(params.inclination)}`,
        `# observer_radius_over_M,${csvNumber(params.distance)}`,
        `# alpha_over_M,${csvNumber(params.u)}`,
        `# beta_over_M,${csvNumber(params.v)}`,
        `# conserved_E_signed,${csvNumber(currentResult.energy)}`,
        `# conserved_Lz_over_M,${csvNumber(currentResult.angularMomentum)}`,
        `# Carter_Q_over_M2,${csvNumber(currentResult.carter)}`,
        `# minimum_Kerr_Schild_r_over_M,${csvNumber(currentResult.minR)}`,
        `# max_relative_null_constraint,${csvNumber(currentResult.maxNullError)}`,
        `# max_relative_Carter_drift,${csvNumber(currentResult.maxCarterError)}`,
        "index,lambda_over_M,t_KS_over_M,r_KS_over_M,x_over_M,y_over_M,z_over_M,p_x,p_y,p_z,dr_dlambda,relative_null_error"
      ];
      currentResult.points.forEach((point, index) => {
        rows.push([
          index,
          csvNumber(point.affine), csvNumber(point.time), csvNumber(point.r),
          csvNumber(point.x), csvNumber(point.y), csvNumber(point.z),
          csvNumber(point.px), csvNumber(point.py), csvNumber(point.pz),
          csvNumber(point.radialVelocity), csvNumber(point.nullError)
        ].join(","));
      });
      const blob = new Blob(["\ufeff", rows.join("\n"), "\n"], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const token = value => value.toFixed(5).replace("-", "m").replace(".", "p");
      link.href = url;
      link.download = `congl-kerr-a-${token(params.spin)}-alpha-${token(params.u)}-beta-${token(params.v)}.csv`;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function screenCoordinatesFromPointer(event) {
      const rect = ui.screenCanvas.getBoundingClientRect();
      const layout = screenLayout(rect.width, rect.height);
      return {
        u: screenView.centerU + (event.clientX - rect.left - layout.left - layout.size / 2) / layout.scale,
        v: screenView.centerV - (event.clientY - rect.top - layout.top - layout.size / 2) / layout.scale
      };
    }

    function selectScreenPoint(event) {
      const raw = screenCoordinatesFromPointer(event);
      const u = clamp(raw.u, -SCREEN_EXTENT, SCREEN_EXTENT);
      const v = clamp(raw.v, -SCREEN_EXTENT, SCREEN_EXTENT);
      syncCoordinateInputs(u, v);
      drawScreen();
      if (activeTraceMode === "whole") queueTrace(0);
      else if (activeTraceMode === "single") addSingleAnimatedRay();
      else addMultiSelectedPoint();
    }

    function runSelfTests() {
      const tests = [];
      const record = (name, condition) => tests.push({ name, condition: Boolean(condition) });
      try {
        const axisInitial = initialRay({ spin: 0.9, inclination: 0, distance: 100, u: 4, v: 2 });
        record("axis observer", relativeNullError(axisInitial.state, axisInitial.pT, 0.9) < 2e-12);
        const inclinedInitial = initialRay({ spin: 0.9, inclination: 61, distance: 100, u: -4, v: 1.5 });
        record("inclined observer", relativeNullError(inclinedInitial.state, inclinedInitial.pT, 0.9) < 2e-12);
        const setup = inclinedInitial.setup;
        const tetrad = [setup.time, setup.radial, setup.alpha, setup.beta];
        let orthogonal = true;
        for (let i = 0; i < tetrad.length; i += 1) {
          for (let j = 0; j < tetrad.length; j += 1) {
            const target = i === j ? (i === 0 ? -1 : 1) : 0;
            orthogonal &&= Math.abs(metricDot(setup.metric, tetrad[i], tetrad[j]) - target) < 2e-12;
          }
        }
        record("observer tetrad", orthogonal);
        const fields = kerrFields([7.2, -1.4, 3.1], 0.8);
        record("Kerr-Schild radius", Math.abs((7.2 ** 2 + (-1.4) ** 2) / (fields.r2 + 0.8 ** 2) + 3.1 ** 2 / fields.r2 - 1) < 2e-12);
        const capture = integrateKerrRay({ spin: 0, inclination: 70, distance: 80, u: 4, v: 0 }, { rtol: 2e-7, atol: 2e-9 });
        const escape = integrateKerrRay({ spin: 0, inclination: 70, distance: 80, u: 7, v: 0 }, { rtol: 2e-7, atol: 2e-9 });
        record("Schwarzschild capture", capture.status === "capture");
        record("Schwarzschild escape", escape.status === "escape");
        const captureEndpoint = capture.points[capture.points.length - 1];
        const captureMomentumBound = Math.max(
          ...capture.points.flatMap(point => [Math.abs(point.px), Math.abs(point.py), Math.abs(point.pz)])
        );
        record(
          "past-horizon chart regularity",
          Math.abs(captureEndpoint.r / capture.horizon - 1) < 5e-9
            && captureMomentumBound < 10
        );
        record("constraint preservation", Math.max(capture.maxNullError, escape.maxNullError) < 2e-5);
        record("Carter preservation", Math.max(capture.maxCarterError, escape.maxCarterError) < 2e-4);
        const spinMirrorA = integrateKerrRay({ spin: 0.7, inclination: 90, distance: 60, u: 6, v: 0 }, { rtol: 5e-7, atol: 5e-9 });
        const spinMirrorB = integrateKerrRay({ spin: -0.7, inclination: 90, distance: 60, u: -6, v: 0 }, { rtol: 5e-7, atol: 5e-9 });
        record("spin reflection", spinMirrorA.status === spinMirrorB.status && Math.abs(spinMirrorA.minR - spinMirrorB.minR) < 2e-3);
        const farParams = { spin: 0.8, inclination: 53, distance: 100000, u: 3.5, v: -1.2 };
        const farInitial = initialRay(farParams);
        const theta = farParams.inclination * Math.PI / 180;
        const xi = farInitial.angularMomentum / farInitial.energy;
        const eta = farInitial.carter / (farInitial.energy * farInitial.energy);
        const expectedXi = -farParams.u * Math.sin(theta);
        const expectedEta = farParams.v * farParams.v
          + (farParams.u * farParams.u - farParams.spin * farParams.spin) * Math.cos(theta) ** 2;
        record("Bardeen far-screen map", Math.abs(xi - expectedXi) < 2e-4 && Math.abs(eta - expectedEta) < 5e-4);
        const boundaryParams = { spin: 0.9, inclination: 60, distance: 1000, u: 0, v: 0 };
        const boundary = criticalCurve(boundaryParams);
        const leftEdge = Math.min(...boundary.map(point => point[0]));
        const rightEdge = Math.max(...boundary.map(point => point[0]));
        const leftOutside = integrateKerrRay({ ...boundaryParams, u: leftEdge - 5e-4 }, { rtol: 2e-7, atol: 2e-9 });
        const leftInside = integrateKerrRay({ ...boundaryParams, u: leftEdge + 5e-4 }, { rtol: 2e-7, atol: 2e-9 });
        const rightOutside = integrateKerrRay({ ...boundaryParams, u: rightEdge + 5e-4 }, { rtol: 2e-7, atol: 2e-9 });
        const rightInside = integrateKerrRay({ ...boundaryParams, u: rightEdge - 5e-4 }, { rtol: 2e-7, atol: 2e-9 });
        record("finite critical curve left classification", leftOutside.status === "escape" && leftInside.status === "capture");
        record("finite critical curve right classification", rightOutside.status === "escape" && rightInside.status === "capture");
      } catch (error) {
        console.error("CONGL Kerr self-test error", error);
        tests.push({ name: "exception", condition: false });
      }
      const passed = tests.filter(test => test.condition).length;
      ui.selfTest.textContent = `${passed}/${tests.length}`;
      ui.selfTest.dataset.tests = JSON.stringify(tests);
      if (passed !== tests.length) console.warn("CONGL Kerr self-tests", tests);
    }

    for (const input of ui.coordinateInputs) {
      input.addEventListener("click", () => { rememberDigitCaret(input); updateDigitStepDisplay(input); });
      input.addEventListener("keyup", () => { rememberDigitCaret(input); updateDigitStepDisplay(input); });
      input.addEventListener("select", () => { rememberDigitCaret(input); updateDigitStepDisplay(input); });
      input.addEventListener("change", () => commitCoordinateInput(input));
      input.addEventListener("blur", () => commitCoordinateInput(input));
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          commitCoordinateInput(input);
          if (input.dataset.coordinateMode === "single") addSingleAnimatedRay();
          if (input.dataset.coordinateMode === "multi") addMultiSelectedPoint();
          input.blur();
        }
      });
    }

    for (const button of document.querySelectorAll("[data-step-target]")) {
      button.addEventListener("mousedown", event => event.preventDefault());
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.stepTarget);
        applyDigitStep(input, Number(button.dataset.stepDirection));
      });
    }

    for (const control of ui.coordinateSystemControls) {
      control.addEventListener("change", () => updateCoordinateSystem(control));
    }
    for (const panel of ui.traceModes) {
      panel.addEventListener("toggle", () => {
        if (panel.open) setActiveTraceMode(panel.dataset.traceMode);
      });
    }
    for (const control of ui.trailLengthControls) {
      control.addEventListener("input", () => {
        trailFraction = Number(control.value) / 100;
        for (const other of ui.trailLengthControls) other.value = control.value;
        for (const display of ui.trailLengthDisplays) display.textContent = `${control.value}%`;
        renderer.setTrailFraction(trailFraction);
      });
    }
    ui.addSingleByInput.addEventListener("click", addSingleAnimatedRay);
    ui.clearSingleRays.addEventListener("click", () => renderer.clearAnimatedRays("single"));
    ui.addMultiByInput.addEventListener("click", addMultiSelectedPoint);
    ui.clearMultiPoints.addEventListener("click", () => {
      renderer.clearAnimatedRays("multi");
      multiSelectedPoints.splice(0);
      renderMultiPointList();
      drawScreen();
    });
    ui.startMultiRays.addEventListener("click", startMultiAnimatedRays);
    ui.playbackDirection.addEventListener("change", () => {
      renderer.setPlaybackDirection(ui.playbackDirection.value);
    });
    ui.animationPause.addEventListener("click", () => {
      renderer.setAnimationPaused(!renderer.animationPaused);
      updateAnimationPauseButton();
    });
    renderer.onRaySetChanged = () => {
      updateSingleRayCount();
      renderMultiPointList();
    };
    ui.downloadGeodesic.addEventListener("click", downloadGeodesicData);
    for (const input of [ui.mass, ui.spin, ui.inclination, ui.observerRadius]) {
      input.addEventListener("input", () => {
        renderer.clearAnimatedRays("single");
        renderer.clearAnimatedRays("multi");
        queueTrace(100);
        drawScreen();
      });
      input.addEventListener("change", () => queueTrace(0));
    }

    ui.screenCanvas.addEventListener("pointerdown", event => {
      if (event.shiftKey) {
        screenPanning = true;
        const pointer = screenCoordinatesFromPointer(event);
        Object.assign(screenPanStart, {
          x: pointer.u,
          y: pointer.v,
          centerU: screenView.centerU,
          centerV: screenView.centerV
        });
        ui.screenCanvas.setPointerCapture(event.pointerId);
      } else {
        selectScreenPoint(event);
      }
    });

    ui.screenCanvas.addEventListener("pointermove", event => {
      if (!screenPanning) return;
      const pointer = screenCoordinatesFromPointer(event);
      const centerLimit = SCREEN_EXTENT - screenView.halfExtent;
      screenView.centerU = clamp(screenPanStart.centerU + screenPanStart.x - pointer.u, -centerLimit, centerLimit);
      screenView.centerV = clamp(screenPanStart.centerV + screenPanStart.y - pointer.v, -centerLimit, centerLimit);
      drawScreen();
    });

    const stopScreenPan = event => {
      screenPanning = false;
      if (event?.pointerId !== undefined && ui.screenCanvas.hasPointerCapture(event.pointerId)) {
        ui.screenCanvas.releasePointerCapture(event.pointerId);
      }
    };
    ui.screenCanvas.addEventListener("pointerup", stopScreenPan);
    ui.screenCanvas.addEventListener("pointercancel", stopScreenPan);

    ui.screenCanvas.addEventListener("wheel", event => {
      event.preventDefault();
      const before = screenCoordinatesFromPointer(event);
      const nextExtent = clamp(screenView.halfExtent * Math.exp(event.deltaY * 0.0013), 1e-10, SCREEN_EXTENT);
      const ratio = nextExtent / screenView.halfExtent;
      screenView.centerU = before.u - (before.u - screenView.centerU) * ratio;
      screenView.centerV = before.v - (before.v - screenView.centerV) * ratio;
      screenView.halfExtent = nextExtent;
      const centerLimit = SCREEN_EXTENT - screenView.halfExtent;
      screenView.centerU = clamp(screenView.centerU, -centerLimit, centerLimit);
      screenView.centerV = clamp(screenView.centerV, -centerLimit, centerLimit);
      drawScreen();
    }, { passive: false });

    window.addEventListener("resize", () => { drawScreen(); renderer.draw(); });

    for (const control of ui.coordinateSystemControls) updateCoordinateSystem(control);
    syncCoordinateInputs(4, 0);
    renderer.setTrailFraction(trailFraction);
    renderer.setPlaybackDirection("reverse");
    updateSingleRayCount();
    renderMultiPointList();
    drawScreen();
    runTrace();
    setTimeout(runSelfTests, 250);
  </script>
</body>
</html>
