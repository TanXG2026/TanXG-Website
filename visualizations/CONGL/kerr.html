<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/congl-logo.png">
  <link rel="apple-touch-icon" href="assets/congl-logo.png">
  <title>CONGL · Kerr Black Hole</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f6;
      --panel: #ffffff;
      --ink: #17191c;
      --muted: #646a73;
      --line: #d7dbe0;
      --grid: #eceff2;
      --blue: #1769aa;
      --red: #b42318;
      --green: #16794a;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      padding: 8px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    header .brand-logo {
      display: block;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      object-fit: contain;
    }

    header span { color: var(--muted); }

    main {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 14px;
      max-width: 1380px;
      margin: 0 auto;
      padding: 14px;
    }

    aside, .workspace {
      background: var(--panel);
      border: 1px solid var(--line);
    }

    aside { padding: 15px; }

    h2 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.04em;
    }

    .section + .section {
      margin-top: 17px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .section-hint {
      margin: -5px 0 9px;
      color: var(--muted);
      font-size: 11px;
    }

    label {
      display: block;
      margin: 8px 0 4px;
      color: var(--muted);
      font-size: 12px;
    }

    input, select, button {
      width: 100%;
      min-height: 34px;
      border: 1px solid #bfc5cc;
      border-radius: 3px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    input, select { padding: 6px 8px; }
    button {
      margin-top: 12px;
      cursor: pointer;
      background: #1d2024;
      color: #fff;
      border-color: #1d2024;
      font-weight: 600;
    }

    button:hover { background: #34383e; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    input:focus, select:focus, button:focus-visible {
      outline: 2px solid rgba(23, 105, 170, 0.25);
      outline-offset: 1px;
      border-color: var(--blue);
    }

    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .inline-value {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .inline-value output {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .screen-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid var(--line);
      background: #fff;
      cursor: crosshair;
      touch-action: none;
    }

    .screen-caption {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    canvas { display: block; }
    #screenCanvas { width: 100%; height: 100%; }

    .trace-modes { margin-top: 10px; }
    .trace-mode { border-top: 1px solid var(--line); }
    .trace-mode:last-child { border-bottom: 1px solid var(--line); }

    .trace-mode summary {
      padding: 9px 2px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .mode-body { padding: 0 2px 11px; }
    .coordinate-system-label { margin-top: 0; }
    .coordinate-system-select { margin-bottom: 7px; }
    .coordinate-fields[hidden] { display: none; }

    .trail-control { margin-top: 10px; }
    .trail-control label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 3px;
    }
    .trail-control output { color: var(--ink); font-variant-numeric: tabular-nums; }
    .trail-control input[type="range"] {
      min-height: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      accent-color: #e25525;
      cursor: ew-resize;
    }

    .quiet-button {
      background: #fff;
      color: #34383e;
      border-color: #bfc5cc;
      font-weight: 500;
    }
    .quiet-button:hover { background: #f0f2f4; }

    .point-list {
      max-height: 118px;
      overflow-y: auto;
      margin: 7px 0 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .point-list li {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      border-bottom: 1px solid #eef0f2;
    }
    .point-list-coordinates {
      overflow: hidden;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .point-delete-button {
      width: auto;
      min-height: 22px;
      margin: 0;
      padding: 1px 7px;
      border-color: #d3d7dc;
      background: #fff;
      color: #8f3428;
      font: 11px/1.2 system-ui, sans-serif;
      font-weight: 500;
    }
    .point-delete-button:hover { border-color: #bd776d; background: #fff6f4; }

    .coordinate-input {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .digit-stepper {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 22px;
    }

    .digit-stepper input {
      min-width: 0;
      border-radius: 3px 0 0 3px;
    }

    .digit-step-buttons {
      display: grid;
      grid-template-rows: 1fr 1fr;
    }

    .digit-step-button {
      width: 22px;
      min-height: 0;
      height: 17px;
      margin: 0;
      padding: 0;
      border-left: 0;
      border-color: #bfc5cc;
      border-radius: 0;
      background: #f6f7f8;
      color: #34383e;
      font-size: 9px;
      font-weight: 600;
      line-height: 1;
    }

    .digit-step-button:first-child { border-radius: 0 3px 0 0; }
    .digit-step-button:last-child { border-top: 0; border-radius: 0 0 3px 0; }
    .digit-step-button:hover { background: #e8eaed; }

    .workspace { overflow: hidden; }

    .orbit-wrap {
      position: relative;
      min-height: 650px;
      height: calc(100vh - 88px);
      background: #02050b;
      touch-action: none;
      overflow: hidden;
    }

    #orbitCanvas {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #orbitCanvas:active { cursor: grabbing; }

    .calculation-state {
      position: absolute;
      top: 52px;
      right: 13px;
      z-index: 2;
      color: rgba(226, 232, 240, 0.7);
      font-size: 11px;
      pointer-events: none;
    }

    .playback-control {
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 6px 5px 8px;
      border: 1px solid rgba(190, 198, 208, 0.28);
      border-radius: 3px;
      background: rgba(3, 6, 12, 0.78);
    }
    .playback-control[hidden] { display: none; }
    .playback-control label {
      margin: 0;
      color: rgba(222, 227, 234, 0.78);
      font-size: 11px;
      white-space: nowrap;
    }
    .playback-control select {
      width: auto;
      min-height: 27px;
      padding: 3px 24px 3px 7px;
      border-color: rgba(190, 198, 208, 0.38);
      background: #0a0e16;
      color: #eef1f5;
      font-size: 11px;
    }
    .playback-control button {
      width: auto;
      min-height: 27px;
      margin: 0;
      padding: 3px 10px;
      border-color: rgba(190, 198, 208, 0.38);
      background: #171c25;
      color: #eef1f5;
      font-size: 11px;
      font-weight: 600;
    }
    .playback-control button:hover { background: #252c38; }

    @media (min-width: 901px) {
      html, body { height: 100%; overflow: hidden; }
      body { display: flex; flex-direction: column; }
      header { flex: 0 0 auto; }
      main {
        flex: 1 1 auto;
        min-height: 0;
        width: min(100%, 1380px);
        grid-template-rows: minmax(0, 1fr);
      }
      aside { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
      .workspace, .orbit-wrap { min-height: 0; height: 100%; }
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .section + .section { margin: 0; padding: 0; border: 0; }
      .orbit-wrap { min-height: 470px; height: 58vh; }
    }

    @media (max-width: 620px) {
      header { gap: 10px; padding-inline: 14px; }
      header span { display: block; }
      aside { display: block; }
      .section + .section { margin-top: 17px; padding-top: 16px; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <img class="brand-logo" src="assets/congl-logo.png" alt="CONGL">
    <span>Compact Object Null Geodesic Lab · Kerr Black Hole</span>
  </header>

  <main>
    <aside>
      <section class="section">
        <h2>中心天体模型</h2>
        <div class="pair">
          <div>
            <label for="mass">质量 / M☉</label>
            <input id="mass" type="number" min="0.1" max="10000000000" step="0.1" value="10.0">
          </div>
          <div>
            <label for="spin">自旋 a / M</label>
            <input id="spin" type="number" min="-0.999" max="0.999" step="0.01" value="0.90">
          </div>
        </div>
        <div class="pair">
          <div>
            <label for="inclination">倾角 θo / °</label>
            <input id="inclination" type="number" min="0" max="180" step="1" value="60">
          </div>
          <div>
            <label for="observerRadius">观测者距离 rₒ / M</label>
            <input id="observerRadius" type="number" min="20" max="100000" step="10" value="1000">
          </div>
        </div>
        <div class="inline-value">
          <span>外事件视界 r₊ / M</span>
          <output id="horizonRadius">—</output>
        </div>
        <div class="inline-value">
          <span>视界赤道半轴 / 极半轴</span>
          <output id="horizonAxes">—</output>
        </div>
      </section>

      <section class="section">
        <h2>观察者屏幕</h2>
        <p class="section-hint">滚轮缩放 · Shift + 拖动平移</p>
        <div class="screen-wrap" id="screenWrap" aria-label="观察者屏幕；点击选择像素">
          <canvas id="screenCanvas"></canvas>
        </div>
        <p class="screen-caption">黑色区域为当前观测者距离下的捕获区</p>
        <div class="inline-value">
          <span>屏幕缩放</span>
          <output id="screenZoom">×1</output>
        </div>

        <div class="trace-modes">
        <details class="trace-mode" data-trace-mode="whole" name="trace-mode" open>
          <summary>整根光线</summary>
          <div class="mode-body">
            <label class="coordinate-system-label" for="wholeCoordinateSystem">坐标形式</label>
            <select class="coordinate-system-select" id="wholeCoordinateSystem" data-coordinate-system data-coordinate-mode="whole">
              <option value="cartesian" selected>直角坐标（α, β）</option>
              <option value="polar">极坐标（ρ, φ）</option>
            </select>

            <div class="coordinate-fields" data-coordinate-fields="cartesian" data-coordinate-mode="whole">
              <div class="pair">
                <div>
                  <label for="pixelU">α / M</label>
                  <div class="digit-stepper">
                    <input class="coordinate-input" id="pixelU" data-coordinate-component="alpha" data-coordinate-mode="whole" type="text" inputmode="decimal" value="4.0000000000000000" autocomplete="off">
                    <div class="digit-step-buttons">
                      <button class="digit-step-button" type="button" data-step-target="pixelU" data-step-direction="1" aria-label="α 当前数位增加 1">▲</button>
                      <button class="digit-step-button" type="button" data-step-target="pixelU" data-step-direction="-1" aria-label="α 当前数位减少 1">▼</button>
                    </div>
                  </div>
                </div>
                <div>
                  <label for="pixelV">β / M</label>
                  <div class="digit-stepper">
                    <input class="coordinate-input" id="pixelV" data-coordinate-component="beta" data-coordinate-mode="whole" type="text" inputmode="decimal" value="0.0000000000000000" autocomplete="off">
                    <div class="digit-step-buttons">
                      <button class="digit-step-button" type="button" data-step-target="pixelV" data-step-direction="1" aria-label="β 当前数位增加 1">▲</button>
                      <button class="digit-step-button" type="button" data-step-target="pixelV" data-step-direction="-1" aria-label="β 当前数位减少 1">▼</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="coordinate-fields" data-coordinate-fields="polar" data-coordinate-mode="whole" hidden>
              <div class="pair">
                <div>
                  <label for="pixelRho">ρ / M</label>
                  <div class="digit-stepper">
                    <input class="coordinate-input" id="pixelRho" data-coordinate-component="rho" data-coordinate-mode="whole" type="text" inputmode="decimal" value="4.0000000000000000" autocomplete="off">
                    <div class="digit-step-buttons">
                      <button class="digit-step-button" type="button" data-step-target="pixelRho" data-step-direction="1" aria-label="ρ 当前数位增加 1">▲</button>
                      <button class="digit-step-button" type="button" data-step-target="pixelRho" data-step-direction="-1" aria-label="ρ 当前数位减少 1">▼</button>
                    </div>
                  </div>
                </div>
                <div>
                  <label for="pixelPhi">φ / °</label>
                  <div class="digit-stepper">
                    <input class="coordinate-input" id="pixelPhi" data-coordinate-component="phi" data-coordinate-mode="whole" type="text" inputmode="decimal" value="0.0000000000000000" autocomplete="off">
                    <div class="digit-step-buttons">
                      <button class="digit-step-button" type="button" data-step-target="pixelPhi" data-step-direction="1" aria-label="φ 当前数位增加 1">▲</button>
                      <button class="digit-step-button" type="button" data-step-target="pixelPhi" data-step-direction="-1" aria-label="φ 当前数位减少 1">▼</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="inline-value">
              <span>光标所在位增减单位</span>
              <output id="digitStepDisplay" data-digit-step-display>0.01</output>
            </div>

            <button id="downloadGeodesic" type="button">下载测地线数据（CSV）</button>
          </div>
        </details>

        <details class="trace-mode" data-trace-mode="single" name="trace-mode">
          <summary>单根光线</summary>
          <div class="mode-body">
            <label class="coordinate-system-label" for="singleCoordinateSystem">坐标形式</label>
            <select class="coordinate-system-select" id="singleCoordinateSystem" data-coordinate-system data-coordinate-mode="single">
              <option value="cartesian" selected>直角坐标（α, β）</option>
              <option value="polar">极坐标（ρ, φ）</option>
            </select>
            <div class="coordinate-fields" data-coordinate-fields="cartesian" data-coordinate-mode="single">
              <div class="pair">
                <div><label for="singlePixelU">α / M</label><div class="digit-stepper">
                  <input class="coordinate-input" id="singlePixelU" data-coordinate-component="alpha" data-coordinate-mode="single" type="text" inputmode="decimal" value="4.0000000000000000" autocomplete="off">
                  <div class="digit-step-buttons"><button class="digit-step-button" type="button" data-step-target="singlePixelU" data-step-direction="1" aria-label="α 当前数位增加 1">▲</button><button class="digit-step-button" type="button" data-step-target="singlePixelU" data-step-direction="-1" aria-label="α 当前数位减少 1">▼</button></div>
                </div></div>
                <div><label for="singlePixelV">β / M</label><div class="digit-stepper">
                  <input class="coordinate-input" id="singlePixelV" data-coordinate-component="beta" data-coordinate-mode="single" type="text" inputmode="decimal" value="0.0000000000000000" autocomplete="off">
                  <div class="digit-step-buttons"><button class="digit-step-button" type="button" data-step-target="singlePixelV" data-step-direction="1" aria-label="β 当前数位增加 1">▲</button><button class="digit-step-button" type="button" data-step-target="singlePixelV" data-step-direction="-1" aria-label="β 当前数位减少 1">▼</button></div>
                </div></div>
              </div>
            </div>
            <div class="coordinate-fields" data-coordinate-fields="polar" data-coordinate-mode="single" hidden>
              <div class="pair">
                <div><label for="singlePixelRho">ρ / M</label><div class="digit-stepper">
                  <input class="coordinate-input" id="singlePixelRho" data-coordinate-component="rho" data-coordinate-mode="single" type="text" inputmode="decimal" value="4.0000000000000000" autocomplete="off">
                  <div class="digit-step-buttons"><button class="digit-step-button" type="button" data-step-target="singlePixelRho" data-step-direction="1" aria-label="ρ 当前数位增加 1">▲</button><button class="digit-step-button" type="button" data-step-target="singlePixelRho" data-step-direction="-1" aria-label="ρ 当前数位减少 1">▼</button></div>
                </div></div>
                <div><label for="singlePixelPhi">φ / °</label><div class="digit-stepper">
                  <input class="coordinate-input" id="singlePixelPhi" data-coordinate-component="phi" data-coordinate-mode="single" type="text" inputmode="decimal" value="0.0000000000000000" autocomplete="off">
                  <div class="digit-step-buttons"><button class="digit-step-button" type="button" data-step-target="singlePixelPhi" data-step-direction="1" aria-label="φ 当前数位增加 1">▲</button><button class="digit-step-button" type="button" data-step-target="singlePixelPhi" data-step-direction="-1" aria-label="φ 当前数位减少 1">▼</button></div>
                </div></div>
              </div>
            </div>
            <div class="inline-value"><span>光标所在位增减单位</span><output data-digit-step-display>0.01</output></div>
            <button id="addSingleByInput" type="button">添加光线</button>
            <div class="trail-control"><label for="singleTrailLength"><span>拖尾长度</span><output data-trail-length-display>18%</output></label><input id="singleTrailLength" data-trail-length type="range" min="4" max="45" step="1" value="18"></div>
            <div class="inline-value" aria-live="polite"><span>正在运行</span><output id="singleRayCount">0 条</output></div>
            <button class="quiet-button" id="clearSingleRays" type="button">清空单根动画</button>
          </div>
        </details>

        <details class="trace-mode" data-trace-mode="multi" name="trace-mode">
          <summary>多根光线</summary>
          <div class="mode-body">
            <label class="coordinate-system-label" for="multiCoordinateSystem">坐标形式</label>
            <select class="coordinate-system-select" id="multiCoordinateSystem" data-coordinate-system data-coordinate-mode="multi">
              <option value="cartesian" selected>直角坐标（α, β）</option>
              <option value="polar">极坐标（ρ, φ）</option>
            </select>
            <div class="coordinate-fields" data-coordinate-fields="cartesian" data-coordinate-mode="multi">
              <div class="pair">
                <div><label for="multiPixelU">α / M</label><div class="digit-stepper">
                  <input class="coordinate-input" id="multiPixelU" data-coordinate-component="alpha" data-coordinate-mode="multi" type="text" inputmode="decimal" value="4.0000000000000000" autocomplete="off">
                  <div class="digit-step-buttons"><button class="digit-step-button" type="button" data-step-target="multiPixelU" data-step-direction="1" aria-label="α 当前数位增加 1">▲</button><button class="digit-step-button" type="button" data-step-target="multiPixelU" data-step-direction="-1" aria-label="α 当前数位减少 1">▼</button></div>
                </div></div>
                <div><label for="multiPixelV">β / M</label><div class="digit-stepper">
                  <input class="coordinate-input" id="multiPixelV" data-coordinate-component="beta" data-coordinate-mode="multi" type="text" inputmode="decimal" value="0.0000000000000000" autocomplete="off">
                  <div class="digit-step-buttons"><button class="digit-step-button" type="button" data-step-target="multiPixelV" data-step-direction="1" aria-label="β 当前数位增加 1">▲</button><button class="digit-step-button" type="button" data-step-target="multiPixelV" data-step-direction="-1" aria-label="β 当前数位减少 1">▼</button></div>
                </div></div>
              </div>
            </div>
            <div class="coordinate-fields" data-coordinate-fields="polar" data-coordinate-mode="multi" hidden>
              <div class="pair">
                <div><label for="multiPixelRho">ρ / M</label><div class="digit-stepper">
                  <input class="coordinate-input" id="multiPixelRho" data-coordinate-component="rho" data-coordinate-mode="multi" type="text" inputmode="decimal" value="4.0000000000000000" autocomplete="off">
                  <div class="digit-step-buttons"><button class="digit-step-button" type="button" data-step-target="multiPixelRho" data-step-direction="1" aria-label="ρ 当前数位增加 1">▲</button><button class="digit-step-button" type="button" data-step-target="multiPixelRho" data-step-direction="-1" aria-label="ρ 当前数位减少 1">▼</button></div>
                </div></div>
                <div><label for="multiPixelPhi">φ / °</label><div class="digit-stepper">
                  <input class="coordinate-input" id="multiPixelPhi" data-coordinate-component="phi" data-coordinate-mode="multi" type="text" inputmode="decimal" value="0.0000000000000000" autocomplete="off">
                  <div class="digit-step-buttons"><button class="digit-step-button" type="button" data-step-target="multiPixelPhi" data-step-direction="1" aria-label="φ 当前数位增加 1">▲</button><button class="digit-step-button" type="button" data-step-target="multiPixelPhi" data-step-direction="-1" aria-label="φ 当前数位减少 1">▼</button></div>
                </div></div>
              </div>
            </div>
            <div class="inline-value"><span>光标所在位增减单位</span><output data-digit-step-display>0.01</output></div>
            <button id="addMultiByInput" type="button">加入列表</button>
            <div class="trail-control"><label for="multiTrailLength"><span>拖尾长度</span><output data-trail-length-display>18%</output></label><input id="multiTrailLength" data-trail-length type="range" min="4" max="45" step="1" value="18"></div>
            <div class="inline-value" aria-live="polite"><span>已选屏幕点</span><output id="multiPointCount">0 个</output></div>
            <ol class="point-list" id="multiPointList" aria-label="多根光线已选屏幕点"></ol>
            <button class="quiet-button" id="clearMultiPoints" type="button">清空</button>
            <button id="startMultiRays" type="button">开始同步反向追踪</button>
          </div>
        </details>
        </div>
      </section>
    </aside>

    <section class="workspace" aria-label="三维 Kerr 零测地线图像">
      <div class="orbit-wrap" id="orbitWrap">
        <canvas id="orbitCanvas" aria-label="可拖动旋转和滚轮缩放的三维 Kerr 零测地线"></canvas>
        <div class="playback-control" id="playbackControl" hidden>
          <label for="playbackDirection">动画方向</label>
          <select id="playbackDirection"><option value="reverse" selected>反向追踪</option><option value="forward">正向追踪</option></select>
          <button id="animationPause" type="button" aria-pressed="false">暂停</button>
        </div>
        <div class="calculation-state" id="calculationState" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <span id="selfTest" hidden></span>

  <script>
    "use strict";

    const METRIC_MASS = 1;
    // Outgoing Kerr--Schild is regular on the past horizon reached by
    // positive-affine, past-directed rays launched from the camera.
    const KS_TIME_SIGN = -1;
    const RG_SUN_KM = 1.4766250385;
    const DISPLAY_DECIMALS = 16;
    const SCREEN_EXTENT = 10;
    const DEFAULT_OBSERVER_DISTANCE = 1000;
    const MAX_POINTS = 7000;
    const ANIMATION_RADIUS = 32;
    const TWO_PI = 2 * Math.PI;

    const ui = {
      mass: document.getElementById("mass"),
      spin: document.getElementById("spin"),
      inclination: document.getElementById("inclination"),
      observerRadius: document.getElementById("observerRadius"),
      horizonRadius: document.getElementById("horizonRadius"),
      horizonAxes: document.getElementById("horizonAxes"),
      screenWrap: document.getElementById("screenWrap"),
      screenCanvas: document.getElementById("screenCanvas"),
      screenZoom: document.getElementById("screenZoom"),
      coordinateSystemControls: Array.from(document.querySelectorAll("[data-coordinate-system]")),
      coordinateFields: Array.from(document.querySelectorAll("[data-coordinate-fields]")),
      coordinateInputs: Array.from(document.querySelectorAll(".coordinate-input")),
      digitStepDisplays: Array.from(document.querySelectorAll("[data-digit-step-display]")),
      downloadGeodesic: document.getElementById("downloadGeodesic"),
      traceModes: Array.from(document.querySelectorAll("[data-trace-mode]")),
      addSingleByInput: document.getElementById("addSingleByInput"),
      singleRayCount: document.getElementById("singleRayCount"),
      clearSingleRays: document.getElementById("clearSingleRays"),
      addMultiByInput: document.getElementById("addMultiByInput"),
      multiPointCount: document.getElementById("multiPointCount"),
      multiPointList: document.getElementById("multiPointList"),
      clearMultiPoints: document.getElementById("clearMultiPoints"),
      startMultiRays: document.getElementById("startMultiRays"),
      trailLengthControls: Array.from(document.querySelectorAll("[data-trail-length]")),
      trailLengthDisplays: Array.from(document.querySelectorAll("[data-trail-length-display]")),
      orbitWrap: document.getElementById("orbitWrap"),
      orbitCanvas: document.getElementById("orbitCanvas"),
      playbackControl: document.getElementById("playbackControl"),
      playbackDirection: document.getElementById("playbackDirection"),
      animationPause: document.getElementById("animationPause"),
      calculationState: document.getElementById("calculationState"),
      selfTest: document.getElementById("selfTest")
    };

    let currentResult = null;
    let traceTimer = null;
    let activeTraceMode = "whole";
    let trailFraction = 0.18;
    const multiSelectedPoints = [];
    const polarAngles = { whole: 0, single: 0, multi: 0 };
    const digitCaretPositions = new Map();
    const screenView = { centerU: 0, centerV: 0, halfExtent: SCREEN_EXTENT };
    const screenPanStart = { x: 0, y: 0, centerU: 0, centerV: 0 };
    let screenPanning = false;

    function clamp(value, low, high) { return Math.min(high, Math.max(low, value)); }
    function finiteNumber(input, fallback) {
      const value = Number(input?.value ?? input);
      return Number.isFinite(value) ? value : fallback;
    }
    function add(a, b) { return a.map((value, i) => value + b[i]); }
    function sub(a, b) { return a.map((value, i) => value - b[i]); }
    function scale(a, factor) { return a.map(value => value * factor); }
    function dot(a, b) { return a.reduce((sum, value, i) => sum + value * b[i], 0); }
    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
    }
    function norm(a) { return Math.hypot(...a); }
    function normalize(a, fallback = [1, 0, 0]) {
      const length = norm(a);
      return length > 1e-15 ? scale(a, 1 / length) : fallback.slice();
    }

    // Cartesian outgoing Kerr--Schild geometry.  With signature (-,+,+,+),
    // g_{mu nu}=eta_{mu nu}+2 H l_mu l_nu and
    // g^{mu nu}=eta^{mu nu}-2 H l^mu l^nu.  The outgoing branch has
    // l_t=-1; its spatial principal-null covector is returned below.
    function kerrFields(position, spin, mass = METRIC_MASS) {
      const [x, y, z] = position;
      const a2 = spin * spin;
      const euclidean2 = x * x + y * y + z * z;
      const A = euclidean2 - a2;
      const discriminant = Math.sqrt(Math.max(A * A + 4 * a2 * z * z, 1e-30));
      const r2 = Math.max(0.5 * (A + discriminant), 1e-24);
      const r = Math.sqrt(r2);
      const dA = [2 * x, 2 * y, 2 * z];
      const dDiscriminant = dA.map((value, i) => (
        A * value + (i === 2 ? 4 * a2 * z : 0)
      ) / discriminant);
      const dR2 = dA.map((value, i) => 0.5 * (value + dDiscriminant[i]));
      const dR = dR2.map(value => value / (2 * r));

      const hDenominator = r2 * r2 + a2 * z * z;
      const H = mass * r * r2 / hDenominator;
      const dHDenominator = dR2.map((value, i) => (
        2 * r2 * value + (i === 2 ? 2 * a2 * z : 0)
      ));
      const dH = dR.map((value, i) => H * (
        3 * value / r - dHDenominator[i] / hDenominator
      ));

      const lDenominator = r2 + a2;
      // Keep the physical +z spin direction fixed when switching between the
      // ingoing and outgoing Cartesian Kerr-Schild charts.  The two charts'
      // azimuthal coordinates have opposite twist, so the spatial a-terms
      // change sign together with the time component of the principal null
      // one-form.
      const chartSpin = KS_TIME_SIGN * spin;
      const lNumerators = [r * x + chartSpin * y, r * y - chartSpin * x, z * lDenominator / r];
      const l = [
        lNumerators[0] / lDenominator,
        lNumerators[1] / lDenominator,
        z / r
      ];
      const dLDenominator = dR2;
      const dNumerators = [
        [dR[0] * x + r, dR[1] * x + chartSpin, dR[2] * x],
        [dR[0] * y - chartSpin, dR[1] * y + r, dR[2] * y],
        [-z * dR[0] / (r * r), -z * dR[1] / (r * r), 1 / r - z * dR[2] / (r * r)]
      ];
      const dL = [
        dNumerators[0].map((value, i) => (
          value * lDenominator - lNumerators[0] * dLDenominator[i]
        ) / (lDenominator * lDenominator)),
        dNumerators[1].map((value, i) => (
          value * lDenominator - lNumerators[1] * dLDenominator[i]
        ) / (lDenominator * lDenominator)),
        dNumerators[2]
      ];

      return { r, r2, dR, H, dH, l, dL };
    }

    function covariantMetric(position, spin, mass = METRIC_MASS) {
      const { H, l } = kerrFields(position, spin, mass);
      const lc = [KS_TIME_SIGN, ...l];
      const metric = Array.from({ length: 4 }, (_, mu) => (
        Array.from({ length: 4 }, (_, nu) => (
          (mu === nu ? (mu === 0 ? -1 : 1) : 0) + 2 * H * lc[mu] * lc[nu]
        ))
      ));
      return metric;
    }

    function matrixVector(matrix, vector) {
      return matrix.map(row => dot(row, vector));
    }

    function metricDot(metric, a, b) {
      return dot(a, matrixVector(metric, b));
    }

    function orthonormalize(candidate, basis, metric) {
      let vector = candidate.slice();
      for (const base of basis) {
        const denominator = metricDot(metric, base, base);
        vector = sub(vector, scale(base, metricDot(metric, vector, base) / denominator));
      }
      const squaredNorm = metricDot(metric, vector, vector);
      if (!(squaredNorm > 1e-20)) throw new Error("观测者局域标架退化；请增大 rₒ。 ");
      return scale(vector, 1 / Math.sqrt(squaredNorm));
    }

    function observerSetup(distance, inclinationDegrees, spin) {
      const theta = inclinationDegrees * Math.PI / 180;
      const sinTheta = Math.sin(theta);
      const cosTheta = Math.cos(theta);
      const equatorialRadius = Math.sqrt(distance * distance + spin * spin);
      const position = [equatorialRadius * sinTheta, 0, distance * cosTheta];
      const metric = covariantMetric(position, spin);
      if (!(metric[0][0] < 0)) throw new Error("静止观测者位于能层内；请增大 rₒ。 ");

      const time = [1 / Math.sqrt(-metric[0][0]), 0, 0, 0];
      const radialCandidate = [
        0,
        distance * sinTheta / equatorialRadius,
        0,
        cosTheta
      ];
      const betaCandidate = [0, -equatorialRadius * cosTheta, 0, distance * sinTheta];
      const alphaCandidate = [0, 0, 1, 0];
      const radial = orthonormalize(radialCandidate, [time], metric);
      let beta = orthonormalize(betaCandidate, [time, radial], metric);
      let alpha = orthonormalize(alphaCandidate, [time, radial, beta], metric);
      if (alpha[2] < 0) alpha = scale(alpha, -1);
      const betaSpatial = beta.slice(1);
      const desiredBeta = betaCandidate.slice(1);
      if (dot(betaSpatial, desiredBeta) < 0) beta = scale(beta, -1);
      return { theta, position, metric, time, radial, alpha, beta };
    }

    function initialRay(params, preparedSetup = null) {
      const setup = preparedSetup || observerSetup(params.distance, params.inclination, params.spin);
      const rho = Math.hypot(params.u, params.v);
      const screenScale = Math.hypot(params.distance, rho);
      const local = {
        time: -1,
        radial: -params.distance / screenScale,
        alpha: params.u / screenScale,
        beta: params.v / screenScale
      };
      let waveVector = scale(setup.time, local.time);
      waveVector = add(waveVector, scale(setup.radial, local.radial));
      waveVector = add(waveVector, scale(setup.alpha, local.alpha));
      waveVector = add(waveVector, scale(setup.beta, local.beta));
      const momentum = matrixVector(setup.metric, waveVector);
      const pT = momentum[0];
      const state = [0, ...setup.position, momentum[1], momentum[2], momentum[3]];
      const energy = -pT;
      const angularMomentum = setup.position[0] * momentum[2] - setup.position[1] * momentum[1];
      const sinTheta = Math.sin(setup.theta);
      let carter = Number.NaN;
      if (Math.abs(sinTheta) > 1e-8) {
        const qTheta = [
          Math.sqrt(params.distance * params.distance + params.spin * params.spin) * Math.cos(setup.theta),
          0,
          -params.distance * sinTheta
        ];
        const pTheta = dot(momentum.slice(1), qTheta);
        const cos2 = Math.cos(setup.theta) ** 2;
        carter = pTheta * pTheta + cos2 * (
          angularMomentum * angularMomentum / (sinTheta * sinTheta)
          - params.spin * params.spin * energy * energy
        );
      }
      return { state, pT, energy, angularMomentum, carter, setup, local };
    }

    function hamiltonianAndDerivative(state, pT, spin) {
      const position = state.slice(1, 4);
      const momentum = state.slice(4, 7);
      const fields = kerrFields(position, spin);
      const q = -KS_TIME_SIGN * pT + dot(fields.l, momentum);
      const flat = 0.5 * (-pT * pT + dot(momentum, momentum));
      const hamiltonian = flat - fields.H * q * q;
      const velocity = sub(momentum, scale(fields.l, 2 * fields.H * q));
      const timeVelocity = -pT + 2 * KS_TIME_SIGN * fields.H * q;
      const momentumDerivative = fields.dH.map((dHValue, coordinate) => {
        let dQ = 0;
        for (let component = 0; component < 3; component += 1) {
          dQ += fields.dL[component][coordinate] * momentum[component];
        }
        return dHValue * q * q + 2 * fields.H * q * dQ;
      });
      return {
        derivative: [timeVelocity, ...velocity, ...momentumDerivative],
        hamiltonian,
        radius: fields.r,
        radialVelocity: dot(fields.dR, velocity)
      };
    }

    function derivatives(state, pT, spin) {
      return hamiltonianAndDerivative(state, pT, spin).derivative;
    }

    function addScaled(base, terms) {
      return base.map((value, i) => (
        value + terms.reduce((sum, [factor, vector]) => sum + factor * vector[i], 0)
      ));
    }

    function dormandPrinceStep(state, step, pT, spin) {
      const k1 = derivatives(state, pT, spin);
      const k2 = derivatives(addScaled(state, [[step * (1 / 5), k1]]), pT, spin);
      const k3 = derivatives(addScaled(state, [
        [step * (3 / 40), k1], [step * (9 / 40), k2]
      ]), pT, spin);
      const k4 = derivatives(addScaled(state, [
        [step * (44 / 45), k1], [step * (-56 / 15), k2], [step * (32 / 9), k3]
      ]), pT, spin);
      const k5 = derivatives(addScaled(state, [
        [step * (19372 / 6561), k1], [step * (-25360 / 2187), k2],
        [step * (64448 / 6561), k3], [step * (-212 / 729), k4]
      ]), pT, spin);
      const k6 = derivatives(addScaled(state, [
        [step * (9017 / 3168), k1], [step * (-355 / 33), k2],
        [step * (46732 / 5247), k3], [step * (49 / 176), k4],
        [step * (-5103 / 18656), k5]
      ]), pT, spin);
      const fifth = addScaled(state, [
        [step * (35 / 384), k1], [step * (500 / 1113), k3],
        [step * (125 / 192), k4], [step * (-2187 / 6784), k5],
        [step * (11 / 84), k6]
      ]);
      const k7 = derivatives(fifth, pT, spin);
      const fourth = addScaled(state, [
        [step * (5179 / 57600), k1], [step * (7571 / 16695), k3],
        [step * (393 / 640), k4], [step * (-92097 / 339200), k5],
        [step * (187 / 2100), k6], [step * (1 / 40), k7]
      ]);
      return { fifth, fourth };
    }

    function integrationError(previous, fifth, fourth, rtol, atol) {
      let maximum = 0;
      for (let i = 0; i < previous.length; i += 1) {
        const reference = atol + rtol * Math.max(Math.abs(previous[i]), Math.abs(fifth[i]));
        maximum = Math.max(maximum, Math.abs(fifth[i] - fourth[i]) / reference);
      }
      return maximum;
    }

    function relativeNullError(state, pT, spin) {
      const info = hamiltonianAndDerivative(state, pT, spin);
      const momentum = state.slice(4, 7);
      const scaleValue = pT * pT + dot(momentum, momentum) + 1e-30;
      return Math.abs(2 * info.hamiltonian) / scaleValue;
    }

    function carterConstantFromState(state, pT, spin) {
      const [x, y, z, px, py, pz] = state.slice(1);
      const fields = kerrFields([x, y, z], spin);
      const cosTheta = clamp(z / fields.r, -1, 1);
      const sin2 = Math.max(0, 1 - cosTheta * cosTheta);
      if (sin2 < 1e-14) return Number.NaN;
      const sinTheta = Math.sqrt(sin2);
      const cotTheta = cosTheta / sinTheta;
      const pTheta = (px * x + py * y) * cotTheta - pz * fields.r * sinTheta;
      const energy = -pT;
      const angularMomentum = x * py - y * px;
      return pTheta * pTheta + cosTheta * cosTheta * (
        angularMomentum * angularMomentum / sin2 - spin * spin * energy * energy
      );
    }

    function locateRadiusEvent(startState, endState, fullStep, pT, spin, targetRadius) {
      let lowFraction = 0;
      let highFraction = 1;
      let lowState = startState;
      let highState = endState;
      let lowRadius = hamiltonianAndDerivative(lowState, pT, spin).radius;
      let highRadius = hamiltonianAndDerivative(highState, pT, spin).radius;
      if (!(lowRadius > targetRadius && highRadius <= targetRadius)) {
        return { state: endState, fraction: 1 };
      }
      for (let iteration = 0; iteration < 48; iteration += 1) {
        const middleFraction = 0.5 * (lowFraction + highFraction);
        const middleState = dormandPrinceStep(startState, fullStep * middleFraction, pT, spin).fifth;
        const middleRadius = hamiltonianAndDerivative(middleState, pT, spin).radius;
        if (middleRadius > targetRadius) {
          lowFraction = middleFraction;
          lowState = middleState;
          lowRadius = middleRadius;
        } else {
          highFraction = middleFraction;
          highState = middleState;
          highRadius = middleRadius;
        }
      }
      if (Math.abs(lowRadius - targetRadius) <= Math.abs(highRadius - targetRadius)) {
        return { state: lowState, fraction: lowFraction };
      }
      return { state: highState, fraction: highFraction };
    }

    function pointFromState(state, affine, pT, spin) {
      const info = hamiltonianAndDerivative(state, pT, spin);
      return {
        affine,
        time: state[0],
        x: state[1],
        y: state[2],
        z: state[3],
        px: state[4],
        py: state[5],
        pz: state[6],
        r: info.radius,
        radialVelocity: info.radialVelocity,
        nullError: relativeNullError(state, pT, spin)
      };
    }

    function integrateKerrRay(params, options = {}) {
      const rtol = options.rtol ?? 2e-9;
      const atol = options.atol ?? 2e-11;
      const initial = initialRay(params);
      const horizon = METRIC_MASS + Math.sqrt(METRIC_MASS * METRIC_MASS - params.spin * params.spin);
      // Stop on an exterior guard only two parts in 10^10 above r_+.  Outgoing
      // Kerr-Schild coordinates remain regular here; the tiny offset prevents
      // roundoff from classifying a point on the horizon as lying inside it.
      const horizonStop = horizon * (1 + 2e-10);
      const farRadius = Math.max(1.5 * params.distance, 500);
      let state = initial.state.slice();
      let affine = 0;
      let step = 0.5;
      let accepted = 0;
      let rejected = 0;
      let minR = params.distance;
      let minIndex = 0;
      let maxNullError = relativeNullError(state, initial.pT, params.spin);
      let maxCarterError = 0;
      let passedNearField = false;
      let status = "limit";
      const points = [pointFromState(state, affine, initial.pT, params.spin)];

      while (accepted < 180000) {
        const currentInfo = hamiltonianAndDerivative(state, initial.pT, params.spin);
        const localStepMax = clamp(0.18 * Math.max(currentInfo.radius - horizon, 0.03), 0.003, 8);
        step = Math.min(step, localStepMax);
        const trial = dormandPrinceStep(state, step, initial.pT, params.spin);
        const error = integrationError(state, trial.fifth, trial.fourth, rtol, atol);
        if (!Number.isFinite(error)) {
          status = "error";
          break;
        }
        if (error > 1) {
          step *= clamp(0.9 * Math.pow(error, -0.2), 0.1, 0.5);
          rejected += 1;
          if (step < 1e-10 || rejected > 100000) {
            status = "error";
            break;
          }
          continue;
        }

        const previousState = state;
        state = trial.fifth;
        affine += step;
        accepted += 1;
        const info = hamiltonianAndDerivative(state, initial.pT, params.spin);
        if (![...state, info.radius, info.radialVelocity].every(Number.isFinite)) {
          status = "error";
          break;
        }

        if (info.radius < minR) {
          minR = info.radius;
          minIndex = points.length;
        }
        if (info.radius < 0.8 * params.distance) passedNearField = true;
        maxNullError = Math.max(maxNullError, relativeNullError(state, initial.pT, params.spin));
        const currentCarter = carterConstantFromState(state, initial.pT, params.spin);
        if (Number.isFinite(initial.carter) && Number.isFinite(currentCarter)) {
          maxCarterError = Math.max(
            maxCarterError,
            Math.abs(currentCarter - initial.carter) / Math.max(1, Math.abs(initial.carter))
          );
        }
        points.push(pointFromState(state, affine, initial.pT, params.spin));

        if (info.radius <= horizonStop) {
          const event = locateRadiusEvent(
            previousState, state, step, initial.pT, params.spin, horizonStop
          );
          state = event.state;
          affine -= step * (1 - event.fraction);
          const eventPoint = pointFromState(state, affine, initial.pT, params.spin);
          points[points.length - 1] = eventPoint;
          minR = eventPoint.r;
          minIndex = points.length - 1;
          status = "capture";
          break;
        }

        if (passedNearField && info.radius >= farRadius && info.radialVelocity > 0) {
          status = "escape";
          break;
        }

        if (affine > 5e6) {
          status = "limit";
          break;
        }
        step *= clamp(0.9 * Math.pow(Math.max(error, 1e-14), -0.2), 0.5, 4.0);
      }

      if (points.length > MAX_POINTS) {
        const stride = Math.ceil(points.length / MAX_POINTS);
        const reduced = points.filter((_, index) => index % stride === 0);
        if (reduced[reduced.length - 1] !== points[points.length - 1]) reduced.push(points[points.length - 1]);
        const closest = reduced.reduce((best, point, index) => (
          point.r < best.r ? { r: point.r, index } : best
        ), { r: Number.POSITIVE_INFINITY, index: 0 });
        return {
          ...initial,
          points: reduced,
          status,
          horizon,
          farRadius,
          minR,
          minIndex: closest.index,
          maxNullError,
          maxCarterError,
          accepted,
          rejected
        };
      }
      return {
        ...initial,
        points,
        status,
        horizon,
        farRadius,
        minR,
        minIndex,
        maxNullError,
        maxCarterError,
        accepted,
        rejected
      };
    }

    function setCanvasSize(canvas) {
      const rect = canvas.getBoundingClientRect();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.round(rect.width * ratio));
      const height = Math.max(1, Math.round(rect.height * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      const context = canvas.getContext("2d");
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      return { context, width: rect.width, height: rect.height, ratio };
    }

    function screenLayout(width, height) {
      const size = Math.min(width, height) - 22;
      return {
        size,
        left: (width - size) / 2,
        top: (height - size) / 2,
        scale: size / (2 * screenView.halfExtent)
      };
    }

    function kerrPhotonRadii(spin) {
      const magnitude = Math.abs(spin);
      if (magnitude < 1e-10) return { low: 3, high: 3 };
      return {
        low: 2 * (1 + Math.cos((2 / 3) * Math.acos(-magnitude))),
        high: 2 * (1 + Math.cos((2 / 3) * Math.acos(magnitude)))
      };
    }

    function sphericalPhotonConstants(radius, spin) {
      const numeratorXi = radius * radius * (radius - 3)
        + spin * spin * (radius + 1);
      const xi = numeratorXi / (spin * (1 - radius));
      const eta = radius ** 3 * (
        4 * spin * spin - radius * (radius - 3) ** 2
      ) / (spin * spin * (1 - radius) ** 2);
      return { xi, eta };
    }

    function polarCriticalRadius(spin) {
      if (Math.abs(spin) < 1e-9) return 3 * Math.sqrt(3);
      const horizon = 1 + Math.sqrt(1 - spin * spin);
      const equation = radius => (
        radius * radius * (radius - 3) + spin * spin * (radius + 1)
      );
      let low = horizon + 1e-8;
      let high = 4;
      let previous = low;
      let previousValue = equation(previous);
      for (let i = 1; i <= 400; i += 1) {
        const candidate = low + (high - low) * i / 400;
        const value = equation(candidate);
        if (previousValue * value <= 0) {
          low = previous;
          high = candidate;
          break;
        }
        previous = candidate;
        previousValue = value;
      }
      for (let i = 0; i < 80; i += 1) {
        const middle = 0.5 * (low + high);
        if (equation(low) * equation(middle) <= 0) high = middle;
        else low = middle;
      }
      const radius = 0.5 * (low + high);
      const { eta } = sphericalPhotonConstants(radius, spin);
      return Math.sqrt(Math.max(eta + spin * spin, 0));
    }

    function asymptoticCriticalRadialInterval(spin, theta) {
      const { low, high } = kerrPhotonRadii(spin);
      const betaSquared = radius => {
        const { xi, eta } = sphericalPhotonConstants(radius, spin);
        const sinTheta = Math.sin(theta);
        const cosineTheta = Math.cos(theta);
        return eta + spin * spin * cosineTheta * cosineTheta
          - xi * xi * (cosineTheta / sinTheta) ** 2;
      };
      const samples = 4096;
      let firstAllowed = -1;
      let lastAllowed = -1;
      for (let index = 0; index <= samples; index += 1) {
        const radius = low + (high - low) * index / samples;
        if (betaSquared(radius) >= -1e-12) {
          if (firstAllowed < 0) firstAllowed = index;
          lastAllowed = index;
        }
      }
      if (firstAllowed < 0) return null;

      const refineBoundary = (outsideRadius, insideRadius) => {
        let outside = outsideRadius;
        let inside = insideRadius;
        for (let iteration = 0; iteration < 80; iteration += 1) {
          const middle = 0.5 * (outside + inside);
          if (betaSquared(middle) >= 0) inside = middle;
          else outside = middle;
        }
        return inside;
      };
      const firstRadius = low + (high - low) * firstAllowed / samples;
      const lastRadius = low + (high - low) * lastAllowed / samples;
      const start = firstAllowed === 0
        ? low
        : refineBoundary(low + (high - low) * (firstAllowed - 1) / samples, firstRadius);
      const end = lastAllowed === samples
        ? high
        : refineBoundary(low + (high - low) * (lastAllowed + 1) / samples, lastRadius);
      return { start, end, betaSquared };
    }

    function prepareScreenConstantMap(params, setup) {
      const covariantTime = matrixVector(setup.metric, setup.time);
      const covariantRadial = matrixVector(setup.metric, setup.radial);
      const covariantAlpha = matrixVector(setup.metric, setup.alpha);
      const covariantBeta = matrixVector(setup.metric, setup.beta);
      const sinTheta = Math.sin(setup.theta);
      const cos2 = Math.cos(setup.theta) ** 2;
      const qTheta = [
        Math.sqrt(params.distance * params.distance + params.spin * params.spin) * Math.cos(setup.theta),
        0,
        -params.distance * sinTheta
      ];
      return (u, v) => {
        const screenScale = Math.hypot(params.distance, u, v);
        const radialCoefficient = -params.distance / screenScale;
        const alphaCoefficient = u / screenScale;
        const betaCoefficient = v / screenScale;
        const momentum = covariantTime.map((timeValue, index) => (
          -timeValue
          + radialCoefficient * covariantRadial[index]
          + alphaCoefficient * covariantAlpha[index]
          + betaCoefficient * covariantBeta[index]
        ));
        const energy = -momentum[0];
        const angularMomentum = setup.position[0] * momentum[2] - setup.position[1] * momentum[1];
        const pTheta = dot(momentum.slice(1), qTheta);
        const carter = pTheta * pTheta + cos2 * (
          angularMomentum * angularMomentum / (sinTheta * sinTheta)
          - params.spin * params.spin * energy * energy
        );
        return {
          xi: angularMomentum / energy,
          eta: carter / (energy * energy)
        };
      };
    }

    function solveFiniteScreenPoint(constantMap, targetXi, targetEta, seedU, seedV) {
      let u = seedU;
      let v = Math.max(0, seedV);
      if (v < 1e-8) {
        v = 0;
        for (let iteration = 0; iteration < 12; iteration += 1) {
          const value = constantMap(u, 0).xi - targetXi;
          if (Math.abs(value) < 2e-13) break;
          const step = 2e-5 * Math.max(1, Math.abs(u));
          const derivative = (
            constantMap(u + step, 0).xi
            - constantMap(u - step, 0).xi
          ) / (2 * step);
          if (!Number.isFinite(derivative) || Math.abs(derivative) < 1e-12) break;
          u -= value / derivative;
        }
        return [u, 0];
      }

      const residual = (trialU, trialV) => {
        const constants = constantMap(trialU, trialV);
        const first = constants.xi - targetXi;
        const second = constants.eta - targetEta;
        return {
          first,
          second,
          norm: Math.hypot(first, second / Math.max(1, Math.abs(targetEta)))
        };
      };

      for (let iteration = 0; iteration < 10; iteration += 1) {
        const current = residual(u, v);
        if (current.norm < 2e-12) break;
        const stepU = 2e-5 * Math.max(1, Math.abs(u));
        const stepV = 2e-5 * Math.max(1, Math.abs(v));
        const plusU = constantMap(u + stepU, v);
        const minusU = constantMap(u - stepU, v);
        const plusV = constantMap(u, v + stepV);
        const minusV = constantMap(u, Math.max(0, v - stepV));
        const actualVSpan = (v + stepV) - Math.max(0, v - stepV);
        const xiU = (plusU.xi - minusU.xi) / (2 * stepU);
        const etaU = (plusU.eta - minusU.eta) / (2 * stepU);
        const xiV = (plusV.xi - minusV.xi) / actualVSpan;
        const etaV = (plusV.eta - minusV.eta) / actualVSpan;
        const determinant = xiU * etaV - xiV * etaU;
        if (!Number.isFinite(determinant) || Math.abs(determinant) < 1e-13) break;
        let deltaU = (-current.first * etaV + xiV * current.second) / determinant;
        let deltaV = (etaU * current.first - xiU * current.second) / determinant;
        const deltaLength = Math.hypot(deltaU, deltaV);
        const limit = 0.4 * Math.max(1, Math.hypot(u, v));
        if (deltaLength > limit) {
          deltaU *= limit / deltaLength;
          deltaV *= limit / deltaLength;
        }
        let damping = 1;
        let accepted = false;
        while (damping >= 1 / 32) {
          const trialU = u + damping * deltaU;
          const trialV = Math.max(0, v + damping * deltaV);
          if (residual(trialU, trialV).norm < current.norm) {
            u = trialU;
            v = trialV;
            accepted = true;
            break;
          }
          damping *= 0.5;
        }
        if (!accepted) break;
      }
      return [u, v];
    }

    function schwarzschildFiniteCriticalRadius(distance) {
      const impact = 3 * Math.sqrt(3);
      const lapseSquared = 1 - 2 / distance;
      return impact * distance * Math.sqrt(
        lapseSquared / (distance * distance - impact * impact * lapseSquared)
      );
    }

    function axisFiniteCriticalRadius(params) {
      let captured = 0;
      let escaped = 8;
      while (escaped < SCREEN_EXTENT) {
        const result = integrateKerrRay({ ...params, u: escaped, v: 0 }, { rtol: 2e-7, atol: 2e-9 });
        if (result.status === "escape") break;
        escaped *= 1.5;
      }
      for (let iteration = 0; iteration < 28; iteration += 1) {
        const middle = 0.5 * (captured + escaped);
        const result = integrateKerrRay({ ...params, u: middle, v: 0 }, { rtol: 2e-7, atol: 2e-9 });
        if (result.status === "escape") escaped = middle;
        else captured = middle;
      }
      return 0.5 * (captured + escaped);
    }

    let criticalCurveCache = { key: "", points: [] };

    function criticalCurve(params) {
      const { spin, inclination: inclinationDegrees, distance } = params;
      const cacheKey = [spin, inclinationDegrees, distance].map(value => Number(value).toPrecision(14)).join("|");
      if (criticalCurveCache.key === cacheKey) return criticalCurveCache.points;
      const theta = inclinationDegrees * Math.PI / 180;
      const sinTheta = Math.sin(theta);
      if (Math.abs(spin) < 1e-8) {
        const radius = schwarzschildFiniteCriticalRadius(distance);
        const points = Array.from({ length: 361 }, (_, index) => {
          const angle = TWO_PI * index / 360;
          return [radius * Math.cos(angle), radius * Math.sin(angle)];
        });
        criticalCurveCache = { key: cacheKey, points };
        return points;
      }
      if (Math.abs(sinTheta) < 1e-5) {
        const radius = axisFiniteCriticalRadius(params);
        const points = Array.from({ length: 361 }, (_, index) => {
          const angle = TWO_PI * index / 360;
          return [radius * Math.cos(angle), radius * Math.sin(angle)];
        });
        criticalCurveCache = { key: cacheKey, points };
        return points;
      }

      const interval = asymptoticCriticalRadialInterval(spin, theta);
      if (!interval) {
        const radius = polarCriticalRadius(spin);
        const points = Array.from({ length: 361 }, (_, index) => {
          const angle = TWO_PI * index / 360;
          return [radius * Math.cos(angle), radius * Math.sin(angle)];
        });
        criticalCurveCache = { key: cacheKey, points };
        return points;
      }
      const setup = observerSetup(distance, inclinationDegrees, spin);
      const constantMap = prepareScreenConstantMap(params, setup);
      const upper = [];
      const samples = 900;
      for (let index = 0; index <= samples; index += 1) {
        const phase = Math.PI * index / samples;
        const radius = 0.5 * (interval.start + interval.end)
          - 0.5 * (interval.end - interval.start) * Math.cos(phase);
        const { xi, eta } = sphericalPhotonConstants(radius, spin);
        const alpha = -xi / sinTheta;
        const beta = (index === 0 || index === samples)
          ? 0
          : Math.sqrt(Math.max(interval.betaSquared(radius), 0));
        upper.push(solveFiniteScreenPoint(constantMap, xi, eta, alpha, beta));
      }
      const lower = [];
      for (let index = upper.length - 2; index >= 1; index -= 1) {
        lower.push([upper[index][0], -upper[index][1]]);
      }
      const points = upper.concat(lower);
      criticalCurveCache = { key: cacheKey, points };
      return points;
    }

    function adaptiveParametricCurve(evaluate, start, end, coarseSegments, pixelsPerUnit, bounds) {
      const output = [];
      const cache = new Map();
      const pointAt = parameter => {
        const key = parameter.toPrecision(17);
        if (!cache.has(key)) cache.set(key, evaluate(parameter));
        return cache.get(key);
      };
      const nearView = (a, middle, b, padding = 0) => {
        const minimumU = Math.min(a[0], middle[0], b[0]);
        const maximumU = Math.max(a[0], middle[0], b[0]);
        const minimumV = Math.min(a[1], middle[1], b[1]);
        const maximumV = Math.max(a[1], middle[1], b[1]);
        return maximumU + padding >= bounds.minU && minimumU - padding <= bounds.maxU
          && maximumV + padding >= bounds.minV && minimumV - padding <= bounds.maxV;
      };
      const chordError = (a, middle, b) => {
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const denominator = Math.hypot(dx, dy);
        if (denominator < 1e-30) return Math.hypot(middle[0] - a[0], middle[1] - a[1]);
        return Math.abs(dy * middle[0] - dx * middle[1] + b[0] * a[1] - b[1] * a[0]) / denominator;
      };
      const appendSegment = (parameterA, pointA, parameterB, pointB, depth) => {
        const middleParameter = 0.5 * (parameterA + parameterB);
        const middlePoint = pointAt(middleParameter);
        const worldLength = Math.hypot(pointB[0] - pointA[0], pointB[1] - pointA[1]);
        const worldError = chordError(pointA, middlePoint, pointB);
        const projectedLength = worldLength * pixelsPerUnit;
        const projectedError = worldError * pixelsPerUnit;
        // Keep a uniformly refined backbone so an ultra-small viewport cannot fall
        // between three coarse samples.  Near the visible window, continue until
        // both curvature and chord length are sub-pixel smooth.
        const minimumDepth = 4;
        const conservativePadding = Math.max(2.5 * worldError, 0.012 * worldLength, 2 / pixelsPerUnit);
        const relevantToView = nearView(pointA, middlePoint, pointB, conservativePadding);
        const shouldRefine = depth < 20 && output.length < 12000
          && (depth < minimumDepth
            || (relevantToView && (projectedError > 0.10 || projectedLength > 6)));
        if (shouldRefine) {
          appendSegment(parameterA, pointA, middleParameter, middlePoint, depth + 1);
          appendSegment(middleParameter, middlePoint, parameterB, pointB, depth + 1);
        } else {
          output.push(pointB);
        }
      };
      const first = pointAt(start);
      output.push(first);
      for (let index = 0; index < coarseSegments; index += 1) {
        const parameterA = start + (end - start) * index / coarseSegments;
        const parameterB = start + (end - start) * (index + 1) / coarseSegments;
        appendSegment(parameterA, pointAt(parameterA), parameterB, pointAt(parameterB), 0);
      }
      return output;
    }

    function criticalCurveForView(params, pixelsPerUnit) {
      const margin = 0.12 * screenView.halfExtent + 3 / Math.max(pixelsPerUnit, 1e-30);
      const bounds = {
        minU: screenView.centerU - screenView.halfExtent - margin,
        maxU: screenView.centerU + screenView.halfExtent + margin,
        minV: screenView.centerV - screenView.halfExtent - margin,
        maxV: screenView.centerV + screenView.halfExtent + margin
      };
      const theta = params.inclination * Math.PI / 180;
      const sinTheta = Math.sin(theta);
      let circleRadius = null;
      if (Math.abs(params.spin) < 1e-8) circleRadius = schwarzschildFiniteCriticalRadius(params.distance);
      else if (Math.abs(sinTheta) < 1e-5) circleRadius = axisFiniteCriticalRadius(params);
      if (circleRadius !== null) {
        return adaptiveParametricCurve(
          parameter => [circleRadius * Math.cos(TWO_PI * parameter), circleRadius * Math.sin(TWO_PI * parameter)],
          0, 1, 72, pixelsPerUnit, bounds
        );
      }

      const interval = asymptoticCriticalRadialInterval(params.spin, theta);
      if (!interval) {
        const radius = polarCriticalRadius(params.spin);
        return adaptiveParametricCurve(
          parameter => [radius * Math.cos(TWO_PI * parameter), radius * Math.sin(TWO_PI * parameter)],
          0, 1, 72, pixelsPerUnit, bounds
        );
      }
      const setup = observerSetup(params.distance, params.inclination, params.spin);
      const constantMap = prepareScreenConstantMap(params, setup);
      const upperPoint = parameter => {
        const phase = Math.PI * parameter;
        const radius = 0.5 * (interval.start + interval.end)
          - 0.5 * (interval.end - interval.start) * Math.cos(phase);
        const { xi, eta } = sphericalPhotonConstants(radius, params.spin);
        const alpha = -xi / sinTheta;
        const beta = (parameter <= 0 || parameter >= 1)
          ? 0
          : Math.sqrt(Math.max(interval.betaSquared(radius), 0));
        return solveFiniteScreenPoint(constantMap, xi, eta, alpha, beta);
      };
      const upper = adaptiveParametricCurve(upperPoint, 0, 1, 72, pixelsPerUnit, bounds);
      const lowerBounds = { minU: bounds.minU, maxU: bounds.maxU, minV: -bounds.maxV, maxV: -bounds.minV };
      const lowerUpper = adaptiveParametricCurve(upperPoint, 1, 0, 72, pixelsPerUnit, lowerBounds);
      const lower = lowerUpper.slice(1, -1).map(point => [point[0], -point[1]]);
      return upper.concat(lower);
    }

    function modelParameters(mode = activeTraceMode, coordinateOverride = null) {
      const mass = clamp(finiteNumber(ui.mass, 10), 0.1, 1e10);
      const spin = clamp(finiteNumber(ui.spin, 0.9), -0.999, 0.999);
      const inclination = clamp(finiteNumber(ui.inclination, 60), 0, 180);
      const distance = clamp(finiteNumber(ui.observerRadius, DEFAULT_OBSERVER_DISTANCE), 20, 100000);
      const coordinates = coordinateOverride || readCoordinates(mode);
      const u = clamp(coordinates.u, -SCREEN_EXTENT, SCREEN_EXTENT);
      const v = clamp(coordinates.v, -SCREEN_EXTENT, SCREEN_EXTENT);
      return { mass, spin, inclination, distance, u, v, impact: Math.hypot(u, v) };
    }

    function drawScreen() {
      const { context: ctx, width, height } = setCanvasSize(ui.screenCanvas);
      const layout = screenLayout(width, height);
      const params = modelParameters();
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);

      const toCanvas = ([u, v]) => [
        layout.left + layout.size / 2 + (u - screenView.centerU) * layout.scale,
        layout.top + layout.size / 2 - (v - screenView.centerV) * layout.scale
      ];
      const minU = screenView.centerU - screenView.halfExtent;
      const maxU = screenView.centerU + screenView.halfExtent;
      const minV = screenView.centerV - screenView.halfExtent;
      const maxV = screenView.centerV + screenView.halfExtent;
      const rawGrid = Math.pow(10, Math.floor(Math.log10(2 * screenView.halfExtent / 6)));
      const gridStep = [1, 2, 5, 10].map(factor => factor * rawGrid)
        .find(step => 2 * screenView.halfExtent / step <= 10) || 10 * rawGrid;

      ctx.save();
      ctx.beginPath();
      ctx.rect(layout.left, layout.top, layout.size, layout.size);
      ctx.clip();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#eceff2";
      for (let u = Math.ceil(minU / gridStep) * gridStep; u <= maxU; u += gridStep) {
        const [x] = toCanvas([u, 0]);
        ctx.beginPath(); ctx.moveTo(x, layout.top); ctx.lineTo(x, layout.top + layout.size); ctx.stroke();
      }
      for (let v = Math.ceil(minV / gridStep) * gridStep; v <= maxV; v += gridStep) {
        const [, y] = toCanvas([0, v]);
        ctx.beginPath(); ctx.moveTo(layout.left, y); ctx.lineTo(layout.left + layout.size, y); ctx.stroke();
      }

      ctx.strokeStyle = "#adb4bc";
      if (minU <= 0 && maxU >= 0) {
        const [x] = toCanvas([0, 0]);
        ctx.beginPath(); ctx.moveTo(x, layout.top); ctx.lineTo(x, layout.top + layout.size); ctx.stroke();
      }
      if (minV <= 0 && maxV >= 0) {
        const [, y] = toCanvas([0, 0]);
        ctx.beginPath(); ctx.moveTo(layout.left, y); ctx.lineTo(layout.left + layout.size, y); ctx.stroke();
      }

      const curve = criticalCurveForView(params, layout.scale);
      ctx.beginPath();
      curve.forEach((point, index) => {
        const [x, y] = toCanvas(point);
        if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fillStyle = "#02050b";
      ctx.fill();
      ctx.strokeStyle = "#7e2723";
      ctx.lineWidth = 1.4;
      ctx.stroke();

      if (activeTraceMode === "multi") {
        ctx.fillStyle = "rgba(93,199,255,0.90)";
        for (const point of multiSelectedPoints) {
          const [x, y] = toCanvas([point.u, point.v]);
          ctx.beginPath(); ctx.arc(x, y, 2.7, 0, TWO_PI); ctx.fill();
        }
      }
      const [selectedX, selectedY] = toCanvas([params.u, params.v]);
      ctx.strokeStyle = "#ef4c36";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(selectedX - 7, selectedY); ctx.lineTo(selectedX + 7, selectedY);
      ctx.moveTo(selectedX, selectedY - 7); ctx.lineTo(selectedX, selectedY + 7);
      ctx.stroke();
      ctx.fillStyle = "#ffd34d";
      ctx.beginPath(); ctx.arc(selectedX, selectedY, 3.2, 0, TWO_PI); ctx.fill();
      ctx.restore();

      ctx.strokeStyle = "#c4c9cf";
      ctx.strokeRect(layout.left, layout.top, layout.size, layout.size);
      ctx.fillStyle = "#5f6670";
      ctx.font = "12px ui-sans-serif, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("α / M", layout.left + layout.size - 7, layout.top + layout.size / 2 - 7);
      ctx.save();
      ctx.translate(layout.left + layout.size / 2 + 9, layout.top + 15);
      ctx.textAlign = "left";
      ctx.fillText("β / M", 0, 0);
      ctx.restore();
      ui.screenZoom.textContent = `×${(SCREEN_EXTENT / screenView.halfExtent).toLocaleString("zh-CN", { maximumFractionDigits: 2 })}`;
    }

    function convexHull(points) {
      const sorted = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      if (sorted.length <= 2) return sorted;
      const turn = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
      const lower = [];
      for (const point of sorted) {
        while (lower.length >= 2 && turn(lower[lower.length - 2], lower[lower.length - 1], point) <= 0) lower.pop();
        lower.push(point);
      }
      const upper = [];
      for (let i = sorted.length - 1; i >= 0; i -= 1) {
        const point = sorted[i];
        while (upper.length >= 2 && turn(upper[upper.length - 2], upper[upper.length - 1], point) <= 0) upper.pop();
        upper.push(point);
      }
      lower.pop(); upper.pop();
      return lower.concat(upper);
    }

    class KerrRenderer {
      constructor(canvas) {
        this.canvas = canvas;
        this.context = canvas.getContext("2d");
        this.defaultYaw = 0.80;
        this.defaultPitch = 0.34;
        this.yaw = this.defaultYaw;
        this.pitch = this.defaultPitch;
        this.cameraRight = [1, 0, 0];
        this.cameraUp = [0, 0, 1];
        this.cameraDepth = [0, 1, 0];
        this.updateCameraBasis();
        this.zoom = 1;
        this.result = null;
        this.params = null;
        this.path = [];
        this.visibleMode = "whole";
        this.animatedRays = [];
        this.nextRayId = 1;
        this.trailFraction = 0.18;
        this.playbackDirection = "reverse";
        this.animationPaused = false;
        this.pauseStartedAt = null;
        this.animationFrameId = null;
        this.onRaySetChanged = null;
        this.dragging = false;
        this.hovered = false;
        this.lastPointer = { x: 0, y: 0 };
        this.stars = this.createStars(210);
        this.bindEvents();
        this.resizeObserver = new ResizeObserver(() => this.draw());
        this.resizeObserver.observe(canvas.parentElement);
      }

      createStars(count) {
        let seed = 0x4b455252;
        const random = () => {
          seed = (1664525 * seed + 1013904223) >>> 0;
          return seed / 0x100000000;
        };
        return Array.from({ length: count }, () => ({
          x: random(), y: random(), radius: 0.35 + 1.05 * random(), alpha: 0.25 + 0.65 * random()
        }));
      }

      resetView() {
        this.yaw = this.defaultYaw;
        this.pitch = this.defaultPitch;
        this.updateCameraBasis();
        this.zoom = 1;
        this.draw();
      }

      updateCameraBasis() {
        const cosine = Math.cos(this.pitch);
        const sine = Math.sin(this.pitch);
        const cosineYaw = Math.cos(this.yaw);
        const sineYaw = Math.sin(this.yaw);
        this.cameraDepth = [cosine * cosineYaw, cosine * sineYaw, sine];
        this.cameraRight = [-sineYaw, cosineYaw, 0];
        this.cameraUp = [-sine * cosineYaw, -sine * sineYaw, cosine];
      }

      setResult(result, params) {
        this.result = result;
        this.params = params;
        this.path = this.trimPath(result?.points || [], 80);
        this.hovered = false;
        this.draw();
      }

      setAnimationMode(mode, params = this.params) {
        this.visibleMode = mode;
        this.params = params || this.params;
        this.hovered = false;
        this.ensureAnimationLoop();
        this.draw();
      }

      setTrailFraction(value) {
        this.trailFraction = clamp(value, 0.04, 0.45);
        this.draw();
      }

      setPlaybackDirection(direction) {
        this.playbackDirection = direction === "forward" ? "forward" : "reverse";
        this.draw();
      }

      setAnimationPaused(paused) {
        const now = performance.now();
        if (paused === this.animationPaused) return;
        if (paused) {
          this.animationPaused = true;
          this.pauseStartedAt = now;
          if (this.animationFrameId !== null) cancelAnimationFrame(this.animationFrameId);
          this.animationFrameId = null;
        } else {
          const delta = Math.max(0, now - (this.pauseStartedAt ?? now));
          for (const ray of this.animatedRays) ray.startTime += delta;
          this.animationPaused = false;
          this.pauseStartedAt = null;
          this.ensureAnimationLoop();
        }
        this.draw();
      }

      animatedRayCount(mode) {
        return this.animatedRays.filter(ray => ray.mode === mode).length;
      }

      clearAnimatedRays(mode) {
        const before = this.animatedRays.length;
        this.animatedRays = this.animatedRays.filter(ray => ray.mode !== mode);
        if (before !== this.animatedRays.length) this.onRaySetChanged?.();
        this.draw();
      }

      removeAnimatedRay(rayId) {
        const before = this.animatedRays.length;
        this.animatedRays = this.animatedRays.filter(ray => ray.id !== rayId);
        if (before !== this.animatedRays.length) this.onRaySetChanged?.();
        this.draw();
      }

      addAnimatedRay(result, params, mode, sharedStartTime = performance.now()) {
        const points = this.trimPath(result?.points || [], ANIMATION_RADIUS);
        if (points.length < 2) return null;
        const stride = Math.max(1, Math.ceil(points.length / 1800));
        const sampled = points.filter((point, index) => index % stride === 0 || index === points.length - 1);
        const affineStart = sampled[0].affine ?? 0;
        const affineEnd = sampled[sampled.length - 1].affine ?? sampled.length - 1;
        const affineSpan = Math.max(1e-9, affineEnd - affineStart);
        const ray = {
          id: this.nextRayId++, mode, points: sampled, params,
          affineStart, affineEnd, affineSpan,
          timelineStart: affineStart,
          timelineEnd: affineEnd,
          startTime: this.animationPaused ? (this.pauseStartedAt ?? performance.now()) : sharedStartTime,
          duration: clamp(affineSpan * 95, 4200, 11500),
          gap: 900,
          loop: mode === "multi"
        };
        this.animatedRays.push(ray);
        this.visibleMode = mode;
        this.params = params;
        this.onRaySetChanged?.();
        this.ensureAnimationLoop();
        this.draw();
        return ray.id;
      }

      synchronizeAnimatedGroup(mode, startTime = performance.now() + 120) {
        const rays = this.animatedRays.filter(ray => ray.mode === mode);
        if (!rays.length) return;
        const timelineStart = Math.max(...rays.map(ray => ray.affineStart));
        const timelineEnd = Math.max(...rays.map(ray => ray.affineEnd));
        const duration = clamp((timelineEnd - timelineStart) * 95, 4200, 11500);
        const synchronizedStart = this.animationPaused
          ? (this.pauseStartedAt ?? performance.now()) + Math.max(0, startTime - performance.now())
          : startTime;
        for (const ray of rays) {
          ray.startTime = synchronizedStart;
          ray.duration = duration;
          ray.timelineStart = timelineStart;
          ray.timelineEnd = timelineEnd;
        }
        this.ensureAnimationLoop();
      }

      ensureAnimationLoop() {
        if (this.animationPaused || this.visibleMode === "whole" || this.animationFrameId !== null) return;
        if (!this.animatedRays.some(ray => ray.mode === this.visibleMode)) return;
        const tick = now => {
          this.animationFrameId = null;
          this.draw(now);
          if (!this.animationPaused && this.visibleMode !== "whole"
            && this.animatedRays.some(ray => ray.mode === this.visibleMode)) {
            this.animationFrameId = requestAnimationFrame(tick);
          }
        };
        this.animationFrameId = requestAnimationFrame(tick);
      }

      trimPath(points, radiusLimit) {
        if (points.length < 2) return points.slice();
        const output = [];
        for (let i = 1; i < points.length; i += 1) {
          const previous = points[i - 1];
          const current = points[i];
          const previousInside = previous.r <= radiusLimit;
          const currentInside = current.r <= radiusLimit;
          if (previousInside && output.length === 0) output.push(previous);
          if (previousInside && currentInside) {
            output.push(current);
          } else if (previousInside !== currentInside) {
            const fraction = clamp((radiusLimit - previous.r) / (current.r - previous.r), 0, 1);
            output.push({
              ...current,
              x: previous.x + fraction * (current.x - previous.x),
              y: previous.y + fraction * (current.y - previous.y),
              z: previous.z + fraction * (current.z - previous.z),
              r: radiusLimit
            });
          }
        }
        return output;
      }

      bindEvents() {
        this.canvas.addEventListener("pointerdown", event => {
          if (event.button !== 0) return;
          this.dragging = true;
          this.lastPointer = { x: event.clientX, y: event.clientY };
          this.canvas.setPointerCapture(event.pointerId);
        });
        this.canvas.addEventListener("pointermove", event => {
          if (this.dragging) {
            const dx = event.clientX - this.lastPointer.x;
            const dy = event.clientY - this.lastPointer.y;
            this.lastPointer = { x: event.clientX, y: event.clientY };
            this.yaw -= dx * 0.007;
            this.pitch = clamp(this.pitch + dy * 0.007, -Math.PI / 2, Math.PI / 2);
            this.updateCameraBasis();
            this.draw();
            return;
          }
          const rect = this.canvas.getBoundingClientRect();
          this.hovered = this.distanceToProjectedPath(event.clientX - rect.left, event.clientY - rect.top) < 8;
          this.canvas.style.cursor = this.hovered ? "pointer" : "grab";
          this.draw();
        });
        const finishDrag = event => {
          this.dragging = false;
          if (event?.pointerId !== undefined && this.canvas.hasPointerCapture(event.pointerId)) {
            this.canvas.releasePointerCapture(event.pointerId);
          }
        };
        this.canvas.addEventListener("pointerup", finishDrag);
        this.canvas.addEventListener("pointercancel", finishDrag);
        this.canvas.addEventListener("pointerleave", () => {
          if (!this.dragging) {
            this.hovered = false;
            this.draw();
          }
        });
        this.canvas.addEventListener("wheel", event => {
          event.preventDefault();
          this.zoom = clamp(this.zoom * Math.exp(-event.deltaY * 0.0012), 0.25, 80);
          this.draw();
        }, { passive: false });
        this.canvas.addEventListener("dblclick", () => this.resetView());
      }

      layout() {
        const rect = this.canvas.getBoundingClientRect();
        const scaleValue = Math.min(rect.width, rect.height) / 32 * this.zoom;
        return { width: rect.width, height: rect.height, cx: rect.width / 2, cy: rect.height / 2, scale: scaleValue };
      }

      project(point, layout = this.layout()) {
        const viewX = dot(point, this.cameraRight);
        const viewY = dot(point, this.cameraUp);
        const viewDepth = dot(point, this.cameraDepth);
        return {
          x: layout.cx + viewX * layout.scale,
          y: layout.cy - viewY * layout.scale,
          depth: viewDepth
        };
      }

      cameraDirection() {
        return this.cameraDepth;
      }

      horizonAxes() {
        const spin = this.params?.spin || 0;
        const radius = this.result?.horizon || (1 + Math.sqrt(1 - spin * spin));
        return { equatorial: Math.sqrt(radius * radius + spin * spin), polar: radius };
      }

      occlusionGeometry() {
        const axes = this.horizonAxes();
        const direction = this.cameraDirection();
        const invA2 = 1 / (axes.equatorial * axes.equatorial);
        const invC2 = 1 / (axes.polar * axes.polar);
        const quadraticA = (direction[0] ** 2 + direction[1] ** 2) * invA2
