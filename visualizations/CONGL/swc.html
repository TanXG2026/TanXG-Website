          this.drawStarfield(cssWidth, cssHeight);
        }
      }

      drawMesh(mesh, color, lighting = 0) {
        if (!mesh) return;
        const gl = this.gl;
        gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vertexBuffer);
        gl.enableVertexAttribArray(this.positionLocation);
        gl.vertexAttribPointer(this.positionLocation, 3, gl.FLOAT, false, 0, 0);
        gl.uniform4fv(this.colorLocation, color);
        gl.uniform1f(this.lightingLocation, lighting);
        if (mesh.indexBuffer) {
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.indexBuffer);
          gl.drawElements(mesh.mode, mesh.count, gl.UNSIGNED_SHORT, 0);
        } else {
          gl.drawArrays(mesh.mode, 0, mesh.count);
        }
      }

      projectPoint(point, projection, view) {
        const viewPoint = transformVector4(view, [point[0], point[1], point[2], 1]);
        const clip = transformVector4(projection, viewPoint);
        if (!(clip[3] > 0)) return null;
        const x = clip[0] / clip[3];
        const y = clip[1] / clip[3];
        const z = clip[2] / clip[3];
        return {
          x: (x * 0.5 + 0.5) * this.overlayWidth,
          y: (0.5 - y * 0.5) * this.overlayHeight,
          viewDepth: viewPoint[2],
          visible: z >= -1 && z <= 1 && x >= -1.08 && x <= 1.08 && y >= -1.08 && y <= 1.08
        };
      }

      drawOverlayLabel(text, x, y, color = "#d9dee6") {
        const ctx = this.overlayContext;
        ctx.save();
        ctx.font = "12px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
        const width = ctx.measureText(text).width;
        const left = clamp(x, 4, this.overlayWidth - width - 10);
        const top = clamp(y, 4, this.overlayHeight - 20);
        ctx.fillStyle = "rgba(3,6,12,0.78)";
        ctx.fillRect(left - 3, top - 2, width + 6, 18);
        ctx.fillStyle = color;
        ctx.fillText(text, left, top + 11);
        ctx.restore();
      }

      drawArrow2D(start, end, color, label) {
        const ctx = this.overlayContext;
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const length = Math.hypot(dx, dy);
        if (length < 1) return;
        const ux = dx / length;
        const uy = dy / length;
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(end.x, end.y);
        ctx.lineTo(end.x - 7 * ux + 3.5 * uy, end.y - 7 * uy - 3.5 * ux);
        ctx.lineTo(end.x - 7 * ux - 3.5 * uy, end.y - 7 * uy + 3.5 * ux);
        ctx.closePath();
        ctx.fill();
        ctx.font = "600 12px ui-sans-serif, sans-serif";
        ctx.fillText(label, end.x + 5 * ux, end.y + 5 * uy);
        ctx.restore();
      }

      drawConfigurationOverlay(projection, view) {
        if (!this.configuration) return;
        const { basis, center, selected, inclination, distance } = this.configuration;
        const centerPoint = this.projectPoint(center, projection, view);
        if (!centerPoint?.visible) return;

        const ctx = this.overlayContext;
        const originPoint = this.projectPoint([0, 0, 0], projection, view);
        if (originPoint?.visible) {
          ctx.save();
          ctx.strokeStyle = "#757c84";
          ctx.lineWidth = 1.15;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(originPoint.x, originPoint.y);
          ctx.lineTo(centerPoint.x, centerPoint.y);
          ctx.stroke();
          ctx.setLineDash([]);
          const rayDx = originPoint.x - centerPoint.x;
          const rayDy = originPoint.y - centerPoint.y;
          const rayLength = Math.hypot(rayDx, rayDy);
          if (rayLength > 20) {
            const ux = rayDx / rayLength;
            const uy = rayDy / rayLength;
            const arrowX = centerPoint.x + 0.58 * rayDx;
            const arrowY = centerPoint.y + 0.58 * rayDy;
            ctx.fillStyle = "#757c84";
            ctx.beginPath();
            ctx.moveTo(arrowX + 6 * ux, arrowY + 6 * uy);
            ctx.lineTo(arrowX - 3 * ux + 4 * uy, arrowY - 3 * uy - 4 * ux);
            ctx.lineTo(arrowX - 3 * ux - 4 * uy, arrowY - 3 * uy + 4 * ux);
            ctx.closePath();
            ctx.fill();
          }
          ctx.fillStyle = "#000000";
          ctx.beginPath();
          ctx.arc(originPoint.x, originPoint.y, 3.2, 0, TWO_PI);
          ctx.fill();
          ctx.restore();
          this.drawOverlayLabel("BH / origin", originPoint.x + 7, originPoint.y + 7, "#d9dee6");
        }
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#33383e";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(centerPoint.x, centerPoint.y, 4, 0, TWO_PI);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
        this.drawOverlayLabel(
          `screen / observer · rₒ=${distance}M · θo=${inclination.toFixed(0)}°`,
          centerPoint.x - 230,
          centerPoint.y - 25
        );

        const drawBasis = (vector, label, color) => {
          const projected = this.projectPoint(vecAdd(center, vecScale(vector, 100)), projection, view);
          if (!projected) return;
          const dx = projected.x - centerPoint.x;
          const dy = projected.y - centerPoint.y;
          const length = Math.hypot(dx, dy);
          if (length < 2) return;
          this.drawArrow2D(centerPoint, {
            x: centerPoint.x + 48 * dx / length,
            y: centerPoint.y + 48 * dy / length
          }, color, label);
        };
        drawBasis(basis.alpha, "α / M", "#c7cdd5");
        drawBasis(basis.beta, "β / M", "#9da7b3");

        const selectedPoint = this.projectPoint(selected, projection, view);
        if (selectedPoint?.visible) {
          ctx.save();
          ctx.fillStyle = "#ffd24a";
          ctx.strokeStyle = "#e43b19";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(selectedPoint.x, selectedPoint.y, 3.5, 0, TWO_PI);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        const midpoint = this.projectPoint(vecScale(center, 0.54), projection, view);
        if (midpoint?.visible) this.drawOverlayLabel("past rays ∥ −er", midpoint.x - 42, midpoint.y + 10, "#adb5bf");
      }

      drawObserverGuide(projection, view) {
        if (!this.configuration) return;
        const sightDirection = this.configuration.basis.radial;
        const origin = this.projectPoint([0, 0, 0], projection, view);
        const directionProbe = this.projectPoint(vecScale(sightDirection, 16), projection, view);
        if (!origin || !directionProbe) return;
        const screenDx = directionProbe.x - origin.x;
        const screenDy = directionProbe.y - origin.y;
        const screenLength = Math.hypot(screenDx, screenDy);
        if (screenLength < 0.7) return;
        const ux = screenDx / screenLength;
        const uy = screenDy / screenLength;
        const horizonInfo = this.horizonScreenInfo(projection, view);
        const startDistance = (horizonInfo?.radius || 0) + 8;
        if (screenLength <= startDistance + 2) return;
        const ctx = this.overlayContext;
        ctx.save();
        ctx.strokeStyle = "rgba(190,198,208,0.34)";
        ctx.lineWidth = 0.9;
        ctx.setLineDash([6, 8]);
        ctx.beginPath();
        ctx.moveTo(origin.x + ux * startDistance, origin.y + uy * startDistance);
        ctx.lineTo(directionProbe.x, directionProbe.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        const pastBoundary = this.staticAnnotationsVisible()
          && this.configuration.pathStatus === "escape"
          && this.configuration.pastBoundary
          ? this.projectPoint(this.configuration.pastBoundary, projection, view)
          : null;
        if (pastBoundary?.visible) {
          ctx.save();
          ctx.fillStyle = "#fff5d6";
          ctx.strokeStyle = "#e25121";
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.arc(pastBoundary.x, pastBoundary.y, 3.5, 0, TWO_PI);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
          this.drawOverlayLabel(
            `过去无穷远数值边界 · r=${this.configuration.farPastRadius.toPrecision(5)}M`,
            pastBoundary.x + 8,
            pastBoundary.y - 20,
            "#d48a7b"
          );
        }
      }

      drawRadialTurnMarker(projection, view) {
        if (!this.radialTurnMarker) return;
        const marker = this.projectPoint(this.radialTurnMarker, projection, view);
        if (!marker?.visible) return;
        const ctx = this.overlayContext;
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#8f2f17";
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.arc(marker.x, marker.y, 3.5, 0, TWO_PI);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
        this.drawOverlayLabel("rmin · dr/dλ = 0", marker.x + 8, marker.y + 8, "#d48a7b");
      }

      drawTurnMarkers(projection, view) {
        if (!this.turnMarkers.length) return;
        const ctx = this.overlayContext;
        const visible = this.turnMarkers
          .map(marker => ({ marker, projected: this.projectPoint(marker.point, projection, view) }))
          .filter(entry => entry.projected?.visible);
        if (!visible.length) return;

        const centerX = visible.reduce((sum, entry) => sum + entry.projected.x, 0) / visible.length;
        const topY = Math.min(...visible.map(entry => entry.projected.y));
        const labelSpacing = 52;
        const totalWidth = labelSpacing * visible.length;
        const labelStartX = clamp(centerX - totalWidth / 2, 7, this.overlayWidth - totalWidth - 7);
        const labelY = Math.max(24, topY - 42);

        for (let index = 0; index < visible.length; index += 1) {
          const { marker, projected } = visible[index];
          const labelX = labelStartX + index * labelSpacing;
          ctx.save();
          ctx.fillStyle = "#fff5d6";
          ctx.strokeStyle = "#e25121";
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.arc(projected.x, projected.y, 3.5, 0, TWO_PI);
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = "rgba(226,81,33,0.55)";
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(projected.x, projected.y - 4);
          ctx.lineTo(labelX + 18, labelY + 17);
          ctx.stroke();
          ctx.restore();
          this.drawOverlayLabel(`orbit ${marker.turn}`, labelX, labelY, "#d48a7b");
        }
      }

      pointOnAnimatedRay(ray, progress) {
        const points = ray.points;
        const target = clamp(progress, 0, 1);
        let low = 0;
        let high = points.length - 1;
        while (high - low > 1) {
          const middle = Math.floor((low + high) / 2);
          if (points[middle].progress < target) low = middle; else high = middle;
        }
        const before = points[low];
        const after = points[high];
        const span = Math.max(1e-12, after.progress - before.progress);
        const fraction = clamp((target - before.progress) / span, 0, 1);
        return [
          before.world[0] + fraction * (after.world[0] - before.world[0]),
          before.world[1] + fraction * (after.world[1] - before.world[1]),
          before.world[2] + fraction * (after.world[2] - before.world[2])
        ];
      }

      smoothstep(edge0, edge1, value) {
        const x = clamp((value - edge0) / Math.max(1e-12, edge1 - edge0), 0, 1);
        return x * x * (3 - 2 * x);
      }

      horizonScreenInfo(projection, view) {
        const center = this.projectPoint([0, 0, 0], projection, view);
        if (!center) return null;
        const cameraRight = [view[0], view[4], view[8]];
        const cameraUp = [view[1], view[5], view[9]];
        const references = [cameraRight, cameraUp]
          .map(direction => this.projectPoint(vecScale(direction, HORIZON_RADIUS), projection, view))
          .filter(Boolean);
        const radius = Math.max(0, ...references.map(point => Math.hypot(
          point.x - center.x,
          point.y - center.y
        )));
        return { center, radius };
      }

      drawHorizonRim(projection, view) {
        const ctx = this.rimContext;
        ctx.clearRect(0, 0, this.overlayWidth, this.overlayHeight);
        const horizonInfo = this.horizonScreenInfo(projection, view);
        if (!horizonInfo?.center?.visible || !(horizonInfo.radius > 0)) return;
        ctx.save();
        ctx.strokeStyle = "rgba(142,44,38,0.98)";
        ctx.lineWidth = 2;
        ctx.shadowColor = "rgba(104,24,22,0.72)";
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(
          horizonInfo.center.x,
          horizonInfo.center.y,
          horizonInfo.radius + 1.55,
          0,
          TWO_PI
        );
        ctx.stroke();
        ctx.restore();
      }

      animationPointVisible(projected, horizonInfo) {
        if (!projected?.visible) return false;
        if (!horizonInfo || projected.viewDepth >= horizonInfo.center.viewDepth) return true;
        return Math.hypot(
          projected.x - horizonInfo.center.x,
          projected.y - horizonInfo.center.y
        ) > horizonInfo.radius;
      }

      drawAnimatedRays(now, projection, view) {
        if (this.visibleAnimationMode === "whole") return;
        if (!this.reduceMotion) {
          const previousLength = this.animatedRays.length;
          this.animatedRays = this.animatedRays.filter(ray => (
            ray.loop || now <= ray.startTime + ray.duration
          ));
          if (this.animatedRays.length !== previousLength) this.onRaySetChanged?.();
        }
        const rays = this.animatedRays.filter(ray => ray.mode === this.visibleAnimationMode);
        if (!rays.length) return;
        const ctx = this.overlayContext;
        const horizonInfo = this.horizonScreenInfo(projection, view);

        for (const ray of rays) {
          const sinceStart = now - ray.startTime;
          if (!this.reduceMotion && sinceStart < 0) continue;
          const cycle = ray.duration + ray.gap;
          const elapsed = this.reduceMotion
            ? 0.56 * ray.duration
            : ray.loop
              ? ((sinceStart % cycle) + cycle) % cycle
              : sinceStart;
          if (elapsed > ray.duration) continue;
          const timelineProgress = elapsed / ray.duration;
          const timelineStart = ray.timelineStart ?? ray.affineStart;
          const timelineEnd = ray.timelineEnd ?? ray.affineEnd;
          const timelineSpan = Math.max(1e-9, timelineEnd - timelineStart);
          const playbackProgress = this.playbackDirection === "forward"
            ? 1 - timelineProgress
            : timelineProgress;
          const targetAffine = timelineStart + playbackProgress * timelineSpan;
          const progress = (targetAffine - ray.affineStart) / ray.affineSpan;
          if (progress < 0 || progress > 1) continue;
          const fade = this.smoothstep(0, 0.08, timelineProgress)
            * (1 - this.smoothstep(0.90, 1, timelineProgress));
          if (fade <= 0.002) continue;

          const tailAffine = targetAffine + (this.playbackDirection === "forward" ? 1 : -1)
            * this.trailFraction * timelineSpan;
          const tailProgress = this.playbackDirection === "forward"
            ? clamp((tailAffine - ray.affineStart) / ray.affineSpan, progress, 1)
            : clamp((tailAffine - ray.affineStart) / ray.affineSpan, 0, progress);
          const segments = 64;
          let previousWorld = this.pointOnAnimatedRay(ray, tailProgress);
          let previousProjected = this.projectPoint(previousWorld, projection, view);
          for (let index = 1; index <= segments; index += 1) {
            const fraction = index / segments;
            const sampleProgress = tailProgress + fraction * (progress - tailProgress);
            const world = this.pointOnAnimatedRay(ray, sampleProgress);
            const projected = this.projectPoint(world, projection, view);
            if (this.animationPointVisible(previousProjected, horizonInfo)
              && this.animationPointVisible(projected, horizonInfo)) {
              const tailAlpha = fade * this.smoothstep(0.02, 1, fraction);
              let red;
              let green;
              let blue;
              if (fraction < 0.56) {
                const colorMix = fraction / 0.56;
                red = Math.round(224 + 25 * colorMix);
                green = Math.round(54 + 58 * colorMix);
                blue = Math.round(31 - 4 * colorMix);
              } else {
                const colorMix = (fraction - 0.56) / 0.44;
                red = Math.round(249 + 6 * colorMix);
                green = Math.round(112 + 84 * colorMix);
                blue = Math.round(27 + 28 * colorMix);
              }
              ctx.save();
              ctx.lineCap = "butt";
              ctx.lineJoin = "round";
              ctx.strokeStyle = `rgba(${red},${green},${blue},${0.96 * tailAlpha})`;
              ctx.lineWidth = 2.25;
              ctx.beginPath();
              ctx.moveTo(previousProjected.x, previousProjected.y);
              ctx.lineTo(projected.x, projected.y);
              ctx.stroke();
              ctx.restore();
            }
            previousWorld = world;
            previousProjected = projected;
          }

        }
      }

      drawOverlayFrame(now = performance.now()) {
        if (!this.lastProjection || !this.lastView) return;
        const animationNow = this.animationPaused && this.pauseStartedAt !== null
          ? this.pauseStartedAt
          : now;
        this.drawOverlay(this.lastProjection, this.lastView);
        this.drawAnimatedRays(animationNow, this.lastProjection, this.lastView);
      }

      ensureAnimationLoop() {
        if (this.animationPaused) return;
        if (this.reduceMotion) {
          this.drawOverlayFrame(performance.now());
          return;
        }
        if (this.animationFrameId !== null
          || !this.animatedRays.some(ray => ray.mode === this.visibleAnimationMode)) return;
        const tick = now => {
          this.animationFrameId = null;
          this.drawOverlayFrame(now);
          if (!this.animationPaused
            && this.animatedRays.some(ray => ray.mode === this.visibleAnimationMode)) {
            this.animationFrameId = requestAnimationFrame(tick);
          }
        };
        this.animationFrameId = requestAnimationFrame(tick);
      }

      drawOverlay(projection, view) {
        const ctx = this.overlayContext;
        ctx.clearRect(0, 0, this.overlayWidth, this.overlayHeight);
        this.drawHorizonRim(projection, view);

        if (this.distance < 200) {
          const axisLabels = [
            { point: [12, 0, 0], label: "+x", color: "#c1c7cf" },
            { point: [0, 12, 0], label: "+y", color: "#c1c7cf" },
            { point: [0, 0, 12], label: "+z", color: "#c1c7cf" }
          ];
          for (const axis of axisLabels) {
            const projected = this.projectPoint(axis.point, projection, view);
            if (projected?.visible) this.drawOverlayLabel(axis.label, projected.x + 4, projected.y - 8, axis.color);
          }
        }
        this.drawObserverGuide(projection, view);
        if (this.staticAnnotationsVisible()) {
          this.drawRadialTurnMarker(projection, view);
          this.drawTurnMarkers(projection, view);
        }
      }

      render() {
        const gl = this.gl;
        if (!gl) return;
        this.resize();
        const aspect = this.canvas.width / this.canvas.height;
        const cosPitch = Math.cos(this.pitch);
        const eye = [
          this.distance * cosPitch * Math.cos(this.yaw),
          this.distance * cosPitch * Math.sin(this.yaw),
          this.distance * Math.sin(this.pitch)
        ];
        const farPlane = Math.max(10000, this.distance * 5, (this.configuration?.distance || 0) * 4);
        const halfHeight = this.distance * Math.tan(Math.PI / 8);
        const halfWidth = halfHeight * aspect;
        const projection = orthographicMatrix(
          -halfWidth,
          halfWidth,
          -halfHeight,
          halfHeight,
          0.04,
          farPlane
        );
        const cameraUp = [
          -Math.sin(this.pitch) * Math.cos(this.yaw),
          -Math.sin(this.pitch) * Math.sin(this.yaw),
          Math.cos(this.pitch)
        ];
        const view = lookAtMatrix(eye, [0, 0, 0], cameraUp);
        this.lastProjection = projection;
        this.lastView = view;

        gl.viewport(0, 0, this.canvas.width, this.canvas.height);
        gl.clearColor(0, 0, 0, 0);
        gl.clearDepth(1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.useProgram(this.program);
        gl.uniformMatrix4fv(this.projectionLocation, false, projection);
        gl.uniformMatrix4fv(this.viewLocation, false, view);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.disable(gl.CULL_FACE);

        gl.disable(gl.BLEND);
        gl.depthMask(false);
        const axisColor = [0.72, 0.75, 0.79, 0.58];
        this.drawMesh(this.axes.x, axisColor);
        this.drawMesh(this.axes.y, axisColor);
        this.drawMesh(this.axes.z, axisColor);

        gl.depthMask(true);
        this.drawMesh(this.sphere, [0, 0, 0, 1], 1);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.depthMask(false);
        this.drawMesh(this.pathLineMesh, [0.96, 0.22, 0.03, 0.92]);
        for (const layer of this.pathMeshes) this.drawMesh(layer.mesh, layer.color);
        gl.depthMask(true);
        gl.disable(gl.BLEND);
        this.drawOverlayFrame(performance.now());
        this.ensureAnimationLoop();
      }
    }

    function drawOrbit() {
      if (!orbitRenderer) {
        try {
          orbitRenderer = new OrbitRenderer3D(
            ui.orbitCanvas,
            ui.orbitOverlay,
            ui.starCanvas,
            ui.rimCanvas,
            ui.orbitWrap
          );
          orbitRenderer.onRaySetChanged = updateSingleRayCount;
          orbitRenderer.playbackDirection = ui.playbackDirection.value;
        } catch (error) {
          ui.orbitWrap.innerHTML = `<div style="padding:48px;color:#b42318">${error.message}</div>`;
          return;
        }
      }
      const params = modelParameters();
      if (activeTraceMode !== "whole") {
        orbitRenderer.setAnimationMode(activeTraceMode, params);
        return;
      }
      orbitRenderer.setPath(
        currentResult?.points || [],
        params.u,
        params.v,
        params.inclination,
        params.distance,
        Number(ui.turnCount.value) || 0,
        currentResult?.status || ""
      );
      if (ui.turnCount.value) orbitRenderer.resetView();
    }

    function windingTurns(result) {
      if (result?.status !== "escape" || !result.finalState) return null;
      return result.deflection / TWO_PI;
    }

    function sourceAxisOrder(result) {
      if (result?.status !== "escape" || !Number.isFinite(result.phiInfinity)) return null;
      return (result.phiInfinity - Math.PI) / TWO_PI;
    }

    const floatNeighborBuffer = new ArrayBuffer(8);
    const floatNeighborView = new DataView(floatNeighborBuffer);

    function adjacentPositiveFloat(value, direction) {
      floatNeighborView.setFloat64(0, value, false);
      const bits = floatNeighborView.getBigUint64(0, false);
      floatNeighborView.setBigUint64(0, bits + (direction > 0 ? 1n : -1n), false);
      return floatNeighborView.getFloat64(0, false);
    }

    function solveImpactForTurns(distance, targetTurns) {
      const cacheKey = `${distance.toPrecision(14)}:${targetTurns}`;
      if (turnPresetCache.has(cacheKey)) return turnPresetCache.get(cacheKey);

      const critical = criticalScreenImpact(distance);
      const evaluateImpact = impact => {
        const phiInfinity = asymptoticAzimuthFromObserver(distance, impact, METRIC_MASS);
        const turns = Number.isFinite(phiInfinity)
          ? (phiInfinity - Math.PI) / TWO_PI
          : Number.POSITIVE_INFINITY;
        return { impact, turns };
      };
      const evaluateDelta = delta => evaluateImpact(critical * (1 + delta));

      const strongDeflectionConstant = Math.log(216 * (7 - 4 * Math.sqrt(3))) - Math.PI;
      const estimatedDelta = Math.exp(strongDeflectionConstant - TWO_PI * targetTurns);
      let lowerDelta = Math.max(4 * Number.EPSILON, estimatedDelta / 20);
      let upperDelta = Math.min(0.5, estimatedDelta * 20);
      let lowerEvaluation = evaluateDelta(lowerDelta);
      let upperEvaluation = evaluateDelta(upperDelta);
      for (let expansion = 0; expansion < 8 && lowerEvaluation.turns < targetTurns; expansion += 1) {
        lowerDelta = Math.max(4 * Number.EPSILON, lowerDelta / 4);
        lowerEvaluation = evaluateDelta(lowerDelta);
      }
      for (let expansion = 0; expansion < 8 && upperEvaluation.turns >= targetTurns; expansion += 1) {
        upperDelta = Math.min(1, upperDelta * 4);
        upperEvaluation = evaluateDelta(upperDelta);
      }

      let best = [lowerEvaluation, upperEvaluation]
        .filter(evaluation => Number.isFinite(evaluation.turns))
        .sort((a, b) => Math.abs(a.turns - targetTurns) - Math.abs(b.turns - targetTurns))[0] || null;
      const bisectionIterations = targetTurns >= 4 ? 24 : 20;
      for (let iteration = 0; iteration < bisectionIterations; iteration += 1) {
        const middleDelta = Math.sqrt(lowerDelta * upperDelta);
        const evaluation = evaluateDelta(middleDelta);
        if (Number.isFinite(evaluation.turns)
          && (!best || Math.abs(evaluation.turns - targetTurns) < Math.abs(best.turns - targetTurns))) {
          best = evaluation;
        }
        if (evaluation.turns >= targetTurns) {
          lowerDelta = middleDelta;
        } else {
          upperDelta = middleDelta;
        }
      }

      if (best) {
        let below = best.impact;
        let above = best.impact;
        const neighborRadius = targetTurns >= 5 ? 6 : targetTurns === 4 ? 3 : 1;
        for (let offset = 0; offset < neighborRadius; offset += 1) {
          below = adjacentPositiveFloat(below, -1);
          above = adjacentPositiveFloat(above, 1);
          for (const candidateImpact of [below, above]) {
            if (!(candidateImpact > critical)) continue;
            const evaluation = evaluateImpact(candidateImpact);
            if (Number.isFinite(evaluation.turns)
              && Math.abs(evaluation.turns - targetTurns) < Math.abs(best.turns - targetTurns)) {
              best = evaluation;
            }
          }
        }
      }

      const solved = best || upperEvaluation;
      turnPresetCache.set(cacheKey, solved);
      return solved;
    }

    function scheduleTurnPreset(delay = 0) {
      if (turnSolveTimer !== null) clearTimeout(turnSolveTimer);
      const targetTurns = Number(ui.turnCount.value);
      if (!(targetTurns >= 1 && targetTurns <= 5)) return;
      ui.turnResult.textContent = `正在求解轴后方无穷远源的 n=${targetTurns} 光线…`;
      turnSolveTimer = setTimeout(() => {
        turnSolveTimer = null;
        const distance = clamp(
          finiteNumber(ui.observerRadius, DEFAULT_OBSERVER_DISTANCE),
          20,
          100000
        );
        const solved = solveImpactForTurns(distance, targetTurns);
        syncCoordinateInputs(solved.impact, 0);
        runTrace();
        focusScreenOnSelected();
      }, delay);
    }

    const digitCaretPositions = new Map();

    function rememberDigitCaret(input) {
      if (Number.isInteger(input.selectionStart)) digitCaretPositions.set(input, input.selectionStart);
    }

    function digitStepAtCaret(input) {
      const text = input.value;
      let caret = digitCaretPositions.get(input);
      if (!Number.isInteger(caret)) {
        const decimal = text.indexOf(".");
        caret = decimal >= 0 ? decimal + 3 : text.length;
      }
      caret = clamp(caret, 0, text.length);

      let digitIndex = caret > 0 && /\d/.test(text[caret - 1]) ? caret - 1 : caret;
      while (digitIndex < text.length && !/\d/.test(text[digitIndex])) digitIndex += 1;
      if (digitIndex >= text.length) {
        digitIndex = Math.max(0, caret - 1);
        while (digitIndex > 0 && !/\d/.test(text[digitIndex])) digitIndex -= 1;
      }

      const decimalIndex = text.indexOf(".") >= 0 ? text.indexOf(".") : text.length;
      const exponent = digitIndex < decimalIndex
        ? decimalIndex - digitIndex - 1
        : decimalIndex - digitIndex;
      return Math.pow(10, exponent);
    }

    function formatDigitStep(step) {
      if (step >= 1) return step.toFixed(0);
      const decimals = Math.max(0, Math.round(-Math.log10(step)));
      return step.toFixed(decimals);
    }

    function updateDigitStepDisplay(input) {
      const display = input.closest(".mode-body")?.querySelector("[data-digit-step-display]")
        || ui.digitStepDisplay;
      display.textContent = formatDigitStep(digitStepAtCaret(input));
    }

    function markPixelCustom() {
      ui.turnCount.value = "";
    }

    function normalizePolarDegrees(value) {
      if (!Number.isFinite(value)) return 0;
      const normalized = value >= -180 && value < 180
        ? value
        : ((value + 180) % 360 + 360) % 360 - 180;
      return Math.abs(normalized) < Number.EPSILON ? 0 : normalized;
    }

    function polarRadiusLimit(phi) {
      const largestComponent = Math.max(
        Math.abs(Math.cos(phi)),
        Math.abs(Math.sin(phi)),
        1e-15
      );
      return Math.min(POLAR_MAX, SCREEN_EXTENT / largestComponent);
    }

    function coordinateInput(mode, component) {
      return ui.coordinateInputs.find(input => (
        input.dataset.coordinateMode === mode
        && input.dataset.coordinateComponent === component
      ));
    }

    function coordinateSystemForMode(mode) {
      return ui.coordinateSystemControls.find(control => (
        control.dataset.coordinateMode === mode
      ))?.value || "cartesian";
    }

    function fixedTextFromInput(rawText, normalizedValue) {
      const value = Object.is(normalizedValue, -0) ? 0 : normalizedValue;
      const text = String(rawText ?? "").trim();
      const match = text.match(/^([+-]?)(\d*)(?:\.(\d*))?$/);
      if (match && (match[2] || match[3]) && Number(text) === value) {
        const sign = value < 0 ? "-" : "";
        const integer = (match[2] || "0").replace(/^0+(?=\d)/, "") || "0";
        const fraction = match[3] || "";
        if (fraction.length <= DISPLAY_DECIMALS) {
          return `${sign}${integer}.${fraction.padEnd(DISPLAY_DECIMALS, "0")}`;
        }
      }
      return value.toFixed(DISPLAY_DECIMALS);
    }

    function decimalTextToScaledInteger(text) {
      const match = String(text).trim().match(/^([+-]?)(\d*)(?:\.(\d*))?$/);
      if (!match || (!match[2] && !match[3])) return null;
      const fraction = match[3] || "";
      if (fraction.length > DISPLAY_DECIMALS) return null;
      const scale = 10n ** BigInt(DISPLAY_DECIMALS);
      const integerPart = BigInt(match[2] || "0") * scale;
      const fractionPart = BigInt((fraction || "0").padEnd(DISPLAY_DECIMALS, "0"));
      const magnitude = integerPart + fractionPart;
      return match[1] === "-" ? -magnitude : magnitude;
    }

    function scaledIntegerToFixedText(value) {
      const scale = 10n ** BigInt(DISPLAY_DECIMALS);
      const sign = value < 0n ? "-" : "";
      const magnitude = value < 0n ? -value : value;
      const integer = magnitude / scale;
      const fraction = String(magnitude % scale).padStart(DISPLAY_DECIMALS, "0");
      return `${sign}${integer}.${fraction}`;
    }

    function exactDigitStep(text, step, direction) {
      const scaledValue = decimalTextToScaledInteger(text);
      if (scaledValue === null) return null;
      const exponent = Math.round(Math.log10(step));
      const scaledExponent = DISPLAY_DECIMALS + exponent;
      if (scaledExponent < 0) return null;
      const scaledStep = 10n ** BigInt(scaledExponent);
      return scaledIntegerToFixedText(scaledValue + BigInt(direction) * scaledStep);
    }

    function coordinatesFromMode(mode) {
      const current = modelParameters();
      if (coordinateSystemForMode(mode) === "polar") {
        const rhoInput = coordinateInput(mode, "rho");
        const phiInput = coordinateInput(mode, "phi");
        const phiDegrees = finiteNumber(
          phiInput,
          Math.atan2(current.v, current.u) * 180 / Math.PI
        );
        const phi = phiDegrees * Math.PI / 180;
        const rho = clamp(
          finiteNumber(rhoInput, Math.hypot(current.u, current.v)),
          0,
          polarRadiusLimit(phi)
        );
        polarAngle = phiDegrees;
        return {
          u: rho * Math.cos(phi),
          v: rho * Math.sin(phi),
          textOverride: {
            rho: fixedTextFromInput(rhoInput?.value, rho),
            phi: fixedTextFromInput(phiInput?.value, phiDegrees)
          }
        };
      }
      const alphaInput = coordinateInput(mode, "alpha");
      const betaInput = coordinateInput(mode, "beta");
      const u = clamp(finiteNumber(alphaInput, current.u), -SCREEN_EXTENT, SCREEN_EXTENT);
      const v = clamp(finiteNumber(betaInput, current.v), -SCREEN_EXTENT, SCREEN_EXTENT);
      return {
        u,
        v,
        textOverride: {
          alpha: fixedTextFromInput(alphaInput?.value, u),
          beta: fixedTextFromInput(betaInput?.value, v)
        }
      };
    }

    function syncCoordinateInputs(u, v, textOverride = {}) {
      const safeU = clamp(u, -SCREEN_EXTENT, SCREEN_EXTENT);
      const safeV = clamp(v, -SCREEN_EXTENT, SCREEN_EXTENT);
      const rho = Math.hypot(safeU, safeV);
      if (textOverride.phi !== undefined && Number.isFinite(Number(textOverride.phi))) {
        polarAngle = Number(textOverride.phi);
      } else if (rho > 1e-15) {
        polarAngle = normalizePolarDegrees(Math.atan2(safeV, safeU) * 180 / Math.PI);
      }
      const values = {
        alpha: safeU,
        beta: safeV,
        rho,
        phi: polarAngle
      };
      for (const input of ui.coordinateInputs) {
        const component = input.dataset.coordinateComponent;
        input.value = textOverride[component]
          ?? values[component].toFixed(DISPLAY_DECIMALS);
      }
    }

    function setCoordinatesFromMode(mode) {
      const { u, v, textOverride } = coordinatesFromMode(mode);
      syncCoordinateInputs(u, v, textOverride);
      markPixelCustom();
      return { u, v };
    }

    function commitCoordinateInput(input) {
      const mode = input.dataset.coordinateMode;
      const { u, v, textOverride } = coordinatesFromMode(mode);
      syncCoordinateInputs(u, v, textOverride);
      markPixelCustom();
      queueTrace();
    }

    function applyDigitStep(input, direction) {
      rememberDigitCaret(input);
      const caret = digitCaretPositions.get(input) ?? input.value.length;
      const step = digitStepAtCaret(input);
      const exactNext = exactDigitStep(input.value, step, direction);
      if (exactNext !== null) {
        input.value = exactNext;
      } else {
        input.value = (finiteNumber(input, 0) + direction * step).toFixed(DISPLAY_DECIMALS);
      }
      commitCoordinateInput(input);
      input.focus({ preventScroll: true });
      const restored = clamp(caret, 0, input.value.length);
      input.setSelectionRange(restored, restored);
      digitCaretPositions.set(input, restored);
      updateDigitStepDisplay(input);
    }

    function updateCoordinateSystem(mode) {
      const system = coordinateSystemForMode(mode);
      for (const group of ui.coordinateFieldGroups) {
        if (group.dataset.coordinateMode === mode) {
          group.hidden = group.dataset.coordinateFields !== system;
        }
      }
      const firstVisibleInput = coordinateInput(
        mode,
        system === "polar" ? "rho" : "alpha"
      );
      if (firstVisibleInput) updateDigitStepDisplay(firstVisibleInput);
    }

    function setTrailLength(percent) {
      const normalizedPercent = clamp(Number(percent) || 18, 4, 45);
      trailFraction = normalizedPercent / 100;
      for (const control of ui.trailLengthControls) control.value = String(normalizedPercent);
      for (const display of ui.trailLengthDisplays) display.textContent = `${normalizedPercent.toFixed(0)}%`;
      orbitRenderer?.setTrailFraction(trailFraction);
    }

    function updatePlaybackDirection() {
      const direction = ui.playbackDirection.value === "forward" ? "forward" : "reverse";
      ui.startMultiRays.textContent = direction === "forward"
        ? "开始同步正向追踪"
        : "开始同步反向追踪";
      orbitRenderer?.setPlaybackDirection(direction);
    }

    function updateAnimationPauseButton() {
      const paused = orbitRenderer?.animationPaused || false;
      ui.animationPause.textContent = paused ? "继续" : "暂停";
      ui.animationPause.setAttribute("aria-pressed", String(paused));
      ui.animationPause.setAttribute("aria-label", paused ? "继续所有动画" : "暂停所有动画");
    }

    function toggleAnimationPause() {
      if (!orbitRenderer) return;
      orbitRenderer.setAnimationPaused(!orbitRenderer.animationPaused);
      updateAnimationPauseButton();
    }

    function updateDiagnostics(result, params) {
      const horizonKm = 2 * RG_SUN_KM * params.mass;
      ui.horizonRadius.textContent = horizonKm < 1e6
        ? `${horizonKm.toLocaleString("zh-CN", { maximumFractionDigits: 3 })} km`
        : `${horizonKm.toExponential(4)} km`;
      ui.criticalImpact.textContent = `${PHOTON_SPHERE_RADIUS}M / ${CRITICAL_IMPACT.toFixed(5)}M`;
      ui.screenCritical.textContent = criticalScreenImpact(params.distance).toFixed(DISPLAY_DECIMALS);

      const actualTurns = windingTurns(result);
      const axisOrder = sourceAxisOrder(result);
      const targetTurns = Number(ui.turnCount.value);
      ui.turnResult.textContent = Number.isFinite(actualTurns)
        ? targetTurns && Number.isFinite(axisOrder)
          ? `总偏折 / 2π：${actualTurns.toFixed(8)} · 轴后方源阶数：${axisOrder.toFixed(8)}（目标 ${targetTurns}）`
          : `总偏折 / 2π：${actualTurns.toFixed(8)}`
        : "总偏折 / 2π：—";
    }

    function runTrace() {
      traceQueued = false;
      const params = modelParameters();
      ui.mass.value = String(params.mass);
      ui.inclination.value = String(params.inclination);
      ui.observerRadius.value = String(params.distance);

      currentResult = integrateRay({
        metricMass: METRIC_MASS,
        distance: params.distance,
        impact: params.impact,
        rtol: ui.turnCount.value ? 3e-12 : 1e-10
      });

      updateDiagnostics(currentResult, params);
      drawScreen();
      drawOrbit();
    }

    function csvNumber(value) {
      return Number.isFinite(value) ? Number(value).toPrecision(17) : "";
    }

    function downloadGeodesicData() {
      runTrace();
      if (!currentResult?.points?.length) return;

      const params = modelParameters();
      const basis = observerBasis(params.inclination);
      const screenOffset = vecAdd(
        vecScale(basis.alpha, params.u),
        vecScale(basis.beta, params.v)
      );
      const transverse = params.impact > 1e-12 ? vecNormalize(screenOffset) : basis.alpha;
      const rows = [
        "# CONGL Schwarzschild null geodesic",
        "# units,G=c=M=1",
        `# status,${currentResult.status}`,
        `# mass_solar,${csvNumber(params.mass)}`,
        `# observer_inclination_deg,${csvNumber(params.inclination)}`,
        `# observer_radius_over_M,${csvNumber(params.distance)}`,
        `# alpha_over_M,${csvNumber(params.u)}`,
        `# beta_over_M,${csvNumber(params.v)}`,
        `# impact_screen_over_M,${csvNumber(params.impact)}`,
        `# conserved_abs_E,${csvNumber(currentResult.pT)}`,
        `# conserved_L_over_M,${csvNumber(currentResult.pPhi)}`,
        `# minimum_radius_over_M,${csvNumber(currentResult.minR)}`,
        `# far_past_radius_over_M,${csvNumber(currentResult.farPastRadius)}`,
        "index,lambda_over_M,r_over_M,phi_deg,orbital_x_over_M,orbital_y_over_M,x_over_M,y_over_M,z_over_M"
      ];

      currentResult.points.forEach((point, index) => {
        const world = vecAdd(
          vecScale(basis.radial, point.x),
          vecScale(transverse, point.y)
        );
        rows.push([
          index,
          csvNumber(point.affine),
          csvNumber(point.r),
          csvNumber(point.phi * 180 / Math.PI),
          csvNumber(point.x),
          csvNumber(point.y),
          csvNumber(world[0]),
          csvNumber(world[1]),
          csvNumber(world[2])
        ].join(","));
      });

      const blob = new Blob(["\ufeff", rows.join("\n"), "\n"], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const token = value => value.toFixed(6).replace("-", "m").replace(".", "p");
      link.href = url;
      link.download = `congl-schwarzschild-alpha-${token(params.u)}-beta-${token(params.v)}.csv`;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function updateSingleRayCount() {
      const count = orbitRenderer?.animatedRayCount("single") || 0;
      ui.singleRayCount.textContent = `${count} 条`;
    }

    function removeMultiSelectedPoint(index) {
      if (index < 0 || index >= multiSelectedPoints.length) return;
      const [removed] = multiSelectedPoints.splice(index, 1);
      if (removed?.animationRayId) {
        orbitRenderer?.removeAnimatedRay(removed.animationRayId);
        if (orbitRenderer?.animatedRayCount("multi")) {
          orbitRenderer.synchronizeAnimatedGroup("multi", performance.now() + 140);
        }
      }
      renderMultiPointList();
      drawScreen();
    }

    function renderMultiPointList() {
      ui.multiPointCount.textContent = `${multiSelectedPoints.length} 个`;
      const fragment = document.createDocumentFragment();
      multiSelectedPoints.forEach((point, index) => {
        const item = document.createElement("li");
        const number = document.createElement("span");
        number.textContent = `#${index + 1}`;
        const coordinates = document.createElement("span");
        coordinates.className = "point-list-coordinates";
        coordinates.textContent = `α=${point.u.toFixed(8)}  β=${point.v.toFixed(8)}`;
        const removeButton = document.createElement("button");
        removeButton.className = "point-delete-button";
        removeButton.type = "button";
        removeButton.textContent = "删除";
        removeButton.setAttribute("aria-label", `删除第 ${index + 1} 根光线`);
        removeButton.addEventListener("click", () => removeMultiSelectedPoint(index));
        item.append(number, coordinates, removeButton);
        fragment.append(item);
      });
      ui.multiPointList.replaceChildren(fragment);
      ui.startMultiRays.disabled = multiSelectedPoints.length === 0;
      ui.clearMultiPoints.disabled = multiSelectedPoints.length === 0;
    }

    function setActiveTraceMode(mode) {
      activeTraceMode = mode;
      ui.playbackControl.hidden = mode === "whole";
      const params = modelParameters();
      if (orbitRenderer) {
        if (mode === "whole") drawOrbit();
        else orbitRenderer.setAnimationMode(mode, params);
      } else {
        drawOrbit();
      }
      drawScreen();
      updateSingleRayCount();
      renderMultiPointList();
      updateAnimationPauseButton();
    }

    function traceForParams(params, rtol = 1e-10) {
      return integrateRay({
        metricMass: METRIC_MASS,
        distance: params.distance,
        impact: params.impact,
        rtol
      });
    }

    function addSingleAnimatedRay() {
      const params = modelParameters();
      currentResult = traceForParams(params);
      updateDiagnostics(currentResult, params);
      drawScreen();
      drawOrbit();
      orbitRenderer?.addAnimatedRay(currentResult, params, "single", performance.now());
      updateSingleRayCount();
    }

    function addMultiSelectedPoint() {
      const params = modelParameters();
      multiSelectedPoints.push({ u: params.u, v: params.v, animationRayId: null });
      renderMultiPointList();
      drawScreen();
    }

    function startMultiAnimatedRays() {
      if (!multiSelectedPoints.length) return;
      const base = modelParameters();
      drawOrbit();
      orbitRenderer?.clearAnimatedRays("multi");
      for (const point of multiSelectedPoints) point.animationRayId = null;
      let latest = null;
      let latestParams = null;
      for (const point of multiSelectedPoints) {
        const params = {
          ...base,
          u: point.u,
          v: point.v,
          impact: Math.hypot(point.u, point.v)
        };
        const result = traceForParams(params);
        // Defer playback until every selected geodesic has been integrated.
        point.animationRayId = orbitRenderer?.addAnimatedRay(
          result,
          params,
          "multi",
          Number.POSITIVE_INFINITY
        ) ?? null;
        latest = result;
        latestParams = params;
      }
      orbitRenderer?.synchronizeAnimatedGroup("multi", performance.now() + 140);
      if (latest && latestParams) {
        currentResult = latest;
        updateDiagnostics(latest, latestParams);
      }
      orbitRenderer?.resetView();
    }

    function queueTrace() {
      if (traceQueued) return;
      traceQueued = true;
      requestAnimationFrame(runTrace);
    }

    function setPixelFromPointer(event, shouldTrace = true) {
      const raw = screenCoordinatesFromPointer(event);
      const pixelWidth = 2 * screenView.halfExtent / SCREEN_PIXELS;
      const minU = screenView.centerU - screenView.halfExtent;
      const maxV = screenView.centerV + screenView.halfExtent;
      const i = clamp(Math.floor((raw.u - minU) / pixelWidth), 0, SCREEN_PIXELS - 1);
      const j = clamp(Math.floor((maxV - raw.v) / pixelWidth), 0, SCREEN_PIXELS - 1);
      const u = minU + (i + 0.5) * pixelWidth;
      const v = maxV - (j + 0.5) * pixelWidth;
      syncCoordinateInputs(u, v);
      markPixelCustom();
      if (shouldTrace) queueTrace();
      else drawScreen();
      return { u, v };
    }

    function refreshScreenOnly() {
      drawScreen();
      if (currentResult) updateDiagnostics(currentResult, modelParameters());
    }

    function focusScreenOnSelected() {
      const params = modelParameters();
      const critical = criticalScreenImpact(params.distance);
      const radialGap = Math.abs(params.impact - critical);
      screenView.centerU = params.u;
      screenView.centerV = params.v;
      screenView.halfExtent = clamp(Math.max(12 * radialGap, 1e-12), 1e-13, SCREEN_EXTENT);
      constrainScreenView();
      refreshScreenOnly();
    }

    function runSelfTests() {
      const tests = [];

      const flatEscape = integrateRay({ metricMass: 0, distance: 30, impact: 1.5, rtol: 2e-10 });
      const flatExpectedMin = 30 * 1.5 / Math.hypot(30, 1.5);
      tests.push(flatEscape.status === "escape"
        && Math.abs(flatEscape.minR - flatExpectedMin) < 2e-7
        && Math.abs(flatEscape.deflection) < 2e-8
        && Math.abs(flatEscape.phiInfinity - flatEscape.initialDirectionAngle) < 2e-8);

      const radialCapture = integrateRay({ metricMass: 1, distance: 50, impact: 0, rtol: 2e-10 });
      tests.push(radialCapture.status === "captured"
        && Math.abs(radialCapture.minR - 2) < 1e-12
        && radialCapture.initialCoordinateTimeDirection < 0
        && radialCapture.maxConstraint < 2e-8);

      const weak = integrateRay({ metricMass: 1, distance: 1000, impact: 100, rtol: 2e-10 });
      const inverseImpact = 1 / weak.impactInfinity;
      const weakPrediction = 4 * inverseImpact + 15 * Math.PI * inverseImpact * inverseImpact / 4;
      const weakRelativeError = Math.abs(Math.abs(weak.deflection) - weakPrediction) / weakPrediction;
      tests.push(weak.status === "escape"
        && weakRelativeError < 0.03
        && weak.maxConstraint < 2e-8
        && weak.minR > 3
        && Math.abs(weak.phiInfinity - weak.phiInfinityNumerical) < 2e-6);

      tests.push(weak.points.length > 2
        && weak.points[0].affine === 0
        && weak.points[weak.points.length - 1].affine > 0
        && weak.points.every((point, index, points) => index === 0 || point.affine >= points[index - 1].affine));

      const criticalDistance = 100;
      const screenCritical = criticalScreenImpact(criticalDistance);
      const inside = integrateRay({
        metricMass: 1,
        distance: criticalDistance,
        impact: screenCritical * (1 - 5e-5)
      });
      const outside = integrateRay({
        metricMass: 1,
        distance: criticalDistance,
        impact: screenCritical * (1 + 5e-5)
      });
      tests.push(inside.status === "captured"
        && outside.status === "escape"
        && inside.minR === 2
        && outside.minR > 3);

      const geometryBasis = observerBasis(37);
      const handedness = vecCross(geometryBasis.alpha, geometryBasis.beta);
      const geometryU = 4.2;
      const geometryV = -1.7;
      const directionScale = Math.hypot(DEFAULT_OBSERVER_DISTANCE, geometryU, geometryV);
      const pixelDirection = vecNormalize(vecAdd(
        vecScale(geometryBasis.radial, -DEFAULT_OBSERVER_DISTANCE),
        vecAdd(
          vecScale(geometryBasis.alpha, geometryU),
          vecScale(geometryBasis.beta, geometryV)
        )
      ));
      const commonOriginA = integrateRay({ metricMass: 1, distance: 80, impact: 7 }).points[0];
      const commonOriginB = integrateRay({ metricMass: 1, distance: 80, impact: 9 }).points[0];
      tests.push(
        Math.hypot(...vecSubtract(handedness, geometryBasis.radial)) < 1e-13
        && Math.abs(vecDot(geometryBasis.alpha, geometryBasis.beta)) < 1e-13
        && Math.abs(vecDot(geometryBasis.alpha, geometryBasis.radial)) < 1e-13
        && Math.abs(vecDot(pixelDirection, geometryBasis.radial) + DEFAULT_OBSERVER_DISTANCE / directionScale) < 1e-13
        && Math.abs(vecDot(pixelDirection, geometryBasis.alpha) - geometryU / directionScale) < 1e-13
        && Math.abs(vecDot(pixelDirection, geometryBasis.beta) - geometryV / directionScale) < 1e-13
        && Math.abs(commonOriginA.x - 80) < 1e-13
        && Math.abs(commonOriginA.y) < 1e-13
        && Math.abs(commonOriginB.x - commonOriginA.x) < 1e-13
        && Math.abs(commonOriginB.y - commonOriginA.y) < 1e-13
      );

      tests.push(outside.finalState[0] === outside.farPastRadius
        && outside.farPastRadius > criticalDistance
        && Math.hypot(
          outside.points[outside.points.length - 1].x - outside.points[0].x,
          outside.points[outside.points.length - 1].y - outside.points[0].y
        ) > 0.5 * outside.farPastRadius);

      const alignedOne = solveImpactForTurns(100, 1);
      tests.push(Number.isFinite(alignedOne.turns)
        && Math.abs(alignedOne.turns - 1) < 5e-6);

      const passed = tests.filter(Boolean).length;
      ui.selfTest.textContent = `数值自检：${passed}/${tests.length} ${passed === tests.length ? "通过" : "失败"}`;
      ui.selfTest.style.color = passed === tests.length ? "#16794a" : "#b42318";
      return {
        passed,
        total: tests.length,
        flatEscape,
        radialCapture,
        weak,
        weakRelativeError,
        inside,
        outside,
        geometryBasis,
        handedness,
        commonOriginA,
        commonOriginB,
        alignedOne
      };
    }

    ui.downloadGeodesic.addEventListener("click", downloadGeodesicData);
    ui.turnCount.addEventListener("change", () => scheduleTurnPreset(0));
    ui.addSingleByInput.addEventListener("click", () => {
      setCoordinatesFromMode("single");
      addSingleAnimatedRay();
    });
    ui.clearSingleRays.addEventListener("click", () => {
      orbitRenderer?.clearAnimatedRays("single");
      updateSingleRayCount();
    });
    ui.addMultiByInput.addEventListener("click", () => {
      setCoordinatesFromMode("multi");
      addMultiSelectedPoint();
    });
    ui.clearMultiPoints.addEventListener("click", () => {
      multiSelectedPoints.length = 0;
      orbitRenderer?.clearAnimatedRays("multi");
      renderMultiPointList();
      drawScreen();
    });
    ui.startMultiRays.addEventListener("click", startMultiAnimatedRays);
    ui.playbackDirection.addEventListener("change", updatePlaybackDirection);
    ui.animationPause.addEventListener("click", toggleAnimationPause);

    for (const control of ui.coordinateSystemControls) {
      control.addEventListener("change", () => updateCoordinateSystem(control.dataset.coordinateMode));
    }

    for (const control of ui.trailLengthControls) {
      control.addEventListener("input", () => setTrailLength(control.value));
    }

    let modeToggleInProgress = false;
    for (const panel of ui.traceModes) {
      panel.addEventListener("toggle", () => {
        if (modeToggleInProgress || !panel.open) return;
        modeToggleInProgress = true;
        for (const other of ui.traceModes) {
          if (other !== panel) other.open = false;
        }
        modeToggleInProgress = false;
        setActiveTraceMode(panel.dataset.traceMode);
      });
    }

    ui.observerRadius.addEventListener("input", () => {
      orbitRenderer?.clearAnimatedRays("single");
      orbitRenderer?.clearAnimatedRays("multi");
      updateSingleRayCount();
      if (ui.turnCount.value) {
        scheduleTurnPreset(180);
        return;
      }
      queueTrace();
    });

    for (const input of [ui.mass, ui.inclination]) {
      input.addEventListener("change", () => {
        if (input === ui.inclination) {
          orbitRenderer?.clearAnimatedRays("single");
          orbitRenderer?.clearAnimatedRays("multi");
          updateSingleRayCount();
        }
        queueTrace();
      });
    }

    for (const input of ui.coordinateInputs) {
      input.addEventListener("change", () => commitCoordinateInput(input));
      const remember = () => {
        rememberDigitCaret(input);
        updateDigitStepDisplay(input);
      };
      input.addEventListener("click", remember);
      input.addEventListener("keyup", remember);
      input.addEventListener("select", remember);
      input.addEventListener("input", remember);
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          commitCoordinateInput(input);
          const mode = input.dataset.coordinateMode;
          if (mode === "single") addSingleAnimatedRay();
          else if (mode === "multi") addMultiSelectedPoint();
          return;
        }
        if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
        event.preventDefault();
        applyDigitStep(input, event.key === "ArrowUp" ? 1 : -1);
      });
    }

    for (const button of document.querySelectorAll("[data-step-target]")) {
      button.addEventListener("pointerdown", event => event.preventDefault());
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.stepTarget);
        applyDigitStep(input, Number(button.dataset.stepDirection));
      });
    }

    ui.screenCanvas.addEventListener("pointerdown", event => {
      if (event.shiftKey || event.button === 1 || event.button === 2) {
        screenPanning = true;
        screenPanStart.x = event.clientX;
        screenPanStart.y = event.clientY;
        screenPanStart.centerU = screenView.centerU;
        screenPanStart.centerV = screenView.centerV;
      } else {
        if (activeTraceMode === "whole") {
          dragSelecting = true;
          setPixelFromPointer(event, true);
        } else {
          dragSelecting = false;
          setPixelFromPointer(event, false);
          if (activeTraceMode === "single") addSingleAnimatedRay();
          else if (activeTraceMode === "multi") addMultiSelectedPoint();
        }
      }
      ui.screenCanvas.setPointerCapture(event.pointerId);
    });
    ui.screenCanvas.addEventListener("pointermove", event => {
      if (screenPanning) {
        const rect = ui.screenCanvas.getBoundingClientRect();
        const { scale } = screenLayout(rect);
        screenView.centerU = screenPanStart.centerU - (event.clientX - screenPanStart.x) / scale;
        screenView.centerV = screenPanStart.centerV + (event.clientY - screenPanStart.y) / scale;
        constrainScreenView();
        refreshScreenOnly();
      } else if (dragSelecting) {
        setPixelFromPointer(event, true);
      }
    });
    const finishScreenInteraction = () => {
      dragSelecting = false;
      screenPanning = false;
    };
    ui.screenCanvas.addEventListener("pointerup", finishScreenInteraction);
    ui.screenCanvas.addEventListener("pointercancel", finishScreenInteraction);
    ui.screenCanvas.addEventListener("contextmenu", event => event.preventDefault());
    ui.screenCanvas.addEventListener("wheel", event => {
      event.preventDefault();
      const anchor = screenCoordinatesFromPointer(event);
      const oldHalfExtent = screenView.halfExtent;
      const newHalfExtent = clamp(
        oldHalfExtent * Math.exp(event.deltaY * 0.0014),
        1e-13,
        SCREEN_EXTENT
      );
      const ratio = newHalfExtent / oldHalfExtent;
      screenView.centerU = anchor.u + (screenView.centerU - anchor.u) * ratio;
      screenView.centerV = anchor.v + (screenView.centerV - anchor.v) * ratio;
      screenView.halfExtent = newHalfExtent;
      constrainScreenView();
      refreshScreenOnly();
    }, { passive: false });

    const resizeObserver = new ResizeObserver(() => {
      drawScreen();
      if (orbitRenderer) orbitRenderer.render(); else drawOrbit();
    });
    resizeObserver.observe(ui.screenWrap);
    resizeObserver.observe(ui.orbitWrap);

    window.addEventListener("DOMContentLoaded", () => {
      for (const control of ui.coordinateSystemControls) {
        updateCoordinateSystem(control.dataset.coordinateMode);
      }
      updatePlaybackDirection();
      updateAnimationPauseButton();
      window.CONGL = Object.freeze({
        integrateRay,
        asymptoticAzimuthFromObserver,
        observerBasis,
        windingTurns,
        sourceAxisOrder,
        solveImpactForTurns,
        runSelfTests
      });
      runTrace();
      renderMultiPointList();
      updateSingleRayCount();
      const report = runSelfTests();
      console.info("CONGL self-test", report);
    });
  </script>
</body>
</html>
