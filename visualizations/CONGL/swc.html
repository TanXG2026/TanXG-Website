<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/congl-logo.png">
  <link rel="apple-touch-icon" href="assets/congl-logo.png">
  <title>CONGL · Schwarzschild Black Hole</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f6;
      --panel: #ffffff;
      --ink: #17191c;
      --muted: #646a73;
      --line: #d7dbe0;
      --grid: #eceff2;
      --blue: #1769aa;
      --red: #b42318;
      --green: #16794a;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      padding: 8px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    header .brand-logo {
      display: block;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      object-fit: contain;
    }

    header span { color: var(--muted); }

    main {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      max-width: 1380px;
      margin: 0 auto;
    }

    aside, .workspace {
      background: var(--panel);
      border: 1px solid var(--line);
    }

    aside { padding: 15px; }

    h2 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.04em;
    }

    .section-hint {
      margin: -5px 0 9px;
      color: var(--muted);
      font-size: 11px;
    }

    .section + .section {
      margin-top: 17px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    label {
      display: block;
      margin: 8px 0 4px;
      color: var(--muted);
      font-size: 12px;
    }

    input, select, button {
      width: 100%;
      min-height: 34px;
      border: 1px solid #bfc5cc;
      border-radius: 3px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    input, select { padding: 6px 8px; }

    .coordinate-input {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .digit-stepper {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 22px;
    }

    .digit-stepper input {
      min-width: 0;
      border-radius: 3px 0 0 3px;
    }

    .digit-step-buttons {
      display: grid;
      grid-template-rows: 1fr 1fr;
    }

    .digit-step-button {
      width: 22px;
      min-height: 0;
      height: 17px;
      margin: 0;
      padding: 0;
      border-left: 0;
      border-color: #bfc5cc;
      border-radius: 0;
      background: #f6f7f8;
      color: #34383e;
      font-size: 9px;
      font-weight: 600;
      line-height: 1;
    }

    .digit-step-button:first-child { border-radius: 0 3px 0 0; }
    .digit-step-button:last-child {
      border-top: 0;
      border-radius: 0 0 3px 0;
    }
    .digit-step-button:hover { background: #e8eaed; }

    input:focus, select:focus, button:focus-visible {
      outline: 2px solid rgba(23, 105, 170, 0.25);
      outline-offset: 1px;
      border-color: var(--blue);
    }

    button {
      margin-top: 12px;
      cursor: pointer;
      background: #1d2024;
      color: #fff;
      border-color: #1d2024;
      font-weight: 600;
    }

    button:hover { background: #34383e; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .inline-value {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .inline-value output {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .screen-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid var(--line);
      background: #fff;
      cursor: crosshair;
      touch-action: none;
    }

    .trace-modes { margin-top: 10px; }

    .trace-mode {
      border-top: 1px solid var(--line);
    }

    .trace-mode:last-child { border-bottom: 1px solid var(--line); }

    .trace-mode summary {
      padding: 9px 2px;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .mode-body {
      padding: 0 2px 11px;
    }

    .coordinate-system-label { margin-top: 0; }
    .coordinate-system-select { margin-bottom: 7px; }
    .coordinate-fields[hidden] { display: none; }

    .trail-control {
      margin-top: 10px;
    }

    .trail-control label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 3px;
    }

    .trail-control output {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .trail-control input[type="range"] {
      min-height: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      accent-color: #e25525;
      cursor: ew-resize;
    }

    .quiet-button {
      background: #fff;
      color: #34383e;
      border-color: #bfc5cc;
      font-weight: 500;
    }

    .quiet-button:hover { background: #f0f2f4; }

    .point-list {
      max-height: 118px;
      overflow-y: auto;
      margin: 7px 0 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .point-list li {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      border-bottom: 1px solid #eef0f2;
    }

    .point-list-coordinates {
      overflow: hidden;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .point-delete-button {
      width: auto;
      min-height: 22px;
      padding: 1px 7px;
      border-color: #d3d7dc;
      background: #fff;
      color: #8f3428;
      font: 11px/1.2 system-ui, sans-serif;
      font-weight: 500;
    }

    .point-delete-button:hover {
      border-color: #bd776d;
      background: #fff6f4;
    }

    .turn-control {
      margin-top: 10px;
      padding: 9px;
      border: 1px solid var(--line);
      background: #fafbfc;
    }

    .turn-control label { margin-top: 0; }

    .turn-result {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    canvas { display: block; }

    #screenCanvas {
      width: 100%;
      height: 100%;
    }

    .workspace {
      min-width: 0;
      padding: 15px;
    }

    .orbit-wrap {
      position: relative;
      width: 100%;
      min-height: 540px;
      height: min(64vh, 690px);
      border: 1px solid #242a35;
      background: #02040a;
      overflow: hidden;
    }

    #starCanvas, #rimCanvas, #orbitCanvas, #orbitOverlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #starCanvas {
      z-index: 0;
      background: #02040a;
      pointer-events: none;
    }

    #rimCanvas {
      z-index: 1;
      pointer-events: none;
    }

    #orbitCanvas {
      z-index: 2;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #orbitCanvas:active { cursor: grabbing; }

    #orbitOverlay {
      z-index: 3;
      pointer-events: none;
    }

    .playback-control {
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 6px 5px 8px;
      border: 1px solid rgba(190, 198, 208, 0.28);
      border-radius: 3px;
      background: rgba(3, 6, 12, 0.78);
    }

    .playback-control[hidden] { display: none; }

    .playback-control label {
      margin: 0;
      color: rgba(222, 227, 234, 0.78);
      font-size: 11px;
      white-space: nowrap;
    }

    .playback-control select {
      width: auto;
      min-height: 27px;
      padding: 3px 24px 3px 7px;
      border-color: rgba(190, 198, 208, 0.38);
      background: #0a0e16;
      color: #eef1f5;
      font-size: 11px;
    }

    .playback-control button {
      width: auto;
      min-height: 27px;
      margin: 0;
      padding: 3px 10px;
      border-color: rgba(190, 198, 208, 0.38);
      background: #171c25;
      color: #eef1f5;
      font-size: 11px;
      font-weight: 600;
    }

    .playback-control button:hover { background: #252c38; }

    details {
      margin-top: 13px;
      border-top: 1px solid var(--line);
      padding-top: 11px;
      color: var(--muted);
      font-size: 12px;
    }

    summary { cursor: pointer; color: var(--ink); }

    @media (min-width: 901px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }

      main {
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }

      aside, .workspace {
        height: 100%;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }

      .workspace {
        overflow: hidden;
        scrollbar-gutter: auto;
      }

      .workspace .orbit-wrap {
        height: 100%;
        min-height: 0;
      }

    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .section + .section { margin: 0; padding: 0; border: 0; }
      .orbit-wrap { min-height: 430px; height: 55vh; }
    }

    @media (max-width: 620px) {
      header { gap: 10px; padding-inline: 14px; }
      header span { display: block; }
      aside { display: block; }
      .section + .section { margin-top: 17px; padding-top: 16px; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <img class="brand-logo" src="assets/congl-logo.png" alt="CONGL">
    <span>Compact Object Null Geodesic Lab · Schwarzschild Black Hole</span>
  </header>

  <main>
    <aside>
      <section class="section">
        <h2>中心天体模型</h2>

        <div class="pair">
          <div>
            <label for="mass">质量 / M☉</label>
            <input id="mass" type="number" min="0.1" max="10000000000" step="0.1" value="10.0">
          </div>
          <div>
            <label for="inclination">倾角 θo / °</label>
            <input id="inclination" type="number" min="0" max="180" step="1" value="60">
          </div>
        </div>

        <label for="observerRadius">观测者到黑洞距离 rₒ / M</label>
        <input id="observerRadius" type="number" min="20" max="100000" step="10" value="1000">

        <div class="inline-value">
          <span>事件视界半径 2GM/c²</span>
          <output id="horizonRadius">—</output>
        </div>
        <div class="inline-value">
          <span>光子球 / 临界冲量参数</span>
          <output id="criticalImpact">3M / 5.19615M</output>
        </div>
      </section>

      <section class="section">
        <h2>观察者屏幕</h2>
        <p class="section-hint">滚轮缩放 · Shift + 拖动平移</p>
        <div class="screen-wrap" id="screenWrap" aria-label="观察者屏幕；点击选择像素">
          <canvas id="screenCanvas"></canvas>
        </div>

        <div class="inline-value">
          <span>屏幕临界半径 ρc(rₒ) / M</span>
          <output id="screenCritical">—</output>
        </div>
        <div class="inline-value">
          <span>屏幕缩放</span>
          <output id="screenZoom">×1</output>
        </div>

        <div class="trace-modes">
          <details class="trace-mode" data-trace-mode="whole" name="trace-mode" open>
            <summary>整根光线</summary>
            <div class="mode-body">
              <label class="coordinate-system-label" for="wholeCoordinateSystem">坐标形式</label>
              <select class="coordinate-system-select" id="wholeCoordinateSystem" data-coordinate-system data-coordinate-mode="whole">
                <option value="cartesian" selected>直角坐标（α, β）</option>
                <option value="polar">极坐标（ρ, φ）</option>
              </select>
              <div class="coordinate-fields" data-coordinate-fields="cartesian" data-coordinate-mode="whole">
                <div class="pair">
                  <div>
                    <label for="pixelU">α / M</label>
                    <div class="digit-stepper">
                      <input class="coordinate-input" id="pixelU" data-coordinate-component="alpha" data-coordinate-mode="whole" type="text" inputmode="decimal" value="5.1940000000000000" autocomplete="off">
                      <div class="digit-step-buttons">
                        <button class="digit-step-button" type="button" data-step-target="pixelU" data-step-direction="1" aria-label="α 当前数位增加 1">▲</button>
                        <button class="digit-step-button" type="button" data-step-target="pixelU" data-step-direction="-1" aria-label="α 当前数位减少 1">▼</button>
                      </div>
                    </div>
                  </div>
                  <div>
                    <label for="pixelV">β / M</label>
                    <div class="digit-stepper">
                      <input class="coordinate-input" id="pixelV" data-coordinate-component="beta" data-coordinate-mode="whole" type="text" inputmode="decimal" value="0.0000000000000000" autocomplete="off">
                      <div class="digit-step-buttons">
                        <button class="digit-step-button" type="button" data-step-target="pixelV" data-step-direction="1" aria-label="β 当前数位增加 1">▲</button>
                        <button class="digit-step-button" type="button" data-step-target="pixelV" data-step-direction="-1" aria-label="β 当前数位减少 1">▼</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="coordinate-fields" data-coordinate-fields="polar" data-coordinate-mode="whole" hidden>
                <div class="pair">
                  <div>
                    <label for="pixelRho">ρ / M</label>
                    <div class="digit-stepper">
                      <input class="coordinate-input" id="pixelRho" data-coordinate-component="rho" data-coordinate-mode="whole" type="text" inputmode="decimal" value="5.1940000000000000" autocomplete="off">
                      <div class="digit-step-buttons">
                        <button class="digit-step-button" type="button" data-step-target="pixelRho" data-step-direction="1" aria-label="ρ 当前数位增加 1">▲</button>
                        <button class="digit-step-button" type="button" data-step-target="pixelRho" data-step-direction="-1" aria-label="ρ 当前数位减少 1">▼</button>
                      </div>
                    </div>
                  </div>
                  <div>
                    <label for="pixelPhi">φ / °</label>
                    <div class="digit-stepper">
                      <input class="coordinate-input" id="pixelPhi" data-coordinate-component="phi" data-coordinate-mode="whole" type="text" inputmode="decimal" value="0.0000000000000000" autocomplete="off">
                      <div class="digit-step-buttons">
                        <button class="digit-step-button" type="button" data-step-target="pixelPhi" data-step-direction="1" aria-label="φ 当前数位增加 1">▲</button>
                        <button class="digit-step-button" type="button" data-step-target="pixelPhi" data-step-direction="-1" aria-label="φ 当前数位减少 1">▼</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="inline-value">
                <span>光标所在位增减单位</span>
                <output id="digitStepDisplay" data-digit-step-display>0.01</output>
              </div>

              <div class="turn-control">
                <label for="turnCount">旋转圈数 n（轴后方无穷远源）</label>
                <select id="turnCount">
                  <option value="" selected>请选择 1–5</option>
                  <option value="1">1 圈后逃逸</option>
                  <option value="2">2 圈后逃逸</option>
                  <option value="3">3 圈后逃逸</option>
                  <option value="4">4 圈后逃逸</option>
                  <option value="5">5 圈后逃逸</option>
                </select>
                <div class="turn-result" id="turnResult">相对直达路径的额外绕行：—</div>
              </div>

              <button id="downloadGeodesic" type="button">下载测地线数据（CSV）</button>
            </div>
          </details>

          <details class="trace-mode" data-trace-mode="single" name="trace-mode">
            <summary>单根光线</summary>
            <div class="mode-body">
              <label class="coordinate-system-label" for="singleCoordinateSystem">坐标形式</label>
              <select class="coordinate-system-select" id="singleCoordinateSystem" data-coordinate-system data-coordinate-mode="single">
                <option value="cartesian" selected>直角坐标（α, β）</option>
                <option value="polar">极坐标（ρ, φ）</option>
              </select>
              <div class="coordinate-fields" data-coordinate-fields="cartesian" data-coordinate-mode="single">
                <div class="pair">
                  <div>
                    <label for="singlePixelU">α / M</label>
                    <div class="digit-stepper">
                      <input class="coordinate-input" id="singlePixelU" data-coordinate-component="alpha" data-coordinate-mode="single" type="text" inputmode="decimal" value="5.1940000000000000" autocomplete="off">
                      <div class="digit-step-buttons">
                        <button class="digit-step-button" type="button" data-step-target="singlePixelU" data-step-direction="1" aria-label="单根光线 α 当前数位增加 1">▲</button>
                        <button class="digit-step-button" type="button" data-step-target="singlePixelU" data-step-direction="-1" aria-label="单根光线 α 当前数位减少 1">▼</button>
                      </div>
                    </div>
                  </div>
                  <div>
                    <label for="singlePixelV">β / M</label>
                    <div class="digit-stepper">
                      <input class="coordinate-input" id="singlePixelV" data-coordinate-component="beta" data-coordinate-mode="single" type="text" inputmode="decimal" value="0.0000000000000000" autocomplete="off">
                      <div class="digit-step-buttons">
                        <button class="digit-step-button" type="button" data-step-target="singlePixelV" data-step-direction="1" aria-label="单根光线 β 当前数位增加 1">▲</button>
                        <button class="digit-step-button" type="button" data-step-target="singlePixelV" data-step-direction="-1" aria-label="单根光线 β 当前数位减少 1">▼</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="coordinate-fields" data-coordinate-fields="polar" data-coordinate-mode="single" hidden>
                <div class="pair">
                  <div>
                    <label for="singlePixelRho">ρ / M</label>
                    <div class="digit-stepper">
                      <input class="coordinate-input" id="singlePixelRho" data-coordinate-component="rho" data-coordinate-mode="single" type="text" inputmode="decimal" value="5.1940000000000000" autocomplete="off">
                      <div class="digit-step-buttons">
                        <button class="digit-step-button" type="button" data-step-target="singlePixelRho" data-step-direction="1" aria-label="单根光线 ρ 当前数位增加 1">▲</button>
                        <button class="digit-step-button" type="button" data-step-target="singlePixelRho" data-step-direction="-1" aria-label="单根光线 ρ 当前数位减少 1">▼</button>
                      </div>
                    </div>
                  </div>
                  <div>
                    <label for="singlePixelPhi">φ / °</label>
                    <div class="digit-stepper">
                      <input class="coordinate-input" id="singlePixelPhi" data-coordinate-component="phi" data-coordinate-mode="single" type="text" inputmode="decimal" value="0.0000000000000000" autocomplete="off">
                      <div class="digit-step-buttons">
                        <button class="digit-step-button" type="button" data-step-target="singlePixelPhi" data-step-direction="1" aria-label="单根光线 φ 当前数位增加 1">▲</button>
                        <button class="digit-step-button" type="button" data-step-target="singlePixelPhi" data-step-direction="-1" aria-label="单根光线 φ 当前数位减少 1">▼</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="inline-value">
                <span>光标所在位增减单位</span>
                <output data-digit-step-display>0.01</output>
              </div>
              <button id="addSingleByInput" type="button">添加光线</button>
              <div class="trail-control">
                <label for="singleTrailLength">
                  <span>拖尾长度</span>
                  <output data-trail-length-display>18%</output>
                </label>
                <input id="singleTrailLength" data-trail-length type="range" min="4" max="45" step="1" value="18">
              </div>
              <div class="inline-value" aria-live="polite">
                <span>正在运行</span>
                <output id="singleRayCount">0 条</output>
              </div>
              <button class="quiet-button" id="clearSingleRays" type="button">清空单根动画</button>
            </div>
          </details>

          <details class="trace-mode" data-trace-mode="multi" name="trace-mode">
            <summary>多根光线</summary>
            <div class="mode-body">
              <label class="coordinate-system-label" for="multiCoordinateSystem">坐标形式</label>
              <select class="coordinate-system-select" id="multiCoordinateSystem" data-coordinate-system data-coordinate-mode="multi">
                <option value="cartesian" selected>直角坐标（α, β）</option>
                <option value="polar">极坐标（ρ, φ）</option>
              </select>
              <div class="coordinate-fields" data-coordinate-fields="cartesian" data-coordinate-mode="multi">
                <div class="pair">
                  <div>
                    <label for="multiPixelU">α / M</label>
                    <div class="digit-stepper">
                      <input class="coordinate-input" id="multiPixelU" data-coordinate-component="alpha" data-coordinate-mode="multi" type="text" inputmode="decimal" value="5.1940000000000000" autocomplete="off">
                      <div class="digit-step-buttons">
                        <button class="digit-step-button" type="button" data-step-target="multiPixelU" data-step-direction="1" aria-label="多根光线 α 当前数位增加 1">▲</button>
                        <button class="digit-step-button" type="button" data-step-target="multiPixelU" data-step-direction="-1" aria-label="多根光线 α 当前数位减少 1">▼</button>
                      </div>
                    </div>
                  </div>
                  <div>
                    <label for="multiPixelV">β / M</label>

  <script>
    "use strict";

    const RG_SUN_KM = 1.4766250385;
    const METRIC_MASS = 1;
    const HORIZON_RADIUS = 2;
    const PHOTON_SPHERE_RADIUS = 3;
    const CRITICAL_IMPACT = 3 * Math.sqrt(3);
    const DEFAULT_OBSERVER_DISTANCE = 1000;
    const SCREEN_PIXELS = 121;
    const SCREEN_EXTENT = 8;
    const POLAR_MAX = SCREEN_EXTENT * Math.SQRT2;
    const DISPLAY_DECIMALS = 16;
    const TWO_PI = 2 * Math.PI;
    const ANIMATION_RADIUS = 32;

    const ui = {
      mass: document.getElementById("mass"),
      inclination: document.getElementById("inclination"),
      observerRadius: document.getElementById("observerRadius"),
      pixelU: document.getElementById("pixelU"),
      pixelV: document.getElementById("pixelV"),
      coordinateInputs: Array.from(document.querySelectorAll("[data-coordinate-component]")),
      coordinateSystemControls: Array.from(document.querySelectorAll("[data-coordinate-system]")),
      coordinateFieldGroups: Array.from(document.querySelectorAll("[data-coordinate-fields]")),
      digitStepDisplay: document.getElementById("digitStepDisplay"),
      horizonRadius: document.getElementById("horizonRadius"),
      criticalImpact: document.getElementById("criticalImpact"),
      screenCritical: document.getElementById("screenCritical"),
      downloadGeodesic: document.getElementById("downloadGeodesic"),
      screenWrap: document.getElementById("screenWrap"),
      screenCanvas: document.getElementById("screenCanvas"),
      screenZoom: document.getElementById("screenZoom"),
      turnCount: document.getElementById("turnCount"),
      turnResult: document.getElementById("turnResult"),
      traceModes: Array.from(document.querySelectorAll("[data-trace-mode]")),
      singleRayCount: document.getElementById("singleRayCount"),
      addSingleByInput: document.getElementById("addSingleByInput"),
      clearSingleRays: document.getElementById("clearSingleRays"),
      multiPointCount: document.getElementById("multiPointCount"),
      multiPointList: document.getElementById("multiPointList"),
      addMultiByInput: document.getElementById("addMultiByInput"),
      clearMultiPoints: document.getElementById("clearMultiPoints"),
      startMultiRays: document.getElementById("startMultiRays"),
      trailLengthControls: Array.from(document.querySelectorAll("[data-trail-length]")),
      trailLengthDisplays: Array.from(document.querySelectorAll("[data-trail-length-display]")),
      orbitWrap: document.getElementById("orbitWrap"),
      starCanvas: document.getElementById("starCanvas"),
      rimCanvas: document.getElementById("rimCanvas"),
      orbitCanvas: document.getElementById("orbitCanvas"),
      orbitOverlay: document.getElementById("orbitOverlay"),
      playbackControl: document.getElementById("playbackControl"),
      playbackDirection: document.getElementById("playbackDirection"),
      animationPause: document.getElementById("animationPause"),
      selfTest: document.getElementById("selfTest")
    };

    let currentResult = null;
    let dragSelecting = false;
    let screenPanning = false;
    let traceQueued = false;
    let orbitRenderer = null;
    let turnSolveTimer = null;
    let activeTraceMode = "whole";
    let trailFraction = 0.18;
    let polarAngle = 0;
    const multiSelectedPoints = [];
    const turnPresetCache = new Map();
    const screenView = { centerU: 0, centerV: 0, halfExtent: SCREEN_EXTENT };
    const screenPanStart = { x: 0, y: 0, centerU: 0, centerV: 0 };

    function clamp(value, low, high) {
      return Math.min(high, Math.max(low, value));
    }

    function finiteNumber(input, fallback) {
      const value = Number(input.value);
      return Number.isFinite(value) ? value : fallback;
    }

    function addScaled(base, terms) {
      const out = base.slice();
      for (let i = 0; i < out.length; i += 1) {
        for (const [factor, vector] of terms) out[i] += factor * vector[i];
      }
      return out;
    }

    function derivatives(y, metricMass, pT, pPhi) {
      const r = y[0];
      const radialVelocity = y[2];
      return [
        radialVelocity,
        pPhi / (r * r),
        pPhi * pPhi * (r - 3 * metricMass) / Math.pow(r, 4)
      ];
    }

    function dormandPrinceStep(y, h, metricMass, pT, pPhi) {
      const d = state => derivatives(state, metricMass, pT, pPhi);
      const k1 = d(y);
      const k2 = d(addScaled(y, [[h * (1 / 5), k1]]));
      const k3 = d(addScaled(y, [[h * (3 / 40), k1], [h * (9 / 40), k2]]));
      const k4 = d(addScaled(y, [
        [h * (44 / 45), k1], [h * (-56 / 15), k2], [h * (32 / 9), k3]
      ]));
      const k5 = d(addScaled(y, [
        [h * (19372 / 6561), k1], [h * (-25360 / 2187), k2],
        [h * (64448 / 6561), k3], [h * (-212 / 729), k4]
      ]));
      const k6 = d(addScaled(y, [
        [h * (9017 / 3168), k1], [h * (-355 / 33), k2],
        [h * (46732 / 5247), k3], [h * (49 / 176), k4],
        [h * (-5103 / 18656), k5]
      ]));

      const y5 = addScaled(y, [
        [h * (35 / 384), k1], [h * (500 / 1113), k3],
        [h * (125 / 192), k4], [h * (-2187 / 6784), k5],
        [h * (11 / 84), k6]
      ]);
      const k7 = d(y5);
      const y4 = addScaled(y, [
        [h * (5179 / 57600), k1], [h * (7571 / 16695), k3],
        [h * (393 / 640), k4], [h * (-92097 / 339200), k5],
        [h * (187 / 2100), k6], [h * (1 / 40), k7]
      ]);

      return { y5, y4 };
    }

    function errorNorm(y, y5, y4, rtol = 1e-9, atol = 1e-12) {
      let sum = 0;
      for (let i = 0; i < y.length; i += 1) {
        const scale = atol + rtol * Math.max(Math.abs(y[i]), Math.abs(y5[i]));
        const ratio = (y5[i] - y4[i]) / scale;
        sum += ratio * ratio;
      }
      return Math.sqrt(sum / y.length);
    }

    function relativeNullConstraint(y, metricMass, pT, pPhi) {
      const r = y[0];
      const radialVelocity = y[2];
      const f = 1 - 2 * metricMass / r;
      const radialTerm = radialVelocity * radialVelocity;
      const energyTerm = pT * pT;
      const angularTerm = f * pPhi * pPhi / (r * r);
      return Math.abs(radialTerm - energyTerm + angularTerm)
        / Math.max(radialTerm + energyTerm + Math.abs(angularTerm), 1e-30);
    }

    function radialPotential(radius, metricMass, pT, pPhi) {
      const f = 1 - 2 * metricMass / radius;
      return pT * pT - f * pPhi * pPhi / (radius * radius);
    }

    function outerTurningRadius(metricMass, pT, pPhi, observerRadius) {
      const asymptoticImpact = Math.abs(pPhi / pT);
      if (metricMass === 0) return asymptoticImpact > 0 ? asymptoticImpact : null;
      const critical = 3 * Math.sqrt(3) * metricMass;
      if (!(asymptoticImpact > critical)) return null;

      let low = 3 * metricMass;
      let high = observerRadius;
      for (let iteration = 0; iteration < 80; iteration += 1) {
        const middle = 0.5 * (low + high);
        if (radialPotential(middle, metricMass, pT, pPhi) < 0) low = middle;
        else high = middle;
      }
      return 0.5 * (low + high);
    }

    function adaptiveSimpsonIntegral(fn, tolerance = 2e-10, maxDepth = 22) {
      const recurse = (a, b, fa, fm, fb, whole, tol, depth) => {
        const middle = 0.5 * (a + b);
        const leftMiddle = 0.5 * (a + middle);
        const rightMiddle = 0.5 * (middle + b);
        const flm = fn(leftMiddle);
        const frm = fn(rightMiddle);
        const left = (middle - a) * (fa + 4 * flm + fm) / 6;
        const right = (b - middle) * (fm + 4 * frm + fb) / 6;
        const refined = left + right;
        if (depth <= 0 || Math.abs(refined - whole) <= 15 * tol) {
          return refined + (refined - whole) / 15;
        }
        return recurse(a, middle, fa, flm, fm, left, tol / 2, depth - 1)
          + recurse(middle, b, fm, frm, fb, right, tol / 2, depth - 1);
      };

      const fa = fn(0);
      const fm = fn(0.5);
      const fb = fn(1);
      const whole = (fa + 4 * fm + fb) / 6;
      return recurse(0, 1, fa, fm, fb, whole, tolerance, maxDepth);
    }

    function azimuthIntegralToTurning(uLower, uTurning, metricMass) {
      const span = uTurning - uLower;
      if (!(span > 0)) return 0;
      const leading = 2 * uTurning * (1 - 3 * metricMass * uTurning);
      const quadratic = -1 + 6 * metricMass * uTurning;
      const transformed = x => {
        if (x === 0) return 2 * Math.sqrt(span / Math.max(leading, 1e-300));
        const delta = span * x * x;
        const reducedPotential = delta * (
          leading + quadratic * delta - 2 * metricMass * delta * delta
        );
        return 2 * span * x / Math.sqrt(Math.max(reducedPotential, 1e-300));
      };
      return adaptiveSimpsonIntegral(transformed);
    }

    function asymptoticAzimuthFromObserver(distance, impact, metricMass = METRIC_MASS) {
      const fObserver = 1 - 2 * metricMass / distance;
      if (!(fObserver > 0) || !(impact >= 0)) return null;
      const directionScale = Math.hypot(distance, impact);
      const pT = Math.sqrt(fObserver);
      const pPhi = distance * impact / directionScale;
      const turningRadius = outerTurningRadius(metricMass, pT, pPhi, distance);
      if (!Number.isFinite(turningRadius)) return null;
      const uTurning = 1 / turningRadius;
      return azimuthIntegralToTurning(1 / distance, uTurning, metricMass)
        + azimuthIntegralToTurning(0, uTurning, metricMass);
    }

    function pointFromState(y, affine = 0) {
      return {
        x: y[0] * Math.cos(y[1]),
        y: y[0] * Math.sin(y[1]),
        r: y[0],
        phi: y[1],
        affine
      };
    }

    function localDirection(y, metricMass, pT, pPhi) {
      const r = y[0];
      const phi = y[1];
      const f = 1 - 2 * metricMass / r;
      const radial = y[2] / pT;
      const azimuthal = Math.sqrt(f) * pPhi / (r * pT);
      const x = radial * Math.cos(phi) - azimuthal * Math.sin(phi);
      const yy = radial * Math.sin(phi) + azimuthal * Math.cos(phi);
      const norm = Math.hypot(x, yy);
      return {
        x: x / norm,
        y: yy / norm,
        radial,
        azimuthal,
        angleUnwrapped: phi + Math.atan2(azimuthal, radial)
      };
    }

    function locateEvent(previous, step, metricMass, pT, pPhi, eventValue, increasing) {
      let low = 0;
      let high = step;
      let highState = dormandPrinceStep(previous, high, metricMass, pT, pPhi).y5;

      for (let iteration = 0; iteration < 55; iteration += 1) {
        const middle = 0.5 * (low + high);
        const middleState = dormandPrinceStep(previous, middle, metricMass, pT, pPhi).y5;
        const value = eventValue(middleState);
        const eventIsAfterMiddle = increasing ? value < 0 : value > 0;
        if (eventIsAfterMiddle) {
          low = middle;
        } else {
          high = middle;
          highState = middleState;
        }
        if (high - low <= Math.max(1e-13, 1e-12 * step)) break;
      }

      return { state: highState, elapsed: high };
    }

    function asymptoticAzimuthTail(state, metricMass, pT, pPhi) {
      const inverseRadius = 1 / state[0];
      const intervals = 32;
      const integrand = u => {
        const radicand = pT * pT - (1 - 2 * metricMass * u) * pPhi * pPhi * u * u;
        return pPhi / Math.sqrt(Math.max(radicand, 1e-30));
      };
      let weighted = integrand(0) + integrand(inverseRadius);
      for (let index = 1; index < intervals; index += 1) {
        weighted += (index % 2 === 0 ? 2 : 4) * integrand(index * inverseRadius / intervals);
      }
      return inverseRadius * weighted / (3 * intervals);
    }

    function integrateRay({
      metricMass = METRIC_MASS,
      distance,
      impact,
      rtol = 1e-10,
      farPastRadiusOverride = null
    }) {
      const r0 = distance;
      const screenScale = Math.hypot(distance, impact);
      const horizonRadius = 2 * metricMass;
      const f0 = 1 - horizonRadius / r0;

      if (!(f0 > 0) || !(distance > horizonRadius) || !(impact >= 0)) {
        return { status: "invalid", message: "输入参数无效", points: [] };
      }

      const localRadial = -distance / screenScale;
      const localAzimuthal = impact / screenScale;
      const pT = Math.sqrt(f0);
      const pPhi = r0 * localAzimuthal;
      const radialVelocity0 = Math.sqrt(f0) * localRadial;
      const turningRadius = outerTurningRadius(metricMass, pT, pPhi, r0);
      const hasFiniteTurningPoint = Number.isFinite(turningRadius) && turningRadius > horizonRadius;

      let y = [r0, 0, radialVelocity0];
      let h = Math.min(0.2, 0.01 * r0);
      let affine = 0;
      let accepted = 0;
      let rejected = 0;
      let minR = r0;
      let closestState = y.slice();
      let maxConstraint = relativeNullConstraint(y, metricMass, pT, pPhi);
      let turned = false;
      let previousDr = y[2];
      const points = [pointFromState(y, affine)];
      const maxAcceptedSteps = 200000;
      const farPastRadius = Number.isFinite(farPastRadiusOverride)
        ? Math.max(farPastRadiusOverride, 1.01 * r0)
        : Math.max(1000 * Math.max(metricMass, 1), 10 * r0);
      const maxAffine = 2.5 * (r0 + farPastRadius) + 1000;
      let status = "running";
      let message = "";

      while (accepted < maxAcceptedSteps && affine < maxAffine) {
        const stepCeiling = clamp(0.03 * y[0], 0.002, 2500.0);
        h = Math.min(h, stepCeiling, maxAffine - affine);
        h = Math.max(h, 1e-8);

        const previous = y;
        const trial = dormandPrinceStep(y, h, metricMass, pT, pPhi);
        const err = errorNorm(y, trial.y5, trial.y4, rtol);

        if (!trial.y5.every(Number.isFinite) || !Number.isFinite(err)) {
          status = "failed";
          message = "积分出现非有限数值";
          break;
        }

        if (err <= 1) {
          const acceptedStep = h;
          y = trial.y5;
          affine += h;
          accepted += 1;

          if (y[0] <= horizonRadius) {
            const horizonEvent = locateEvent(
              previous,
              acceptedStep,
              metricMass,
              pT,
              pPhi,
              state => state[0] - horizonRadius,
              false
            );
            y = horizonEvent.state;
            y[0] = horizonRadius;
            affine += horizonEvent.elapsed - acceptedStep;
            points.push(pointFromState(y, affine));
            minR = horizonRadius;
            closestState = y.slice();
            status = "captured";
            message = "穿过事件视界";
            break;
          }

          const rawCurrentDr = y[2];
          const reachedTurningPoint = hasFiniteTurningPoint && !turned && (
            y[0] <= turningRadius || (previousDr < 0 && rawCurrentDr >= 0)
          );
          if (reachedTurningPoint) {
            const crossedRadius = y[0] <= turningRadius;
            const turningEvent = locateEvent(
              previous,
              acceptedStep,
              metricMass,
              pT,
              pPhi,
              crossedRadius
                ? state => state[0] - turningRadius
                : state => state[2],
              !crossedRadius
            );
            y = turningEvent.state;
            y[0] = turningRadius;
            y[2] = 0;
            affine += turningEvent.elapsed - acceptedStep;
            closestState = y.slice();
            minR = turningRadius;
            turned = true;
            previousDr = 0;
            maxConstraint = Math.max(
              maxConstraint,
              relativeNullConstraint(y, metricMass, pT, pPhi)
            );
            points.push(pointFromState(y, affine));
            h = Math.min(h, 0.05);
            continue;
          }

          const exactRadialSpeed = Math.sqrt(Math.max(
            0,
            radialPotential(y[0], metricMass, pT, pPhi)
          ));
          y[2] = (turned ? 1 : -1) * exactRadialSpeed;
          previousDr = y[2];

          const constraint = relativeNullConstraint(y, metricMass, pT, pPhi);
          maxConstraint = Math.max(maxConstraint, constraint);
          if (y[0] < minR) {
            minR = y[0];
            closestState = y.slice();
          }
          points.push(pointFromState(y, affine));

          if (turned && y[0] >= farPastRadius) {
            const escapeEvent = locateEvent(
              previous,
              acceptedStep,
              metricMass,
              pT,
              pPhi,
              state => state[0] - farPastRadius,
              true
            );
            y = escapeEvent.state;
            y[0] = farPastRadius;
            y[2] = Math.sqrt(Math.max(0, radialPotential(y[0], metricMass, pT, pPhi)));
            affine += escapeEvent.elapsed - acceptedStep;
            points[points.length - 1] = pointFromState(y, affine);
            status = "escape";
            message = "到达过去无穷远数值边界";
            break;
          }

          const factor = err === 0 ? 5 : clamp(0.9 * Math.pow(err, -0.2), 0.2, 5);
          h *= factor;
        } else {
          rejected += 1;
          h *= clamp(0.9 * Math.pow(err, -0.25), 0.1, 0.5);
          if (h < 1e-12) {
            status = "failed";
            message = "步长低于允许下限";
            break;
          }
        }
      }

      if (status === "running") {
        status = "failed";
        message = "达到积分上限";
      }

      let deflection = null;
      let phiInfinity = null;
      let phiInfinityNumerical = null;
      let asymptoticTail = null;
      const initialDirection = localDirection([r0, 0, radialVelocity0], metricMass, pT, pPhi);
      if (status === "escape") {
        asymptoticTail = asymptoticAzimuthTail(y, metricMass, pT, pPhi);
        phiInfinityNumerical = y[1] + asymptoticTail;
        phiInfinity = asymptoticAzimuthFromObserver(distance, impact, metricMass);
        deflection = phiInfinity - initialDirection.angleUnwrapped;
      }

      return {
        status,
        message,
        metricMass,
        horizonRadius,
        distance,
        impact,
        impactInfinity: pPhi / pT,
        farPastRadius,
        pT,
        pPhi,
        turningRadius,
        initialLocalTime: -1,
        initialCoordinateTimeDirection: -pT / f0,
        finalState: y,
        closestState,
        minR,
        deflection,
        initialDirectionAngle: initialDirection.angleUnwrapped,
        asymptoticTail,
        phiInfinity,
        phiInfinityNumerical,
        maxConstraint,
        accepted,
        rejected,
        affine,
        points
      };
    }

    function modelParameters() {
      const mass = clamp(finiteNumber(ui.mass, 10), 0.1, 1e10);
      const inclination = clamp(finiteNumber(ui.inclination, 60), 0, 180);
      const distance = clamp(
        finiteNumber(ui.observerRadius, DEFAULT_OBSERVER_DISTANCE),
        20,
        100000
      );
      const u = clamp(finiteNumber(ui.pixelU, 5.194), -SCREEN_EXTENT, SCREEN_EXTENT);
      const v = clamp(finiteNumber(ui.pixelV, 0), -SCREEN_EXTENT, SCREEN_EXTENT);
      return { mass, inclination, distance, u, v, impact: Math.hypot(u, v) };
    }

    function criticalScreenImpact(distance, metricMass = METRIC_MASS) {
      const critical = 3 * Math.sqrt(3) * metricMass;
      const fObserver = 1 - 2 * metricMass / distance;
      const localSine = critical * Math.sqrt(fObserver) / distance;
      if (!(localSine >= 0 && localSine < 1)) return Number.NaN;
      return distance * localSine / Math.sqrt(1 - localSine * localSine);
    }

    function observerBasis(inclinationDegrees) {
      const theta = inclinationDegrees * Math.PI / 180;
      const radial = [Math.sin(theta), 0, Math.cos(theta)];
      const alpha = [0, 1, 0];
      const beta = [-Math.cos(theta), 0, Math.sin(theta)];
      return { radial, alpha, beta };
    }

    function setCanvasSize(canvas, wrapper) {
      const rect = wrapper.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));
      const targetWidth = Math.round(width * dpr);
      const targetHeight = Math.round(height * dpr);
      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
      }
      const context = canvas.getContext("2d");
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { context, width, height };
    }

    function constrainScreenView() {
      screenView.halfExtent = clamp(screenView.halfExtent, 1e-13, SCREEN_EXTENT);
      const centerLimit = SCREEN_EXTENT - screenView.halfExtent;
      screenView.centerU = clamp(screenView.centerU, -centerLimit, centerLimit);
      screenView.centerV = clamp(screenView.centerV, -centerLimit, centerLimit);
    }

    function screenLayout(rect) {
      const pad = 17;
      const size = Math.min(rect.width, rect.height) - 2 * pad;
      const left = (rect.width - size) / 2;
      const top = (rect.height - size) / 2;
      const scale = size / (2 * screenView.halfExtent);
      return { pad, size, left, top, scale };
    }

    function screenCoordinatesFromPointer(event) {
      const rect = ui.screenCanvas.getBoundingClientRect();
      const { size, left, top } = screenLayout(rect);
      const normalizedX = clamp((event.clientX - rect.left - left) / size, 0, 1);
      const normalizedY = clamp((event.clientY - rect.top - top) / size, 0, 1);
      return {
        u: screenView.centerU + (2 * normalizedX - 1) * screenView.halfExtent,
        v: screenView.centerV + (1 - 2 * normalizedY) * screenView.halfExtent
      };
    }

    function formatZoom(value) {
      if (value < 1000) return `×${value.toFixed(value < 10 ? 2 : 0)}`;
      return `×${value.toExponential(2)}`;
    }

    function drawScreen() {
      const { context: ctx, width, height } = setCanvasSize(ui.screenCanvas, ui.screenWrap);
      const params = modelParameters();
      const { size, left, top, scale } = screenLayout({ width, height });
      const minU = screenView.centerU - screenView.halfExtent;
      const maxV = screenView.centerV + screenView.halfExtent;
      const toX = u => left + (u - minU) * scale;
      const toY = v => top + (maxV - v) * scale;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.beginPath();
      ctx.rect(left, top, size, size);
      ctx.clip();

      ctx.strokeStyle = "#eef0f2";
      ctx.lineWidth = 1;
      const minor = size / 12;
      for (let i = 0; i <= 12; i += 1) {
        const x = left + i * minor;
        const y = top + i * minor;
        ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top + size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + size, y); ctx.stroke();
      }

      ctx.strokeStyle = "#aeb4bb";
      if (Math.abs(screenView.centerU) <= screenView.halfExtent) {
        const axisX = toX(0);
        ctx.beginPath();
        ctx.moveTo(axisX, top);
        ctx.lineTo(axisX, top + size);
        ctx.stroke();
      }
      if (Math.abs(screenView.centerV) <= screenView.halfExtent) {
        const axisY = toY(0);
        ctx.beginPath();
        ctx.moveTo(left, axisY);
        ctx.lineTo(left + size, axisY);
        ctx.stroke();
      }

      const criticalRadius = criticalScreenImpact(params.distance);
      ctx.fillStyle = "#000000";
      const rows = Math.max(1, Math.ceil(size));
      for (let row = 0; row < rows; row += 1) {
        const v = maxV - (row + 0.5) / scale;
        if (Math.abs(v) >= criticalRadius) continue;
        const boundaryU = Math.sqrt(Math.max(0, criticalRadius * criticalRadius - v * v));
        const start = Math.max(left, toX(-boundaryU));
        const end = Math.min(left + size, toX(boundaryU));
        if (end > start) ctx.fillRect(start, top + row, end - start, 1.15);
      }

      const px = toX(params.u);
      const py = toY(params.v);
      if (px >= left - 8 && px <= left + size + 8 && py >= top - 8 && py <= top + size + 8) {
        ctx.strokeStyle = "#e43b19";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(px - 7, py); ctx.lineTo(px + 7, py);
        ctx.moveTo(px, py - 7); ctx.lineTo(px, py + 7);
        ctx.stroke();
        ctx.fillStyle = "#ffd24a";
        ctx.beginPath(); ctx.arc(px, py, 2.5, 0, TWO_PI); ctx.fill();
      }
      if (activeTraceMode === "multi") {
        ctx.font = "600 9px ui-sans-serif, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let index = 0; index < multiSelectedPoints.length; index += 1) {
          const point = multiSelectedPoints[index];
          const markerX = toX(point.u);
          const markerY = toY(point.v);
          if (markerX < left - 8 || markerX > left + size + 8
            || markerY < top - 8 || markerY > top + size + 8) continue;
          ctx.fillStyle = "#ffd24a";
          ctx.strokeStyle = "#e43b19";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(markerX, markerY, 7, 0, TWO_PI);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#5a210f";
          ctx.fillText(String(index + 1), markerX, markerY + 0.3);
        }
        ctx.textAlign = "start";
        ctx.textBaseline = "alphabetic";
      }
      ctx.restore();

      ctx.strokeStyle = "#c9cdd2";
      ctx.strokeRect(left + 0.5, top + 0.5, size - 1, size - 1);
      ctx.fillStyle = "#646a73";
      ctx.font = "11px ui-sans-serif, sans-serif";
      ctx.fillText("α / M", left + size - 31, clamp(toY(0) - 5, top + 12, top + size - 5));
      ctx.fillText("β / M", clamp(toX(0) + 5, left + 5, left + size - 31), top + 12);
      ui.screenZoom.textContent = formatZoom(SCREEN_EXTENT / screenView.halfExtent);
    }

    function vecSubtract(a, b) {
      return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    }

    function vecAdd(a, b) {
      return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
    }

    function vecScale(vector, scale) {
      return [vector[0] * scale, vector[1] * scale, vector[2] * scale];
    }

    function vecCross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
    }

    function vecDot(a, b) {
      return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    }

    function vecNormalize(vector) {
      const length = Math.hypot(vector[0], vector[1], vector[2]);
      if (length < 1e-14) return [0, 0, 0];
      return [vector[0] / length, vector[1] / length, vector[2] / length];
    }

    function orthographicMatrix(left, right, bottom, top, near, far) {
      return new Float32Array([
        2 / (right - left), 0, 0, 0,
        0, 2 / (top - bottom), 0, 0,
        0, 0, -2 / (far - near), 0,
        -(right + left) / (right - left),
        -(top + bottom) / (top - bottom),
        -(far + near) / (far - near),
        1
      ]);
    }

    function lookAtMatrix(eye, target, up) {
      const z = vecNormalize(vecSubtract(eye, target));
      const x = vecNormalize(vecCross(up, z));
      const y = vecCross(z, x);
      return new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
        -vecDot(x, eye), -vecDot(y, eye), -vecDot(z, eye), 1
      ]);
    }

    function transformVector4(matrix, vector) {
      const [x, y, z, w] = vector;
      return [
        matrix[0] * x + matrix[4] * y + matrix[8] * z + matrix[12] * w,
        matrix[1] * x + matrix[5] * y + matrix[9] * z + matrix[13] * w,
        matrix[2] * x + matrix[6] * y + matrix[10] * z + matrix[14] * w,
        matrix[3] * x + matrix[7] * y + matrix[11] * z + matrix[15] * w
      ];
    }

    function compileShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(`WebGL shader error: ${message}`);
      }
      return shader;
    }

    function createProgram(gl) {
      const vertexShader = compileShader(gl, gl.VERTEX_SHADER, `
        attribute vec3 aPosition;
        uniform mat4 uProjection;
        uniform mat4 uView;
        varying vec3 vViewNormal;
        void main() {
          float normalLength = max(length(aPosition), 0.000001);
          vViewNormal = mat3(uView) * (aPosition / normalLength);
          gl_Position = uProjection * uView * vec4(aPosition, 1.0);
        }
      `);
      const fragmentShader = compileShader(gl, gl.FRAGMENT_SHADER, `
        precision mediump float;
        uniform vec4 uColor;
        uniform float uLighting;
        varying vec3 vViewNormal;
        void main() {
          vec3 color = uColor.rgb;
          if (uLighting > 0.5) {
            vec3 normal = normalize(vViewNormal);
            vec3 lightDirection = normalize(vec3(-0.55, 0.68, 0.48));
            float diffuse = max(dot(normal, lightDirection), 0.0);
            float facing = clamp(normal.z, 0.0, 1.0);
            float edgeShade = 1.0 - 0.62 * pow(1.0 - facing, 1.7);
            float darkLight = 0.018 + 0.105 * diffuse + 0.025 * pow(diffuse, 10.0);
            color = vec3(0.0015, 0.003, 0.008)
              + darkLight * edgeShade * vec3(0.55, 0.62, 0.76);
          }
          gl_FragColor = vec4(color, uColor.a);
        }
      `);
      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      gl.deleteShader(vertexShader);
      gl.deleteShader(fragmentShader);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const message = gl.getProgramInfoLog(program);
        gl.deleteProgram(program);
        throw new Error(`WebGL program error: ${message}`);
      }
      return program;
    }

    function sphereGeometry(radius = 1, latitudeBands = 48, longitudeBands = 64) {
      const vertices = [];
      const indices = [];
      for (let latitude = 0; latitude <= latitudeBands; latitude += 1) {
        const theta = latitude * Math.PI / latitudeBands;
        const sinTheta = Math.sin(theta);
        const cosTheta = Math.cos(theta);
        for (let longitude = 0; longitude <= longitudeBands; longitude += 1) {
          const phi = longitude * TWO_PI / longitudeBands;
          vertices.push(
            radius * sinTheta * Math.cos(phi),
            radius * sinTheta * Math.sin(phi),
            radius * cosTheta
          );
        }
      }
      for (let latitude = 0; latitude < latitudeBands; latitude += 1) {
        for (let longitude = 0; longitude < longitudeBands; longitude += 1) {
          const first = latitude * (longitudeBands + 1) + longitude;
          const second = first + longitudeBands + 1;
          indices.push(first, second, first + 1, second, second + 1, first + 1);
        }
      }
      return { vertices, indices };
    }

    function tubeGeometry(points, planeNormal, radius, radialSegments = 10) {
      const vertices = [];
      const indices = [];
      if (points.length < 2) return { vertices, indices };

      for (let index = 0; index < points.length; index += 1) {
        const previous = points[Math.max(0, index - 1)];
        const next = points[Math.min(points.length - 1, index + 1)];
        const tangent = vecNormalize(vecSubtract(next, previous));
        let side = vecNormalize(vecCross(tangent, planeNormal));
        if (vecDot(side, side) < 0.5) side = [0, 1, 0];

        for (let segment = 0; segment < radialSegments; segment += 1) {
          const angle = TWO_PI * segment / radialSegments;
          const cosine = Math.cos(angle);
          const sine = Math.sin(angle);
          vertices.push(
            points[index][0] + radius * (cosine * planeNormal[0] + sine * side[0]),
            points[index][1] + radius * (cosine * planeNormal[1] + sine * side[1]),
            points[index][2] + radius * (cosine * planeNormal[2] + sine * side[2])
          );
        }
      }

      for (let index = 0; index < points.length - 1; index += 1) {
        for (let segment = 0; segment < radialSegments; segment += 1) {
          const nextSegment = (segment + 1) % radialSegments;
          const a = index * radialSegments + segment;
          const b = index * radialSegments + nextSegment;
          const c = (index + 1) * radialSegments + segment;
          const d = (index + 1) * radialSegments + nextSegment;
          indices.push(a, c, b, b, c, d);
        }
      }
      return { vertices, indices };
    }

    class OrbitRenderer3D {
      constructor(canvas, overlay, starCanvas, rimCanvas, wrapper) {
        this.canvas = canvas;
        this.overlay = overlay;
        this.starCanvas = starCanvas;
        this.rimCanvas = rimCanvas;
        this.wrapper = wrapper;
        this.overlayContext = overlay.getContext("2d");
        this.starContext = starCanvas.getContext("2d");
        this.rimContext = rimCanvas.getContext("2d");
        this.gl = canvas.getContext("webgl", {
          antialias: true,
          alpha: true,
          premultipliedAlpha: false
        });
        if (!this.gl) throw new Error("当前浏览器不支持 WebGL");

        this.program = createProgram(this.gl);
        this.positionLocation = this.gl.getAttribLocation(this.program, "aPosition");
        this.projectionLocation = this.gl.getUniformLocation(this.program, "uProjection");
        this.viewLocation = this.gl.getUniformLocation(this.program, "uView");
        this.colorLocation = this.gl.getUniformLocation(this.program, "uColor");
        this.lightingLocation = this.gl.getUniformLocation(this.program, "uLighting");
        this.sphere = this.createMesh(sphereGeometry(HORIZON_RADIUS));
        this.axes = {
          x: this.createLineMesh([-12, 0, 0, 12, 0, 0]),
          y: this.createLineMesh([0, -12, 0, 0, 12, 0]),
          z: this.createLineMesh([0, 0, -12, 0, 0, 12])
        };
        this.pathMeshes = [];
        this.pathLineMesh = null;
        this.staticPathPoints = [];
        this.turnMarkers = [];
        this.radialTurnMarker = null;
        this.staticPathHovered = false;
        this.staticAnnotationsPinned = false;
        this.pointerTravel = 0;
        this.animatedRays = [];
        this.visibleAnimationMode = "whole";
        this.animationFrameId = null;
        this.nextAnimationRayId = 1;
        this.trailFraction = trailFraction;
        this.playbackDirection = "reverse";
        this.animationPaused = false;
        this.pauseStartedAt = null;
        this.onRaySetChanged = null;
        this.reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches || false;
        this.lastProjection = null;
        this.lastView = null;
        this.configuration = null;
        this.dragging = false;
        this.lastPointer = { x: 0, y: 0 };
        this.resetView();
        this.installInteraction();
      }

      createMesh(geometry) {
        const gl = this.gl;
        const vertexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(geometry.vertices), gl.STATIC_DRAW);
        const indexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(geometry.indices), gl.STATIC_DRAW);
        return { vertexBuffer, indexBuffer, count: geometry.indices.length, mode: gl.TRIANGLES };
      }

      createLineMesh(vertices) {
        const gl = this.gl;
        const vertexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
        return { vertexBuffer, indexBuffer: null, count: vertices.length / 3, mode: gl.LINES };
      }

      createPolylineMesh(points) {
        const gl = this.gl;
        const vertexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(points.flat()), gl.STATIC_DRAW);
        return { vertexBuffer, indexBuffer: null, count: points.length, mode: gl.LINE_STRIP };
      }

      destroyMesh(mesh) {
        if (!mesh) return;
        this.gl.deleteBuffer(mesh.vertexBuffer);
        if (mesh.indexBuffer) this.gl.deleteBuffer(mesh.indexBuffer);
      }

      clearStaticPath(renderAfter = true) {
        for (const entry of this.pathMeshes) this.destroyMesh(entry.mesh);
        this.destroyMesh(this.pathLineMesh);
        this.pathMeshes = [];
        this.pathLineMesh = null;
        this.staticPathPoints = [];
        this.turnMarkers = [];
        this.radialTurnMarker = null;
        this.staticPathHovered = false;
        this.staticAnnotationsPinned = false;
        this.targetTurnCount = 0;
        if (renderAfter) this.render();
      }

      setAnimationMode(mode, params = null) {
        this.visibleAnimationMode = mode;
        if (params) {
          const basis = observerBasis(params.inclination);
          this.setConfiguration(params, basis);
        }
        if (mode !== "whole") {
          this.clearStaticPath(false);
          this.maxPathRadius = ANIMATION_RADIUS;
        }
        this.staticPathHovered = false;
        this.staticAnnotationsPinned = false;
        this.render();
        this.ensureAnimationLoop();
      }

      setTrailFraction(value) {
        this.trailFraction = clamp(value, 0.04, 0.45);
        this.drawOverlayFrame(performance.now());
      }

      setPlaybackDirection(direction) {
        this.playbackDirection = direction === "forward" ? "forward" : "reverse";
        const clockNow = this.animationPaused ? this.pauseStartedAt : performance.now();
        const restartAt = clockNow + 140;
        for (const ray of this.animatedRays) {
          if (ray.mode === this.visibleAnimationMode) ray.startTime = restartAt;
        }
        this.drawOverlayFrame(clockNow);
        this.ensureAnimationLoop();
      }

      setAnimationPaused(paused) {
        const nextPaused = Boolean(paused);
        if (nextPaused === this.animationPaused) return this.animationPaused;
        const now = performance.now();
        if (nextPaused) {
          this.drawOverlayFrame(now);
          this.animationPaused = true;
          this.pauseStartedAt = now;
          if (this.animationFrameId !== null) {
            cancelAnimationFrame(this.animationFrameId);
            this.animationFrameId = null;
          }
        } else {
          const pausedDuration = Math.max(0, now - (this.pauseStartedAt ?? now));
          for (const ray of this.animatedRays) {
            if (Number.isFinite(ray.startTime)) ray.startTime += pausedDuration;
          }
          this.animationPaused = false;
          this.pauseStartedAt = null;
          this.drawOverlayFrame(now);
          this.ensureAnimationLoop();
        }
        return this.animationPaused;
      }

      animationStartTime(requestedStartTime) {
        if (!this.animationPaused || !Number.isFinite(requestedStartTime)) {
          return requestedStartTime;
        }
        const leadTime = Math.max(0, requestedStartTime - performance.now());
        return (this.pauseStartedAt ?? performance.now()) + leadTime;
      }

      animatedRayCount(mode) {
        return this.animatedRays.filter(ray => ray.mode === mode).length;
      }

      clearAnimatedRays(mode) {
        const previousLength = this.animatedRays.length;
        this.animatedRays = this.animatedRays.filter(ray => ray.mode !== mode);
        if (!this.animatedRays.some(ray => ray.mode === this.visibleAnimationMode)
          && this.animationFrameId !== null) {
          cancelAnimationFrame(this.animationFrameId);
          this.animationFrameId = null;
        }
        if (this.animatedRays.length !== previousLength) this.onRaySetChanged?.();
        this.drawOverlayFrame(performance.now());
      }

      removeAnimatedRay(rayId) {
        const previousLength = this.animatedRays.length;
        this.animatedRays = this.animatedRays.filter(ray => ray.id !== rayId);
        if (!this.animatedRays.some(ray => ray.mode === this.visibleAnimationMode)
          && this.animationFrameId !== null) {
          cancelAnimationFrame(this.animationFrameId);
          this.animationFrameId = null;
        }
        if (this.animatedRays.length !== previousLength) this.onRaySetChanged?.();
        this.drawOverlayFrame(performance.now());
      }

      addAnimatedRay(result, params, mode, sharedStartTime = performance.now()) {
        if (!result?.points || result.points.length < 2) return null;
        const basis = observerBasis(params.inclination);
        this.setConfiguration(params, basis);
        const impact = Math.hypot(params.u, params.v);
        const screenOffset = vecAdd(vecScale(basis.alpha, params.u), vecScale(basis.beta, params.v));
        const transverse = impact > 1e-12 ? vecNormalize(screenOffset) : basis.alpha;

        let first = 0;
        while (first < result.points.length - 1 && result.points[first].r > ANIMATION_RADIUS) first += 1;
        first = Math.max(0, first - 1);
        let last = result.points.length - 1;
        if (result.status === "escape") {
          while (last > first && result.points[last].r > ANIMATION_RADIUS) last -= 1;
          last = Math.min(result.points.length - 1, last + 1);
        }
        if (last - first < 1) return null;

        const clipped = result.points.slice(first, last + 1);
        const stride = Math.max(1, Math.ceil(clipped.length / 1800));
        const sampled = clipped.filter((point, index) => index % stride === 0 || index === clipped.length - 1);
        const affineStart = Number.isFinite(sampled[0].affine) ? sampled[0].affine : 0;
        const affineEnd = Number.isFinite(sampled[sampled.length - 1].affine)
          ? sampled[sampled.length - 1].affine
          : sampled.length - 1;
        const affineSpan = Math.max(1e-9, affineEnd - affineStart);
        const animationPoints = sampled.map((point, index) => ({
          world: vecAdd(vecScale(basis.radial, point.x), vecScale(transverse, point.y)),
          affine: Number.isFinite(point.affine)
            ? point.affine
            : affineStart + affineSpan * index / Math.max(1, sampled.length - 1),
          progress: Number.isFinite(point.affine)
            ? (point.affine - affineStart) / affineSpan
            : index / Math.max(1, sampled.length - 1)
        }));

        const ray = {
          id: this.nextAnimationRayId++,
          mode,
          points: animationPoints,
          startTime: this.animationStartTime(sharedStartTime),
          affineStart,
          affineEnd,
          affineSpan,
          timelineStart: affineStart,
          timelineEnd: affineEnd,
          duration: clamp(affineSpan * 95, 4200, 11500),
          gap: 900,
          loop: mode !== "single"
        };
        this.animatedRays.push(ray);
        this.onRaySetChanged?.();
        this.visibleAnimationMode = mode;
        this.render();
        this.ensureAnimationLoop();
        return ray.id;
      }

      synchronizeAnimatedGroup(mode, sharedStartTime = performance.now()) {
        const rays = this.animatedRays.filter(ray => ray.mode === mode);
        if (!rays.length) return;

        // Every ray starts at the same observer event with the same affine
        // normalization.  Use one affine clock for the whole bundle so an
        // incoming wavefront stays synchronized on every repeated pass.
        const timelineStart = Math.max(...rays.map(ray => ray.affineStart));
        const timelineEnd = Math.max(timelineStart + 1e-9, ...rays.map(ray => ray.affineEnd));
        const affineSpan = timelineEnd - timelineStart;
        const duration = clamp(affineSpan * 95, 4200, 11500);

        const synchronizedStartTime = this.animationStartTime(sharedStartTime);
        for (const ray of rays) {
          ray.startTime = synchronizedStartTime;
          ray.timelineStart = timelineStart;
          ray.timelineEnd = timelineEnd;
          ray.duration = duration;
          ray.gap = 900;
        }
        this.drawOverlayFrame(performance.now());
        this.ensureAnimationLoop();
      }

      setConfiguration(params, basis) {
        const observer = vecScale(basis.radial, params.distance);
        const screenOffset = vecAdd(vecScale(basis.alpha, params.u), vecScale(basis.beta, params.v));
        const initialDirection = vecNormalize(vecAdd(
          vecScale(basis.radial, -params.distance),
          screenOffset
        ));
        this.configuration = {
          basis,
          inclination: params.inclination,
          distance: params.distance,
          observer,
          initialDirection,
          pastBoundary: null,
          farPastRadius: null
        };
      }

      setPath(points2D, u, v, inclination, distance, targetTurnCount = 0, status = "") {
        this.clearStaticPath(false);
        this.visibleAnimationMode = "whole";
        this.targetTurnCount = targetTurnCount;

        const basis = observerBasis(inclination);
        this.setConfiguration({ u, v, inclination, distance }, basis);
        if (!points2D || points2D.length < 2) {
          this.render();
          return;
        }

        const impact = Math.hypot(u, v);
        const screenOffset = vecAdd(vecScale(basis.alpha, u), vecScale(basis.beta, v));
        const transverse = impact > 1e-12 ? vecNormalize(screenOffset) : basis.alpha;
        const planeNormal = vecNormalize(vecCross(basis.radial, transverse));
        this.planeNormal = planeNormal;
        const stride = Math.max(1, Math.ceil(points2D.length / 5000));
        const sampledPoints = points2D.filter((point, index) => index % stride === 0 || index === points2D.length - 1);
        const points3D = sampledPoints.map(point => vecAdd(
          vecScale(basis.radial, point.x),
          vecScale(transverse, point.y)
        ));
        this.maxPathRadius = Math.max(12, ...sampledPoints.map(point => point.r));
        this.configuration.pastBoundary = points3D[points3D.length - 1];
        this.configuration.farPastRadius = points2D[points2D.length - 1].r;
        this.configuration.pathStatus = status;
        this.staticPathPoints = points3D;
        this.pathLineMesh = this.createPolylineMesh(points3D);

        if (status === "escape") {
          let closestIndex = 0;
          for (let index = 1; index < points2D.length; index += 1) {
            if (points2D[index].r < points2D[closestIndex].r) closestIndex = index;
          }
          const closest = points2D[closestIndex];
          this.radialTurnMarker = vecAdd(
            vecScale(basis.radial, closest.x),
            vecScale(transverse, closest.y)
          );
        }

        if (targetTurnCount > 0 && Number.isFinite(points2D[0]?.phi)) {
          const initialPhi = points2D[0].phi;
          let searchIndex = 1;
          for (let turn = 1; turn <= targetTurnCount; turn += 1) {
            const targetPhi = turn * TWO_PI;
            while (searchIndex < points2D.length && points2D[searchIndex].phi < targetPhi) {
              searchIndex += 1;
            }
            if (searchIndex >= points2D.length) break;
            const before = points2D[Math.max(0, searchIndex - 1)];
            const after = points2D[searchIndex];
            const span = Math.max(1e-30, after.phi - before.phi);
            const fraction = clamp((targetPhi - before.phi) / span, 0, 1);
            const x = before.x + fraction * (after.x - before.x);
            const y = before.y + fraction * (after.y - before.y);
            this.turnMarkers.push({
              turn,
              point: vecAdd(vecScale(basis.radial, x), vecScale(transverse, y))
            });
          }
        }

        const layers = [
          { radius: 0.060, color: [0.95, 0.18, 0.04, 0.14] },
          { radius: 0.030, color: [1.00, 0.40, 0.03, 0.60] },
          { radius: 0.011, color: [1.00, 0.78, 0.16, 1.00] }
        ];
        this.pathMeshes = layers.map(layer => ({
          mesh: this.createMesh(tubeGeometry(points3D, planeNormal, layer.radius)),
          color: layer.color
        }));
        this.render();
      }

      resetView() {
        this.viewMode = "near";
        if (this.planeNormal && vecDot(this.planeNormal, this.planeNormal) > 0.5) {
          this.yaw = Math.atan2(this.planeNormal[1], this.planeNormal[0]);
          this.pitch = Math.asin(clamp(this.planeNormal[2], -0.98, 0.98));
        } else {
          this.yaw = 0.80;
          this.pitch = 0.34;
        }
        this.distance = 22;
        if (this.gl) this.render();
      }

      fitFullPath() {
        this.viewMode = "full";
        this.distance = clamp(2.8 * (this.maxPathRadius || 12), 22, 5000000);
        if (this.gl) this.render();
      }

      staticPathHitAt(clientX, clientY, tolerance = 10) {
        if (this.visibleAnimationMode !== "whole"
          || this.staticPathPoints.length < 2
          || !this.lastProjection
          || !this.lastView) return false;
        const rect = this.canvas.getBoundingClientRect();
        const targetX = clientX - rect.left;
        const targetY = clientY - rect.top;
        const toleranceSquared = tolerance * tolerance;
        const stride = Math.max(1, Math.floor(this.staticPathPoints.length / 1200));
        let previous = this.projectPoint(this.staticPathPoints[0], this.lastProjection, this.lastView);

        for (let index = stride; index < this.staticPathPoints.length; index += stride) {
          const current = this.projectPoint(
            this.staticPathPoints[Math.min(index, this.staticPathPoints.length - 1)],
            this.lastProjection,
            this.lastView
          );
          if (previous?.visible && current?.visible) {
            const dx = current.x - previous.x;
            const dy = current.y - previous.y;
            const lengthSquared = dx * dx + dy * dy;
            const fraction = lengthSquared > 0
              ? clamp(((targetX - previous.x) * dx + (targetY - previous.y) * dy) / lengthSquared, 0, 1)
              : 0;
            const nearestX = previous.x + fraction * dx;
            const nearestY = previous.y + fraction * dy;
            const distanceSquared = (targetX - nearestX) ** 2 + (targetY - nearestY) ** 2;
            if (distanceSquared <= toleranceSquared) return true;
          }
          previous = current;
        }
        const lastPoint = this.staticPathPoints[this.staticPathPoints.length - 1];
        const projectedLast = this.projectPoint(lastPoint, this.lastProjection, this.lastView);
        return Boolean(projectedLast?.visible
          && (targetX - projectedLast.x) ** 2 + (targetY - projectedLast.y) ** 2 <= toleranceSquared);
      }

      staticAnnotationsVisible() {
        return this.visibleAnimationMode === "whole"
          && (this.staticPathHovered || this.staticAnnotationsPinned);
      }

      installInteraction() {
        this.canvas.addEventListener("pointerdown", event => {
          if (event.button !== 0) return;
          this.dragging = true;
          this.pointerTravel = 0;
          this.lastPointer = { x: event.clientX, y: event.clientY };
          this.canvas.setPointerCapture(event.pointerId);
        });
        this.canvas.addEventListener("pointermove", event => {
          if (!this.dragging) {
            const hovered = this.staticPathHitAt(event.clientX, event.clientY);
            if (hovered !== this.staticPathHovered) {
              this.staticPathHovered = hovered;
              this.canvas.style.cursor = hovered ? "pointer" : "grab";
              this.drawOverlayFrame(performance.now());
            }
            return;
          }
          const dx = event.clientX - this.lastPointer.x;
          const dy = event.clientY - this.lastPointer.y;
          this.pointerTravel += Math.hypot(dx, dy);
          this.lastPointer = { x: event.clientX, y: event.clientY };
          this.staticPathHovered = false;
          this.yaw -= dx * 0.007;
          this.pitch = clamp(this.pitch + dy * 0.007, -Math.PI / 2, Math.PI / 2);
          this.viewMode = "custom";
          this.render();
        });
        const endDrag = event => {
          const wasClick = this.dragging && this.pointerTravel < 4;
          this.dragging = false;
          if (wasClick) {
            const hit = this.staticPathHitAt(event.clientX, event.clientY);
            this.staticAnnotationsPinned = hit ? !this.staticAnnotationsPinned : false;
            this.staticPathHovered = hit;
          }
          this.canvas.style.cursor = this.staticPathHovered ? "pointer" : "grab";
          this.drawOverlayFrame(performance.now());
        };
        this.canvas.addEventListener("pointerup", endDrag);
        this.canvas.addEventListener("pointercancel", () => {
          this.dragging = false;
          this.pointerTravel = 0;
        });
        this.canvas.addEventListener("pointerleave", () => {
          if (this.dragging || !this.staticPathHovered) return;
          this.staticPathHovered = false;
          this.canvas.style.cursor = "grab";
          this.drawOverlayFrame(performance.now());
        });
        this.canvas.addEventListener("wheel", event => {
          event.preventDefault();
          this.distance = clamp(this.distance * Math.exp(event.deltaY * 0.0012), 4.2, 5000000);
          this.viewMode = "custom";
          this.render();
        }, { passive: false });
        this.canvas.addEventListener("dblclick", () => this.resetView());
      }

      drawStarfield(width, height) {
        const ctx = this.starContext;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#02040a";
        ctx.fillRect(0, 0, width, height);

        let seed = (Math.imul(width, 73856093) ^ Math.imul(height, 19349663) ^ 0x9e3779b9) >>> 0;
        const random = () => {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        const starCount = clamp(Math.round(width * height / 3000), 110, 360);
        for (let index = 0; index < starCount; index += 1) {
          const x = random() * width;
          const y = random() * height;
          const kind = random();
          const radius = kind > 0.985 ? 1.35 : kind > 0.86 ? 0.82 : 0.48;
          const opacity = 0.28 + 0.64 * Math.pow(random(), 1.6);
          const tint = random();
          const color = tint > 0.88
            ? [208, 224, 255]
            : tint < 0.08
              ? [255, 232, 205]
              : [242, 246, 255];
          ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${opacity})`;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, TWO_PI);
          ctx.fill();
        }
      }

      resize() {
        const rect = this.wrapper.getBoundingClientRect();
        const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
        const cssWidth = Math.max(1, Math.round(rect.width));
        const cssHeight = Math.max(1, Math.round(rect.height));
        const width = Math.round(cssWidth * dpr);
        const height = Math.round(cssHeight * dpr);
        if (this.canvas.width !== width || this.canvas.height !== height) {
          this.canvas.width = width;
          this.canvas.height = height;
        }
        if (this.overlay.width !== width || this.overlay.height !== height) {
          this.overlay.width = width;
          this.overlay.height = height;
        }
        const starNeedsRedraw = this.starCanvas.width !== width
          || this.starCanvas.height !== height
          || this.starCssWidth !== cssWidth
          || this.starCssHeight !== cssHeight;
        if (this.starCanvas.width !== width || this.starCanvas.height !== height) {
          this.starCanvas.width = width;
          this.starCanvas.height = height;
        }
        if (this.rimCanvas.width !== width || this.rimCanvas.height !== height) {
          this.rimCanvas.width = width;
          this.rimCanvas.height = height;
        }
        this.overlayContext.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.starContext.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.rimContext.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.overlayWidth = cssWidth;
        this.overlayHeight = cssHeight;
        if (starNeedsRedraw) {
          this.starCssWidth = cssWidth;
          this.starCssHeight = cssHeight;
